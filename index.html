    <script src="script.js"></script>



    <!-- نظام الحساب + تسجيل الزيارات -->

    <script>


        // ==========================================
        // تسجيل زيارة الصفحة الرئيسية
        // ==========================================

        async function recordHomePageVisit() {

            // معرفة المستخدم الحالي
            const {
                data: { user },
                error: userError
            } = await supabaseClient.auth.getUser();


            // إذا لم يوجد مستخدم
            if (userError || !user) {

                return;

            }


            // البحث عن المستخدم في جدول الزيارات
            const {
                data: visit,
                error: visitError
            } = await supabaseClient
                .from("home_page_visits")
                .select("visit_count")
                .eq("user_id", user.id)
                .maybeSingle();


            // إذا حدث خطأ
            if (visitError) {

                console.error(
                    "خطأ في قراءة الزيارات:",
                    visitError
                );

                return;

            }


            // ==========================================
            // المستخدم دخل من قبل
            // ==========================================

            if (visit) {

                const newCount =
                    (visit.visit_count || 0) + 1;


                const {
                    error: updateError
                } = await supabaseClient
                    .from("home_page_visits")
                    .update({
                     username: user.user_metadata?.name || user.email?.split("@")[0] || "مستخدم",
                     visit_count: newCount,
                     last_visit_at: new Date().toISOString()
                    })
                    .eq("user_id", user.id);


                if (updateError) {

                    console.error(
                        "خطأ في تحديث عدد الزيارات:",
                        updateError
                    );

                }

            }


            // ==========================================
            // أول زيارة للمستخدم
            // ==========================================

            else {

                const {
                    error: insertError
                } = await supabaseClient
                    .from("home_page_visits")
                   .insert({
                 user_id: user.id,
                 username: user.user_metadata?.name || user.email?.split("@")[0] || "مستخدم",
                  visit_count: 1,
                 last_visit_at: new Date().toISOString()
                  });


                if (insertError) {

                    console.error(
                        "خطأ في تسجيل الزيارة:",
                        insertError
                    );

                }

            }

        }



        // ==========================================
        // التأكد من تسجيل الدخول
        // ==========================================

        async function loadUser() {

            const {
                data: { user },
                error
            } = await supabaseClient.auth.getUser();


            // إذا ما فيه مستخدم
            if (error || !user) {

                window.location.href =
                    "login.html";

                return;

            }


            // اسم المستخدم
            const name =
                user.user_metadata?.name ||
                user.email?.split("@")[0] ||
                "مستخدم";


            // البريد
            const email =
                user.email || "";


            // عرض الاسم
            document.getElementById(
                "welcomeText"
            ).textContent =
                "مرحباً " + name + " 👋";


            // عرض البريد
            document.getElementById(
                "userEmail"
            ).textContent =
                email;


            // أول حرف من الاسم
            document.getElementById(
                "userAvatar"
            ).textContent =
                name.charAt(0).toUpperCase();

        }



        // ==========================================
        // تسجيل الخروج
        // ==========================================

        async function logout() {

            const { error } =
                await supabaseClient.auth.signOut();


            if (error) {

                alert(
                    "حدث خطأ أثناء تسجيل الخروج"
                );

                return;

            }


            window.location.href =
                "login.html";

        }



        // ==========================================
        // تشغيل الأنظمة
        // ==========================================

        loadUser();

        recordHomePageVisit();


    </script>
