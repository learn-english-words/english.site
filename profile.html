
<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3809987460267480"
     crossorigin="anonymous"></script>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>الملف الشخصي</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="supabase.js"></script>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f7fb;
        }

        .container {
            width: 90%;
            max-width: 500px;
            margin: 50px auto;
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 5px 20px rgba(0,0,0,.08);
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
        }

        .avatar {
            width: 90px;
            height: 90px;
            margin: 0 auto 20px;
            border-radius: 50%;
            background: #2563eb;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 35px;
            font-weight: bold;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        input[type="text"] {
            width: 100%;
            padding: 13px;
            border: 1px solid #ddd;
            border-radius: 10px;
            margin-bottom: 10px;
            font-size: 16px;
            direction: ltr;
            text-align: left;
        }

        .name-hint {
            color: #777;
            font-size: 13px;
            margin-bottom: 25px;
        }

        .privacy-title {
            font-weight: bold;
            margin-bottom: 12px;
        }

        .privacy-box {
            background: #f7f8fc;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 20px;
        }

        .option {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            margin-bottom: 15px;
            cursor: pointer;
        }

        .option:last-child {
            margin-bottom: 0;
        }

        .option input {
            width: auto;
            margin: 4px 0 0;
        }

        .option-text {
            display: block;
        }

        .option-title {
            font-weight: bold;
            display: block;
            margin-bottom: 5px;
        }

        .option-description {
            color: #666;
            font-size: 14px;
            line-height: 1.6;
        }

        .save-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        .save-btn:hover {
            background: #1d4ed8;
        }

        .back-btn {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            border: none;
            border-radius: 10px;
            background: #eee;
            cursor: pointer;
            font-size: 15px;
        }

        #status {
            text-align: center;
            margin-top: 15px;
            font-weight: bold;
            line-height: 1.6;
        }

    </style>

</head>


<body>


<div class="container">


    <h1>
        👤 الملف الشخصي
    </h1>


    <div
        class="avatar"
        id="avatar">

        ?

    </div>


    <!-- الاسم -->

    <label for="nameInput">
        اسم المستخدم
    </label>


    <input
        type="text"
        id="nameInput"
        placeholder="مثال: Sultan"
        maxlength="20"
        autocomplete="off"
    >


    <div class="name-hint">
        🇬🇧 استخدم حروف إنجليزية فقط من A إلى Z، والاسم من 2 إلى 20 حرفًا.
        الاسم يجب أن يكون غير مستخدم من شخص آخر.
    </div>



    <!-- الخصوصية -->

    <div class="privacy-title">

        ظهور حسابك في الدردشة

    </div>


    <div class="privacy-box">


        <!-- عام -->

        <label class="option">

            <input
                type="radio"
                name="privacy"
                value="public"
                id="publicOption"
            >


            <span class="option-text">

                <span class="option-title">
                    🌐 عام
                </span>

                <span class="option-description">

                    سيظهر اسمك للمستخدمين الآخرين في قائمة الدردشة.

                </span>

            </span>

        </label>



        <!-- خاص -->

        <label class="option">

            <input
                type="radio"
                name="privacy"
                value="private"
                id="privateOption"
            >


            <span class="option-text">

                <span class="option-title">
                    🔒 خاص
                </span>

                <span class="option-description">

                    لن يظهر حسابك للمستخدمين الآخرين في قائمة الدردشة.

                </span>

            </span>

        </label>


    </div>



    <!-- حفظ -->

    <button
        class="save-btn"
        onclick="saveProfile()">

        💾 حفظ التغييرات

    </button>


    <button
        class="back-btn"
        onclick="window.location.href='index.html'">

        ← العودة

    </button>


    <div id="status"></div>


</div>



<script>


// ==========================================
// المستخدم الحالي
// ==========================================

let currentUser = null;



// ==========================================
// تحميل الملف الشخصي
// ==========================================

async function loadProfile() {

    const {
        data: { user },
        error
    } = await supabaseClient.auth.getUser();


    if (error || !user) {

        window.location.href = "login.html";

        return;

    }


    currentUser = user;


    // قراءة الاسم من profiles أولًا
    const {
        data: profile,
        error: profileError
    } = await supabaseClient
        .from("profiles")
        .select("display_name, is_public")
        .eq("id", user.id)
        .maybeSingle();


    if (profileError) {

        console.error(profileError);

        showStatus(
            "حدث خطأ أثناء تحميل الملف الشخصي",
            "red"
        );

        return;

    }


    // الاسم
    const name =
        profile?.display_name ||
        user.user_metadata?.name ||
        "User";


    document.getElementById(
        "nameInput"
    ).value = name;


    document.getElementById(
        "avatar"
    ).textContent =
        name.charAt(0).toUpperCase();


    // الخصوصية
    if (
        profile &&
        profile.is_public === false
    ) {

        document.getElementById(
            "privateOption"
        ).checked = true;

    } else {

        document.getElementById(
            "publicOption"
        ).checked = true;

    }

}



// ==========================================
// حفظ الملف الشخصي
// ==========================================

async function saveProfile() {

    const newName =
        document.getElementById(
            "nameInput"
        ).value.trim();


    // ==========================================
    // التحقق من الاسم
    // ==========================================

    if (!newName) {

        showStatus(
            "اكتب اسم المستخدم أولًا",
            "red"
        );

        return;

    }


    if (newName.length < 2) {

        showStatus(
            "الاسم يجب أن يكون حرفين على الأقل",
            "red"
        );

        return;

    }


    if (newName.length > 20) {

        showStatus(
            "الاسم يجب ألا يتجاوز 20 حرفًا",
            "red"
        );

        return;

    }


    // إنجليزي فقط
    const englishNameRegex =
        /^[A-Za-z]+$/;


    if (!englishNameRegex.test(newName)) {

        showStatus(
            "❌ استخدم حروف إنجليزية فقط، مثل: Sultan",
            "red"
        );

        return;

    }



    // ==========================================
    // معرفة الخصوصية
    // ==========================================

    const isPublic =
        document.getElementById(
            "publicOption"
        ).checked;



    // ==========================================
    // التأكد أن الاسم غير مستخدم
    // ==========================================

    const {
        data: existingUsers,
        error: checkError
    } = await supabaseClient
        .from("profiles")
        .select("id, display_name")
        .ilike(
            "display_name",
            newName
        )
        .neq(
            "id",
            currentUser.id
        );


    if (checkError) {

        console.error(checkError);

        showStatus(
            "حدث خطأ أثناء التحقق من الاسم",
            "red"
        );

        return;

    }


    if (
        existingUsers &&
        existingUsers.length > 0
    ) {

        showStatus(
            "❌ هذا الاسم مستخدم بالفعل، اختر اسمًا آخر",
            "red"
        );

        return;

    }



    // ==========================================
    // تحديث الاسم في Auth
    // ==========================================

    const {
        error: authError
    } = await supabaseClient.auth.updateUser({

        data: {

            name: newName

        }

    });


    if (authError) {

        console.error(authError);

        showStatus(
            "حدث خطأ أثناء حفظ الاسم",
            "red"
        );

        return;

    }



    // ==========================================
    // تحديث profiles
    // ==========================================

    const {
        error: profileError
    } = await supabaseClient

        .from("profiles")

        .update({

            display_name: newName,

            is_public: isPublic

        })

        .eq(
            "id",
            currentUser.id
        );


    if (profileError) {

        console.error(profileError);

        // خطأ التكرار من قاعدة البيانات
        if (
            profileError.code === "23505"
        ) {

            showStatus(
                "❌ هذا الاسم مستخدم بالفعل، اختر اسمًا آخر",
                "red"
            );

            return;

        }


        showStatus(
            "حدث خطأ أثناء حفظ إعدادات الملف الشخصي",
            "red"
        );

        return;

    }



    // ==========================================
    // تحديث الصورة
    // ==========================================

    document.getElementById(
        "avatar"
    ).textContent =
        newName.charAt(0).toUpperCase();



    showStatus(
        "تم حفظ التغييرات بنجاح ✅",
        "green"
    );

}



// ==========================================
// رسالة الحالة
// ==========================================

function showStatus(
    message,
    color
) {

    const status =
        document.getElementById(
            "status"
        );


    status.textContent =
        message;


    status.style.color =
        color;

}



// ==========================================
// تشغيل
// ==========================================

loadProfile();


</script>



<script src="supabase.js"></script>
    <script src="notifications.js"></script>

</body>

</html>
