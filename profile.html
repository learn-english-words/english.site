
<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>الملف الشخصي</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="supabase.js"></script>


    <style>

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            font-family: Arial, sans-serif;

            background: #f5f7fb;

        }


        .container {

            width: 90%;

            max-width: 500px;

            margin: 50px auto;

            background: white;

            padding: 30px;

            border-radius: 20px;

            box-shadow: 0 5px 20px rgba(0,0,0,.08);

        }


        h1 {

            text-align: center;

            margin-bottom: 30px;

        }


        .avatar {

            width: 90px;

            height: 90px;

            margin: 0 auto 20px;

            border-radius: 50%;

            background: #2563eb;

            color: white;

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 35px;

            font-weight: bold;

        }


        label {

            display: block;

            margin-bottom: 8px;

            font-weight: bold;

        }


        input {

            width: 100%;

            padding: 13px;

            border: 1px solid #ddd;

            border-radius: 10px;

            margin-bottom: 20px;

            font-size: 16px;

        }


        .save-btn {

            width: 100%;

            padding: 14px;

            border: none;

            border-radius: 10px;

            background: #2563eb;

            color: white;

            font-size: 16px;

            cursor: pointer;

        }


        .save-btn:hover {

            background: #1d4ed8;

        }


        .back-btn {

            width: 100%;

            padding: 12px;

            margin-top: 10px;

            border: none;

            border-radius: 10px;

            background: #eee;

            cursor: pointer;

        }


        #status {

            text-align: center;

            margin-top: 15px;

            font-weight: bold;

        }

    </style>

</head>


<body>


<div class="container">


    <h1>
        👤 الملف الشخصي
    </h1>


    <div
        class="avatar"
        id="avatar">

        ?

    </div>


    <label>
        اسمك
    </label>


    <input
        type="text"
        id="nameInput"
        placeholder="اكتب اسمك"
        maxlength="30"
    >


    <button
        class="save-btn"
        onclick="saveProfile()">

        💾 حفظ الاسم

    </button>


    <button
        class="back-btn"
        onclick="window.location.href='index.html'">

        ← العودة

    </button>


    <div id="status"></div>


</div>



<script>


// ==========================================
// المتغيرات
// ==========================================

let currentUser = null;



// ==========================================
// تحميل المستخدم
// ==========================================

async function loadProfile() {


    const {

        data: { user },

        error

    } = await supabaseClient.auth.getUser();


    if (error || !user) {

        window.location.href =
            "login.html";

        return;

    }


    currentUser = user;


    const name =

        user.user_metadata?.name ||

        user.email?.split("@")[0] ||

        "مستخدم";


    document.getElementById(
        "nameInput"
    ).value = name;


    document.getElementById(
        "avatar"
    ).textContent =
        name.charAt(0).toUpperCase();

}



// ==========================================
// حفظ الاسم
// ==========================================

async function saveProfile() {


    const input =
        document.getElementById("nameInput");


    const newName =
        input.value.trim();


    if (!newName) {

        showStatus(
            "اكتب اسمًا أولًا",
            "red"
        );

        return;

    }


    if (newName.length < 2) {

        showStatus(
            "الاسم قصير جدًا",
            "red"
        );

        return;

    }


    // تحديث اسم الحساب في Supabase Auth

    const {

        data,

        error

    } = await supabaseClient.auth.updateUser({

        data: {

            name: newName

        }

    });


    if (error) {

        console.error(error);

        showStatus(
            "حدث خطأ أثناء حفظ الاسم",
            "red"
        );

        return;

    }


    // تحديث الاسم في profiles

    const {

        error: profileError

    } = await supabaseClient

        .from("profiles")

        .update({

            display_name: newName

        })

        .eq(
            "id",
            currentUser.id
        );


    if (profileError) {

        console.error(profileError);

        showStatus(
            "تم تغيير الاسم لكن حدث خطأ في الملف الشخصي",
            "orange"
        );

        return;

    }


    document.getElementById(
        "avatar"
    ).textContent =
        newName.charAt(0).toUpperCase();


    showStatus(
        "تم حفظ الاسم بنجاح ✅",
        "green"
    );

}



// ==========================================
// رسالة الحالة
// ==========================================

function showStatus(
    message,
    color
) {

    const status =
        document.getElementById("status");


    status.textContent =
        message;


    status.style.color =
        color;

}



// ==========================================
// تشغيل
// ==========================================

loadProfile();


</script>


</body>

</html>
