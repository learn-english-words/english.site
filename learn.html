
<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>تعلم الكلمات</title>

    <link rel="stylesheet" href="learn.css">
</head>

<body>

    <header class="topbar">

        <button class="back-btn" onclick="goHome()">
            ← الرئيسية
        </button>

        <div class="page-title">
            📚 تعلم الكلمات
        </div>

    </header>


    <main class="container">

        <section class="intro">
            <div>
                <span>ابدأ رحلتك 🚀</span>
                <h1>اختر مستواك</h1>
                <p>
                    اختر المستوى المناسب لك، وبعدها اختر التصنيف
                    الذي تريد تعلم كلماته.
                </p>
            </div>
        </section>


        <!-- المستويات -->

        <h2>📊 المستوى</h2>

        <section class="levels">

            <button class="level-card" onclick="selectLevel(this, 'A1')">
                <strong>A1</strong>
                <div>
                    <h3>مبتدئ</h3>
                    <p>كلمات إنجليزية أساسية وسهلة</p>
                </div>
            </button>


            <button class="level-card" onclick="selectLevel(this, 'A2')">
                <strong>A2</strong>
                <div>
                    <h3>متوسط</h3>
                    <p>كلمات أكثر تنوعًا واستخدامًا</p>
                </div>
            </button>


            <button class="level-card" onclick="selectLevel(this, 'B1')">
                <strong>B1</strong>
                <div>
                    <h3>متقدم</h3>
                    <p>كلمات أصعب ومفيدة للمحادثة</p>
                </div>
            </button>

        </section>


        <!-- التصنيفات -->

        <h2>🗂️ اختر التصنيف</h2>

        <section class="categories">

            <button class="category-card" onclick="selectCategory(this, 'home')">
                <span>🏠</span>
                <strong>المنزل</strong>
                <small>Home</small>
            </button>

            <button class="category-card" onclick="selectCategory(this, 'food')">
                <span>🍔</span>
                <strong>الطعام</strong>
                <small>Food</small>
            </button>

            <button class="category-card" onclick="selectCategory(this, 'cars')">
                <span>🚗</span>
                <strong>السيارات</strong>
                <small>Cars</small>
            </button>

            <button class="category-card" onclick="selectCategory(this, 'clothes')">
                <span>👕</span>
                <strong>الملابس</strong>
                <small>Clothes</small>
            </button>

            <button class="category-card" onclick="selectCategory(this, 'family')">
                <span>👨‍👩‍👧</span>
                <strong>العائلة</strong>
                <small>Family</small>
            </button>

            <button class="category-card" onclick="selectCategory(this, 'nature')">
                <span>🌳</span>
                <strong>الطبيعة</strong>
                <small>Nature</small>
            </button>

        </section>


        <button id="startBtn" class="start-btn" onclick="startLearning()" disabled>
            ابدأ التعلم 🚀
        </button>

    </main>


    <script src="learn.js"></script>

</body>
</html>
