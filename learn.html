<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>تعلم الكلمات | EnglishWords</title>

    <link rel="stylesheet" href="learn.css">
</head>

<body>

<header class="topbar">

    <button class="back-btn" onclick="goHome()">
        <span>→</span>
        الرئيسية
    </button>

    <div class="page-title">
        <span class="title-icon">📚</span>
        <span>تعلم الكلمات</span>
    </div>

</header>


<main class="container">

    <!-- المقدمة -->
    <section class="intro">

        <div class="intro-content">

            <div class="intro-label">
                ✨ ابدأ رحلتك
            </div>

            <h1>
                تعلم الإنجليزية
                <br>
                <span>بطريقة أسهل 🚀</span>
            </h1>

            <p>
                اختر مستواك أولًا، ثم اختر التصنيف
                الذي تريد تعلم كلماته.
            </p>

        </div>

        <div class="intro-decoration">
            <div class="floating-book">📚</div>
            <div class="floating-star star-one">✦</div>
            <div class="floating-star star-two">✦</div>
        </div>

    </section>


    <!-- المستوى -->
    <div class="section-heading">

        <div class="heading-content">

            <span class="section-number">01</span>

            <div>
                <h2>اختر مستواك</h2>
                <p>اختر المستوى المناسب لك</p>
            </div>

        </div>

    </div>


    <section class="levels">

        <button
            type="button"
            class="level-card"
            onclick="selectLevel(this, 'A1')">

            <div class="level-badge">A1</div>

            <div class="level-content">
                <h3>مبتدئ</h3>
                <p>كلمات إنجليزية أساسية وسهلة</p>
            </div>

            <div class="select-circle">✓</div>

        </button>


        <button
            type="button"
            class="level-card"
            onclick="selectLevel(this, 'A2')">

            <div class="level-badge">A2</div>

            <div class="level-content">
                <h3>متوسط</h3>
                <p>كلمات أكثر تنوعًا واستخدامًا</p>
            </div>

            <div class="select-circle">✓</div>

        </button>


        <button
            type="button"
            class="level-card"
            onclick="selectLevel(this, 'B1')">

            <div class="level-badge">B1</div>

            <div class="level-content">
                <h3>متقدم</h3>
                <p>كلمات أصعب ومفيدة للمحادثة</p>
            </div>

            <div class="select-circle">✓</div>

        </button>

    </section>


    <!-- التصنيف -->
    <div class="section-heading category-heading">

        <div class="heading-content">

            <span class="section-number">02</span>

            <div>
                <h2>اختر التصنيف</h2>
                <p>ماذا تريد أن تتعلم اليوم؟</p>
            </div>

        </div>

    </div>


    <!--
        سيتم تحميل التصنيفات من Supabase
        جدول categories
    -->
    <section
        class="categories"
        id="categoriesContainer">

        <div class="loading-categories">
            <span>⏳</span>
            جاري تحميل التصنيفات...
        </div>

    </section>


    <!-- رسالة الاختيار -->
    <div
        id="selectionMessage"
        class="selection-message">

        اختر المستوى والتصنيف للبدء 👆

    </div>


    <!-- زر البداية -->
    <div class="start-area">

        <button
            type="button"
            id="startBtn"
            class="start-btn"
            onclick="startLearning()"
            disabled>

            <span>ابدأ التعلم 🚀</span>

            <span class="start-arrow">
                ←
            </span>

        </button>

    </div>

</main>


<!-- Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase.js"></script>

<script src="presence.js"></script>

<script src="learn.js"></script>


<script>
startPresence("learn");
</script>

</body>
</html>
