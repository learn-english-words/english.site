<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>تعلم الكلمات | EnglishWords</title>

    <link rel="stylesheet" href="learn.css">

</head>

<body>


<!-- ==========================================
     الشريط العلوي
========================================== -->

<header class="topbar">

    <button
        class="back-btn"
        onclick="goHome()">

        <span>→</span>
        الرئيسية

    </button>

    <div class="page-title">

        <span class="title-icon">
            📚
        </span>

        <span>
            تعلم الكلمات
        </span>

    </div>

</header>



<!-- ==========================================
     المحتوى
========================================== -->

<main class="container">


    <!-- ==========================================
         المقدمة
    ========================================== -->

    <section class="intro">

        <div class="intro-content">

            <div class="intro-label">
                ✨ ابدأ رحلتك
            </div>

            <h1>
                تعلم الإنجليزية
                <br>
                <span>بطريقة أسهل 🚀</span>
            </h1>

            <p>
                اختر مستواك أولًا، ثم اختر التصنيف
                الذي تريد تعلم كلماته.
            </p>

        </div>

        <div class="intro-decoration">

            <div class="floating-book">
                📚
            </div>

            <div class="floating-star star-one">
                ✦
            </div>

            <div class="floating-star star-two">
                ✦
            </div>

        </div>

    </section>



    <!-- ==========================================
         اختيار المستوى
    ========================================== -->

    <section class="selection-section">

        <div class="section-heading">

            <div class="heading-inner">

                <span class="section-number">
                    01
                </span>

                <div>

                    <h2>
                        اختر مستواك
                    </h2>

                    <p>
                        اختر المستوى المناسب لك
                    </p>

                </div>

            </div>

        </div>


        <section class="levels">


            <!-- A1 -->

            <button
                type="button"
                class="level-card"
                data-level="A1"
                onclick="selectLevel(this, 'A1')">

                <div class="level-badge">
                    A1
                </div>

                <div class="level-content">

                    <h3>
                        مبتدئ
                    </h3>

                    <p>
                        كلمات إنجليزية أساسية وسهلة
                    </p>

                </div>

                <div class="select-circle">
                    ✓
                </div>

            </button>



            <!-- A2 -->

            <button
                type="button"
                class="level-card"
                data-level="A2"
                onclick="selectLevel(this, 'A2')">

                <div class="level-badge">
                    A2
                </div>

                <div class="level-content">

                    <h3>
                        متوسط
                    </h3>

                    <p>
                        كلمات أكثر تنوعًا واستخدامًا
                    </p>

                </div>

                <div class="select-circle">
                    ✓
                </div>

            </button>



            <!-- B1 -->

            <button
                type="button"
                class="level-card"
                data-level="B1"
                onclick="selectLevel(this, 'B1')">

                <div class="level-badge">
                    B1
                </div>

                <div class="level-content">

                    <h3>
                        متقدم
                    </h3>

                    <p>
                        كلمات أصعب ومفيدة للمحادثة
                    </p>

                </div>

                <div class="select-circle">
                    ✓
                </div>

            </button>


        </section>

    </section>



    <!-- ==========================================
         اختيار التصنيف
    ========================================== -->

    <section class="selection-section category-section">

        <div class="section-heading">

            <div class="heading-inner">

                <span class="section-number">
                    02
                </span>

                <div>

                    <h2>
                        اختر التصنيف
                    </h2>

                    <p>
                        ماذا تريد أن تتعلم اليوم؟
                    </p>

                </div>

            </div>

        </div>


        <!--
            سيتم تحميل التصنيفات من Supabase هنا
        -->

        <section
            id="categoriesContainer"
            class="categories">

            <div class="loading-categories">

                <div class="loading-spinner"></div>

                <span>
                    جاري تحميل التصنيفات...
                </span>

            </div>

        </section>


        <!-- رسالة الخطأ -->

        <div
            id="categoryError"
            class="category-error"
            hidden>

            حدث خطأ أثناء تحميل التصنيفات.

            <button
                type="button"
                onclick="loadCategories()">

                إعادة المحاولة

            </button>

        </div>

    </section>



    <!-- ==========================================
         زر البداية
    ========================================== -->

    <div class="start-area">

        <div
            id="selectionMessage"
            class="selection-message">

            اختر المستوى والتصنيف للبدء 👆

        </div>


        <button
            type="button"
            id="startBtn"
            class="start-btn"
            onclick="startLearning()"
            disabled>

            <span>
                ابدأ التعلم
            </span>

            <span class="start-arrow">
                ←
            </span>

        </button>

    </div>


</main>



<!-- ==========================================
     Supabase
========================================== -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase.js"></script>

<script src="learn.js"></script>


</body>

</html>
