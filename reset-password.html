<!doctype html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#071127"><title>تغيير كلمة المرور — EnglishWords</title><link rel="stylesheet" href="profile-modern.css?v=1"><link rel="stylesheet" href="reset-password.css?v=1"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase.js"></script></head><body><header class="topbar"><a class="brand" href="index.html"><i>▰</i>English<span>Words</span></a></header><main class="password-shell"><section class="settings-card password-card"><div class="section-heading"><div><span>أمان الحساب</span><h2>أنشئ كلمة مرور جديدة</h2></div></div><form id="passwordForm"><div class="form-grid"><label class="field full"><span>كلمة المرور الجديدة</span><input id="newPassword" type="password" minlength="8" autocomplete="new-password" required placeholder="8 أحرف على الأقل"></label><label class="field full"><span>تأكيد كلمة المرور</span><input id="confirmPassword" type="password" minlength="8" autocomplete="new-password" required placeholder="أعد كتابة كلمة المرور"></label></div><button class="primary-btn" id="updatePasswordBtn" type="submit">تحديث كلمة المرور</button></form><p class="password-note" id="passwordStatus" role="status">افتح هذه الصفحة من الرابط المرسل إلى بريدك.</p></section></main><script src="reset-password.js?v=1"></script></body></html>
