
<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>اسمع واختر - EnglishWords</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>


<script src="presence.js"></script>


<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #f8f9fc;
    color: #171827;
    font-family: Arial, Tahoma, sans-serif;
}

.page {
    width: 100%;
    max-width: 600px;
    min-height: 100vh;
    margin: auto;
    padding: 20px 18px 40px;
}

/* الهيدر */

.header {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 25px;
}

.back-btn {
    width: 45px;
    height: 45px;
    border: none;
    border-radius: 50%;
    background: white;
    box-shadow: 0 3px 12px rgba(0,0,0,.07);
    font-size: 22px;
    cursor: pointer;
}

.header h1 {
    margin: 0;
    font-size: 21px;
}

/* البطاقة */

.listen-card {
    background: white;
    border-radius: 25px;
    padding: 25px 20px;
    box-shadow: 0 5px 20px rgba(0,0,0,.06);
    text-align: center;
}

.listen-icon {
    font-size: 55px;
    margin-bottom: 10px;
}

.title {
    font-size: 21px;
    font-weight: bold;
    margin-bottom: 7px;
}

.description {
    color: #888;
    font-size: 13px;
    line-height: 1.7;
    margin-bottom: 25px;
}

/* زر الصوت */

.sound-btn {
    width: 90px;
    height: 90px;
    border: none;
    border-radius: 50%;
    background: linear-gradient(145deg,#7669f3,#5b4ee8);
    color: white;
    font-size: 38px;
    cursor: pointer;
    box-shadow: 0 10px 25px rgba(92,80,230,.25);
    transition: .15s;
}

.sound-btn:active {
    transform: scale(.94);
}

.sound-btn.playing {
    animation: pulse 1s infinite;
}

@keyframes pulse {

    0% {
        transform: scale(1);
    }

    50% {
        transform: scale(1.08);
    }

    100% {
        transform: scale(1);
    }

}

/* السؤال */

.question {
    margin-top: 25px;
    font-size: 15px;
    color: #555;
}

/* الاختيارات */

.options {
    display: grid;
    grid-template-columns: repeat(2,1fr);
    gap: 12px;
    margin-top: 18px;
}

.option {
    border: 2px solid #eeeeee;
    background: #fafafa;
    border-radius: 16px;
    padding: 16px 8px;
    min-height: 60px;
    font-family: inherit;
    font-size: 14px;
    cursor: pointer;
    transition: .15s;
}

.option:hover {
    border-color: #7669f3;
    background: #f7f5ff;
}

.option.correct {
    background: #e4f9ef;
    border-color: #35b878;
    color: #16834f;
}

.option.wrong {
    background: #fff0f0;
    border-color: #ef5b5b;
    color: #d43d3d;
}

.option:disabled {
    cursor: default;
}

/* النتيجة */

.result {
    min-height: 25px;
    margin-top: 18px;
    font-size: 15px;
    font-weight: bold;
}

/* السؤال الجديد */

.next-btn {
    width: 100%;
    border: none;
    background: #6254eb;
    color: white;
    padding: 14px;
    border-radius: 15px;
    margin-top: 15px;
    font-family: inherit;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
    display: none;
}

.next-btn:active {
    transform: scale(.98);
}

/* تحميل */

.loading {
    text-align: center;
    color: #888;
    padding: 30px 0;
}

/* الجوال */

@media (max-width: 380px) {

    .page {
        padding-left: 14px;
        padding-right: 14px;
    }

    .listen-card {
        padding: 22px 15px;
    }

    .options {
        gap: 8px;
    }

}

</style>

</head>

<body>

<main class="page">

    <!-- الهيدر -->

    <header class="header">

        <button
            class="back-btn"
            onclick="window.location.href='index.html'">

            →

        </button>

        <h1>
            🎧 اسمع واختر
        </h1>

    </header>


    <!-- اللعبة -->

    <section class="listen-card">

        <div class="listen-icon">
            🎧
        </div>

        <div class="title">
            اسمع الكلمة واختر معناها
        </div>

        <div class="description">
            اضغط على 🔊 واستمع جيدًا،
            ثم اختر الكلمة الصحيحة.
        </div>


        <button
            id="soundButton"
            class="sound-btn"
            onclick="playWord()">

            🔊

        </button>


        <div class="question">
            ما هي الكلمة التي سمعتها؟
        </div>


        <div
            id="options"
            class="options">

            <div class="loading">
                جاري تحميل الكلمات...
            </div>

        </div>


        <div
            id="result"
            class="result">
        </div>


        <button
            id="nextButton"
            class="next-btn"
            onclick="loadQuestion()">

            سؤال جديد 🔄

        </button>

    </section>

</main>


<script>

/* ==========================================
   المتغيرات
========================================== */

let words = [];

let currentWord = null;

let answered = false;


/* ==========================================
   التحقق من تسجيل الدخول
========================================== */

async function checkLogin() {

    const {
        data: { user },
        error
    } = await supabaseClient.auth.getUser();

    if (error || !user) {

        window.location.replace("login.html");

        return false;

    }

    return true;

}


/* ==========================================
   تحميل الكلمات
========================================== */

async function loadWords() {

    const {
        data,
        error
    } = await supabaseClient
        .from("words")
        .select("id, english, arabic")
        .not("english", "is", null)
        .not("arabic", "is", null)
        .limit(1000);


    if (error) {

        console.error(
            "خطأ في تحميل الكلمات:",
            error
        );

        document.getElementById(
            "options"
        ).innerHTML = `
            <div class="loading">
                حدث خطأ أثناء تحميل الكلمات ❌
            </div>
        `;

        return;

    }


    if (!data || data.length < 4) {

        document.getElementById(
            "options"
        ).innerHTML = `
            <div class="loading">
                يجب أن يكون لديك 4 كلمات على الأقل.
            </div>
        `;

        return;

    }


    words = data;

    loadQuestion();

}


/* ==========================================
   سؤال جديد
========================================== */

function loadQuestion() {

    if (words.length < 4) {
        return;
    }


    answered = false;


    const options =
        document.getElementById("options");

    const result =
        document.getElementById("result");

    const nextButton =
        document.getElementById("nextButton");

    const soundButton =
        document.getElementById("soundButton");


    result.textContent = "";

    result.style.color = "";

    nextButton.style.display = "none";

    soundButton.classList.remove("playing");


    window.speechSynthesis.cancel();


    /* اختيار كلمة */

    const randomIndex =
        Math.floor(
            Math.random() * words.length
        );


    currentWord =
        words[randomIndex];


    /* اختيار الإجابات الخاطئة */

    let wrongWords =
        words.filter(
            word =>
                word.id !== currentWord.id
        );


    wrongWords =
        shuffleArray(wrongWords)
        .slice(0,3);


    /* دمج الإجابات */

    let answers = [
        currentWord,
        ...wrongWords
    ];


    answers =
        shuffleArray(answers);


    options.innerHTML = "";


    answers.forEach(word => {

        const button =
            document.createElement("button");


        button.className =
            "option";

        button.textContent =
             word.english;


        button.dataset.id =
            word.id;


        button.onclick =
            () => checkAnswer(
                button,
                word
            );


        options.appendChild(button);

    });

}


/* ==========================================
   تشغيل الصوت
========================================== */

function playWord() {

    if (!currentWord) {
        return;
    }


    if (!("speechSynthesis" in window)) {

        alert(
            "متصفحك لا يدعم تشغيل الصوت."
        );

        return;

    }


    window.speechSynthesis.cancel();


    const speech =
        new SpeechSynthesisUtterance(
            currentWord.english
        );


    speech.lang = "en-US";

    speech.rate = 0.85;

    speech.pitch = 1;

    speech.volume = 1;


    const button =
        document.getElementById(
            "soundButton"
        );


    button.classList.add("playing");


    speech.onend = () => {

        button.classList.remove(
            "playing"
        );

    };


    speech.onerror = () => {

        button.classList.remove(
            "playing"
        );

    };


    window.speechSynthesis.speak(
        speech
    );

}


/* ==========================================
   التحقق من الإجابة
========================================== */

function checkAnswer(
    clickedButton,
    selectedWord
) {

    if (answered) {
        return;
    }


    answered = true;


    const allButtons =
        document.querySelectorAll(
            ".option"
        );


    allButtons.forEach(button => {

        button.disabled = true;


        if (
            button.dataset.id ===
            String(currentWord.id)
        ) {

            button.classList.add(
                "correct"
            );

        }

    });


    const result =
        document.getElementById(
            "result"
        );


    const nextButton =
        document.getElementById(
            "nextButton"
        );


    if (
        selectedWord.id ===
        currentWord.id
    ) {

        clickedButton.classList.add(
            "correct"
        );


        result.textContent =
            "✅ ممتاز! إجابة صحيحة";


        result.style.color =
            "#16834f";

    } else {

        clickedButton.classList.add(
            "wrong"
        );


        result.textContent =
            "❌ خطأ — الإجابة الصحيحة: " +
            currentWord.arabic;


        result.style.color =
            "#d43d3d";

    }


    nextButton.style.display =
        "block";

}


/* ==========================================
   خلط الكلمات
========================================== */

function shuffleArray(array) {

    const result =
        [...array];


    for (
        let i = result.length - 1;
        i > 0;
        i--
    ) {

        const j =
            Math.floor(
                Math.random() *
                (i + 1)
            );


        [
            result[i],
            result[j]
        ] = [
            result[j],
            result[i]
        ];

    }


    return result;

}


/* ==========================================
   تشغيل الصفحة
========================================== */

async function startPage() {

    const loggedIn =
        await checkLogin();


    if (!loggedIn) {
        return;
    }


    await loadWords();

}


startPage();

</script>

</body>

</html>
