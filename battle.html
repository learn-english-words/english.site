
<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>EnglishWords - معركة الكلمات</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase.js"></script>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #f7f8fc;
    color: #171827;
    font-family: Arial, Tahoma, sans-serif;
}

button {
    font-family: inherit;
}

.page {
    width: 100%;
    max-width: 600px;
    margin: auto;
    min-height: 100vh;
    padding: 18px 15px 40px;
}

/* =========================================
   الهيدر
========================================= */

.header {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 18px;
}

.back-btn {
    width: 44px;
    height: 44px;
    border: none;
    border-radius: 50%;
    background: white;
    box-shadow: 0 3px 12px rgba(0,0,0,.07);
    font-size: 22px;
    cursor: pointer;
}

.header-info {
    flex: 1;
}

.header-info h1 {
    margin: 0 0 4px;
    font-size: 21px;
}

.header-info p {
    margin: 0;
    color: #888;
    font-size: 12px;
}

/* =========================================
   الانتظار
========================================= */

.waiting-card {
    background: white;
    border-radius: 25px;
    padding: 35px 22px;
    text-align: center;
    box-shadow: 0 5px 20px rgba(0,0,0,.06);
}

.waiting-icon {
    font-size: 55px;
    margin-bottom: 15px;
}

.waiting-card h2 {
    margin: 0 0 10px;
    font-size: 22px;
}

.waiting-card p {
    color: #888;
    line-height: 1.8;
    font-size: 14px;
    margin: 0;
}

.loader {
    width: 38px;
    height: 38px;
    border: 4px solid #eee;
    border-top-color: #6254eb;
    border-radius: 50%;
    margin: 22px auto 0;
    animation: spin .8s linear infinite;
}

@keyframes spin {
    to {
        transform: rotate(360deg);
    }
}

/* =========================================
   شاشة المباراة
========================================= */

#gameScreen {
    display: none;
}

/* =========================================
   اللاعبين
========================================= */

.players {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    gap: 10px;
    margin-bottom: 18px;
}

.player-card {
    background: white;
    border-radius: 20px;
    padding: 15px 10px;
    text-align: center;
    box-shadow: 0 4px 16px rgba(0,0,0,.05);
}

.player-avatar {
    width: 52px;
    height: 52px;
    margin: auto auto 8px;
    border-radius: 50%;
    background: linear-gradient(135deg,#7667f5,#5b4ee8);
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    font-weight: bold;
}

.player-card strong {
    display: block;
    font-size: 13px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.player-score {
    margin-top: 7px;
    font-size: 24px;
    font-weight: bold;
    color: #6254eb;
}

.vs {
    font-size: 18px;
    font-weight: bold;
    color: #aaa;
}

/* =========================================
   شريط الحالة
========================================= */

.status-card {
    background: linear-gradient(135deg,#6254eb,#8374ed);
    color: white;
    border-radius: 22px;
    padding: 18px;
    text-align: center;
    margin-bottom: 18px;
    box-shadow: 0 8px 22px rgba(98,84,235,.2);
}

.status-card strong {
    display: block;
    font-size: 17px;
    margin-bottom: 5px;
}

.status-card span {
    font-size: 12px;
    opacity: .9;
}

/* =========================================
   السؤال
========================================= */

.question-card {
    background: white;
    border-radius: 25px;
    padding: 25px 18px;
    box-shadow: 0 5px 20px rgba(0,0,0,.06);
}

.question-number {
    text-align: center;
    color: #888;
    font-size: 12px;
    margin-bottom: 14px;
}

.question-word {
    text-align: center;
    font-size: 34px;
    font-weight: bold;
    color: #171827;
    margin-bottom: 25px;
    direction: ltr;
}

.answers {
    display: grid;
    gap: 10px;
}

.answer-btn {
    width: 100%;
    border: 2px solid #eeeeee;
    background: #fafafa;
    border-radius: 15px;
    padding: 15px;
    font-size: 15px;
    cursor: pointer;
    transition: .15s;
}

.answer-btn:active {
    transform: scale(.98);
}

.answer-btn:disabled {
    cursor: default;
}

.answer-btn.correct {
    background: #e2f8eb;
    border-color: #35b878;
    color: #16834f;
}

.answer-btn.wrong {
    background: #ffe7e7;
    border-color: #e35a5a;
    color: #c83232;
}

/* =========================================
   النتيجة
========================================= */

.result-card {
    display: none;
    background: white;
    border-radius: 25px;
    padding: 30px 20px;
    text-align: center;
    box-shadow: 0 5px 20px rgba(0,0,0,.06);
}

.result-icon {
    font-size: 60px;
    margin-bottom: 10px;
}

.result-card h2 {
    margin: 0 0 10px;
}

.result-card p {
    color: #888;
    line-height: 1.8;
}

.result-score {
    font-size: 28px;
    font-weight: bold;
    color: #6254eb;
    margin: 15px 0;
}

.back-games-btn {
    border: none;
    background: #6254eb;
    color: white;
    padding: 13px 22px;
    border-radius: 14px;
    cursor: pointer;
    font-weight: bold;
}

/* =========================================
   رسالة
========================================= */

.message {
    position: fixed;
    left: 50%;
    bottom: 20px;
    transform: translateX(-50%);
    width: calc(100% - 30px);
    max-width: 500px;
    background: #171827;
    color: white;
    padding: 14px 17px;
    border-radius: 15px;
    text-align: center;
    z-index: 99999;
    display: none;
    font-size: 13px;
}

/* =========================================
   خطأ
========================================= */

.error-card {
    background: white;
    border-radius: 23px;
    padding: 30px 20px;
    text-align: center;
    box-shadow: 0 5px 20px rgba(0,0,0,.06);
}

.error-icon {
    font-size: 50px;
    margin-bottom: 12px;
}

.error-card h2 {
    margin: 0 0 10px;
}

.error-card p {
    color: #888;
    line-height: 1.7;
}

</style>

</head>

<body>

<main class="page">

<header class="header">

    <button
        class="back-btn"
        onclick="goBack()">

        ←

    </button>

    <div class="header-info">

        <h1>
            ⚔️ معركة الكلمات
        </h1>

        <p>
            تنافس مع لاعب آخر في الإنجليزية
        </p>

    </div>

</header>


<!-- =========================================
     شاشة الانتظار
========================================= -->

<section
    id="waitingScreen"
    class="waiting-card">

    <div class="waiting-icon">
        ⚔️
    </div>

    <h2>
        جاري تجهيز المباراة
    </h2>

    <p id="waitingText">
        نبحث عن المباراة الخاصة بك...
    </p>

    <div class="loader"></div>

</section>


<!-- =========================================
     شاشة اللعبة
========================================= -->

<section id="gameScreen">


    <!-- اللاعبين -->

    <div class="players">

        <div class="player-card">

            <div
                id="player1Avatar"
                class="player-avatar">

                ؟

            </div>

            <strong id="player1Name">
                اللاعب الأول
            </strong>

            <div
                id="player1Score"
                class="player-score">

                0

            </div>

        </div>


        <div class="vs">
            VS
        </div>


        <div class="player-card">

            <div
                id="player2Avatar"
                class="player-avatar">

                ؟

            </div>

            <strong id="player2Name">
                اللاعب الثاني
            </strong>

            <div
                id="player2Score"
                class="player-score">

                0

            </div>

        </div>

    </div>


    <!-- الحالة -->

    <div class="status-card">

        <strong id="gameStatus">
            ⚔️ بدأت المعركة!
        </strong>

        <span id="gameStatusText">
            اختر الإجابة الصحيحة
        </span>

    </div>


    <!-- السؤال -->

    <div
        id="questionCard"
        class="question-card">

        <div
            id="questionNumber"
            class="question-number">

            السؤال 1 من 10

        </div>

        <div
            id="questionWord"
            class="question-word">

            Apple

        </div>

        <div
            id="answers"
            class="answers">

        </div>

    </div>


    <!-- النتيجة -->

    <div
        id="resultCard"
        class="result-card">

        <div
            id="resultIcon"
            class="result-icon">

            🏆

        </div>

        <h2 id="resultTitle">
            انتهت المعركة!
        </h2>

        <p id="resultText">
            أحسنت!
        </p>

        <div
            id="resultScore"
            class="result-score">

            0 - 0

        </div>

        <button
            class="back-games-btn"
            onclick="goBack()">

            العودة للألعاب

        </button>

    </div>

</section>

</main>


<div
    id="message"
    class="message">
</div>


<script>

/* =========================================================
   المتغيرات
========================================================= */

let currentUser = null;

let matchId = null;

let matchData = null;

let profiles = {};

let realtimeChannel = null;

let pollTimer = null;

let answeredThisQuestion = false;


/* =========================================================
   الأسئلة
========================================================= */

const questions = [

    {
        word: "Apple",
        answers: [
            "تفاحة",
            "سيارة",
            "كتاب",
            "ماء"
        ],
        correct: 0
    },

    {
        word: "House",
        answers: [
            "مدرسة",
            "منزل",
            "سيارة",
            "طعام"
        ],
        correct: 1
    },

    {
        word: "Book",
        answers: [
            "قلم",
            "باب",
            "كتاب",
            "كرسي"
        ],
        correct: 2
    },

    {
        word: "Water",
        answers: [
            "ماء",
            "خبز",
            "تفاحة",
            "حليب"
        ],
        correct: 0
    },

    {
        word: "Car",
        answers: [
            "طائرة",
            "دراجة",
            "سيارة",
            "قطار"
        ],
        correct: 2
    },

    {
        word: "School",
        answers: [
            "مستشفى",
            "مدرسة",
            "مطعم",
            "منزل"
        ],
        correct: 1
    },

    {
        word: "Friend",
        answers: [
            "صديق",
            "معلم",
            "طبيب",
            "جار"
        ],
        correct: 0
    },

    {
        word: "Food",
        answers: [
            "شراب",
            "طعام",
            "ملابس",
            "بيت"
        ],
        correct: 1
    },

    {
        word: "Morning",
        answers: [
            "الليل",
            "المساء",
            "الصباح",
            "الظهر"
        ],
        correct: 2
    },

    {
        word: "Beautiful",
        answers: [
            "سريع",
            "جميل",
            "صغير",
            "قوي"
        ],
        correct: 1
    }

];


/* =========================================================
   الحصول على match من الرابط
========================================================= */

function getMatchIdFromUrl() {

    const params =
        new URLSearchParams(
            window.location.search
        );

    return params.get("match");

}


/* =========================================================
   المستخدم الحالي
========================================================= */

async function loadCurrentUser() {

    const {
        data,
        error
    } = await supabaseClient.auth.getUser();

    if (
        error ||
        !data ||
        !data.user
    ) {

        window.location.href =
            "login.html";

        return false;

    }

    currentUser =
        data.user;

    return true;

}


/* =========================================================
   رسالة
========================================================= */

function showMessage(text) {

    const box =
        document.getElementById(
            "message"
        );

    box.textContent =
        text;

    box.style.display =
        "block";

    clearTimeout(
        window.messageTimer
    );

    window.messageTimer =
        setTimeout(() => {

            box.style.display =
                "none";

        }, 3000);

}


/* =========================================================
   تحميل المباراة
========================================================= */

async function loadMatch() {

    if (!matchId) {

        showError(
            "لم يتم تحديد المباراة."
        );

        return;

    }


    const {
        data,
        error
    } = await supabaseClient
        .from("game_matches")
        .select(`
            id,
            invite_id,
            player1_id,
            player2_id,
            game_type,
            current_question,
            player1_score,
            player2_score,
            status,
            created_at,
            updated_at
        `)
        .eq(
            "id",
            matchId
        )
        .maybeSingle();


    if (error) {

        console.error(
            "Load match error:",
            error
        );

        document.getElementById(
            "waitingText"
        ).textContent =
            "حدث خطأ أثناء تحميل المباراة ❌";

        return;

    }


    if (!data) {

        document.getElementById(
            "waitingText"
        ).textContent =
            "لم يتم العثور على المباراة.";

        return;

    }


    if (
        data.player1_id !==
        currentUser.id &&
        data.player2_id !==
        currentUser.id
    ) {

        showError(
            "هذه المباراة ليست متاحة لحسابك."
        );

        return;

    }


    matchData =
        data;


    await loadProfiles();

    updatePlayers();

    handleMatchState();

}


/* =========================================================
   تحميل أسماء اللاعبين
========================================================= */

async function loadProfiles() {

    const ids = [
        matchData.player1_id,
        matchData.player2_id
    ];

    const {
        data,
        error
    } = await supabaseClient
        .from("profiles")
        .select(
            "id, display_name"
        )
        .in(
            "id",
            ids
        );


    if (error) {

        console.error(
            "Load profiles error:",
            error
        );

        return;

    }


    profiles = {};


    (data || []).forEach(profile => {

        profiles[
            profile.id
        ] = profile;

    });

}


/* =========================================================
   تحديث اللاعبين
========================================================= */

function updatePlayers() {

    const player1 =
        profiles[
            matchData.player1_id
        ];

    const player2 =
        profiles[
            matchData.player2_id
        ];


    const name1 =
        player1?.display_name ||
        "اللاعب الأول";

    const name2 =
        player2?.display_name ||
        "اللاعب الثاني";


    document.getElementById(
        "player1Name"
    ).textContent =
        name1;


    document.getElementById(
        "player2Name"
    ).textContent =
        name2;


    document.getElementById(
        "player1Avatar"
    ).textContent =
        name1
            .charAt(0)
            .toUpperCase();


    document.getElementById(
        "player2Avatar"
    ).textContent =
        name2
            .charAt(0)
            .toUpperCase();


    document.getElementById(
        "player1Score"
    ).textContent =
        matchData.player1_score || 0;


    document.getElementById(
        "player2Score"
    ).textContent =
        matchData.player2_score || 0;

}


/* =========================================================
   حالة المباراة
========================================================= */

function handleMatchState() {

    if (!matchData) return;


    if (
        matchData.status ===
        "finished"
    ) {

        showGameResult();

        return;

    }


    /*
       عندما يتم إنشاء المباراة
       تكون waiting.
       
       بمجرد دخول الطرف الثاني للصفحة
       نغيرها إلى playing.
    */

    if (
        matchData.status ===
        "waiting"
    ) {

        updateStatus(
            "⚔️ المباراة جاهزة!",
            "جاري بدء المعركة..."
        );


        startMatchIfReady();

        return;

    }


    if (
        matchData.status ===
        "playing"
    ) {

        showGame();

        renderQuestion();

        return;

    }

}


/* =========================================================
   بدء المباراة
========================================================= */

async function startMatchIfReady() {

    if (!matchData) return;


    /*
       الطرف الذي يفتح الصفحة
       يعتبر موجودًا في المباراة.
       
       ننتظر لحظة بسيطة حتى يدخل الطرف الآخر.
    */

    await new Promise(
        resolve =>
            setTimeout(
                resolve,
                800
            )
    );


    const {
        data,
        error
    } = await supabaseClient
        .from("game_matches")
        .update({

            status:
                "playing",

            updated_at:
                new Date().toISOString()

        })
        .eq(
            "id",
            matchData.id
        )
        .eq(
            "status",
            "waiting"
        )
        .select()
        .maybeSingle();


    if (error) {

        console.error(
            "Start match error:",
            error
        );

        return;

    }


    if (data) {

        matchData =
            data;

        showGame();

        renderQuestion();

    }

}


/* =========================================================
   إظهار اللعبة
========================================================= */

function showGame() {

    document.getElementById(
        "waitingScreen"
    ).style.display =
        "none";


    document.getElementById(
        "gameScreen"
    ).style.display =
        "block";

}


/* =========================================================
   الحالة
========================================================= */

function updateStatus(
    title,
    text
) {

    document.getElementById(
        "gameStatus"
    ).textContent =
        title;

    document.getElementById(
        "gameStatusText"
    ).textContent =
        text;

}


/* =========================================================
   عرض السؤال
========================================================= */

function renderQuestion() {

    if (!matchData) return;


    const questionIndex =
        Number(
            matchData.current_question || 0
        );


    /*
       انتهت الأسئلة
    */

    if (
        questionIndex >=
        questions.length
    ) {

        finishMatch();

        return;

    }


    answeredThisQuestion =
        false;


    const question =
        questions[
            questionIndex
        ];


    document.getElementById(
        "questionNumber"
    ).textContent =
        "السؤال " +
        (questionIndex + 1) +
        " من " +
        questions.length;


    document.getElementById(
        "questionWord"
    ).textContent =
        question.word;


    const answersBox =
        document.getElementById(
            "answers"
        );


    answersBox.innerHTML =
        "";


    question.answers.forEach(
        (answer, index) => {

            const button =
                document.createElement(
                    "button"
                );


            button.className =
                "answer-btn";


            button.textContent =
                answer;


            button.onclick =
                () => answerQuestion(
                    index,
                    button
                );


            answersBox.appendChild(
                button
            );

        }
    );


    updateStatus(
        "⚔️ دورك الآن!",
        "اختر معنى الكلمة الصحيح"
    );

}


/* =========================================================
   الإجابة
========================================================= */

async function answerQuestion(
    selectedIndex,
    clickedButton
) {

    if (
        answeredThisQuestion
    ) return;


    if (!matchData) return;


    answeredThisQuestion =
        true;


    const questionIndex =
        Number(
            matchData.current_question || 0
        );


    const question =
        questions[
            questionIndex
        ];


    const buttons =
        document.querySelectorAll(
            ".answer-btn"
        );


    buttons.forEach(
        button => {

            button.disabled =
                true;

        }
    );


    const correct =
        selectedIndex ===
        question.correct;


    if (correct) {

        clickedButton.classList.add(
            "correct"
        );

    } else {

        clickedButton.classList.add(
            "wrong"
        );

        buttons[
            question.correct
        ].classList.add(
            "correct"
        );

    }


    if (correct) {

        if (
            matchData.player1_id ===
            currentUser.id
        ) {

            matchData.player1_score =
                Number(
                    matchData.player1_score || 0
                ) + 1;

        } else {

            matchData.player2_score =
                Number(
                    matchData.player2_score || 0
                ) + 1;

        }

    }


    updatePlayers();


    updateStatus(
        correct
            ? "✅ إجابة صحيحة!"
            : "❌ إجابة خاطئة",
        "انتظر السؤال التالي..."
    );


    /*
       ننتظر قليلًا حتى يرى اللاعب النتيجة
    */

    await new Promise(
        resolve =>
            setTimeout(
                resolve,
                700
            )
    );


    await advanceQuestion();

}


/* =========================================================
   الانتقال للسؤال التالي
========================================================= */

async function advanceQuestion() {

    if (!matchData) return;


    const nextQuestion =
        Number(
            matchData.current_question || 0
        ) + 1;


    const newData = {

        current_question:
            nextQuestion,

        player1_score:
            Number(
                matchData.player1_score || 0
            ),

        player2_score:
            Number(
                matchData.player2_score || 0
            ),

        status:
            nextQuestion >= questions.length
                ? "finished"
                : "playing",

        updated_at:
            new Date().toISOString()

    };


    /*
       تحديث المباراة.
       
       نتحقق من current_question حتى لا
       يغيّر اللاعبان السؤال في نفس الوقت.
    */

    const {
        data,
        error
    } = await supabaseClient
        .from("game_matches")
        .update(
            newData
        )
        .eq(
            "id",
            matchData.id
        )
        .eq(
            "current_question",
            Number(
                matchData.current_question || 0
            )
        )
        .select()
        .maybeSingle();


    if (error) {

        console.error(
            "Advance question error:",
            error
        );

        /*
           في حال فشل التحديث
           نسمح بالمحاولة مرة أخرى.
        */

        answeredThisQuestion =
            false;

        return;

    }


    if (data) {

        matchData =
            data;

        updatePlayers();

        if (
            matchData.status ===
            "finished"
        ) {

            showGameResult();

        } else {

            renderQuestion();

        }

    }

}


/* =========================================================
   إنهاء المباراة
========================================================= */

async function finishMatch() {

    if (!matchData) return;


    if (
        matchData.status !==
        "finished"
    ) {

        const {
            data,
            error
        } = await supabaseClient
            .from("game_matches")
            .update({

                status:
                    "finished",

                updated_at:
                    new Date().toISOString()

            })
            .eq(
                "id",
                matchData.id
            )
            .select()
            .maybeSingle();


        if (!error && data) {

            matchData =
                data;

        }

    }


    showGameResult();

}


/* =========================================================
   النتيجة
========================================================= */

function showGameResult() {

    document.getElementById(
        "questionCard"
    ).style.display =
        "none";


    document.getElementById(
        "resultCard"
    ).style.display =
        "block";


    const score1 =
        Number(
            matchData?.player1_score || 0
        );


    const score2 =
        Number(
            matchData?.player2_score || 0
        );


    document.getElementById(
        "resultScore"
    ).textContent =
        score1 +
        " - " +
        score2;


    let title =
        "انتهت المعركة!";

    let text =
        "أحسنت!";


    if (
        score1 ===
        score2
    ) {

        document.getElementById(
            "resultIcon"
        ).textContent =
            "🤝";

        title =
            "تعادل!";

        text =
            "نتيجة رائعة من الطرفين.";

    } else {

        const iAmPlayer1 =
            matchData.player1_id ===
            currentUser.id;


        const myScore =
            iAmPlayer1
                ? score1
                : score2;


        const opponentScore =
            iAmPlayer1
                ? score2
                : score1;


        if (
            myScore >
            opponentScore
        ) {

            document.getElementById(
                "resultIcon"
            ).textContent =
                "🏆";

            title =
                "فزت! 🎉";

            text =
                "ممتاز! لقد تفوقت على خصمك.";

        } else {

            document.getElementById(
                "resultIcon"
            ).textContent =
                "💪";

            title =
                "انتهت المعركة";

            text =
                "حاول مرة أخرى وحسّن نتيجتك.";

        }

    }


    document.getElementById(
        "resultTitle"
    ).textContent =
        title;


    document.getElementById(
        "resultText"
    ).textContent =
        text;

}


/* =========================================================
   Realtime للمباراة
========================================================= */

function setupMatchRealtime() {

    if (!matchId) return;


    if (realtimeChannel) {

        supabaseClient.removeChannel(
            realtimeChannel
        );

    }


    realtimeChannel =
        supabaseClient
            .channel(
                "battle-match-" +
                matchId
            )
            .on(
                "postgres_changes",
                {

                    event:
                        "UPDATE",

                    schema:
                        "public",

                    table:
                        "game_matches",

                    filter:
                        "id=eq." +
                        matchId

                },
                payload => {

                    console.log(
                        "Match update:",
                        payload.new
                    );


                    matchData =
                        payload.new;


                    updatePlayers();


                    if (
                        matchData.status ===
                        "finished"
                    ) {

                        showGameResult();

                        return;

                    }


                    if (
                        matchData.status ===
                        "playing"
                    ) {

                        const questionIndex =
                            Number(
                                matchData.current_question || 0
                            );


                        /*
                           إذا تغيّر السؤال بسبب الطرف الآخر،
                           نعرض السؤال الجديد.
                        */

                        if (
                            questionIndex <
                            questions.length
                        ) {

                            renderQuestion();

                        }

                    }

                }
            )
            .subscribe(
                status => {

                    console.log(
                        "Battle realtime:",
                        status
                    );

                }
            );

}


/* =========================================================
   البحث الدوري عن المباراة
========================================================= */

function startMatchPolling() {

    clearInterval(
        pollTimer
    );


    pollTimer =
        setInterval(
            async () => {

                if (!matchId) return;

                /*
                   لا نحتاج polling قوي بعد بدء اللعب،
                   لكن نستعمله للتأكد من وصول المباراة.
                */

                if (
                    !matchData ||
                    matchData.status ===
                    "waiting"
                ) {

                    await loadMatch();

                }

            },
            2000
        );

}


/* =========================================================
   خطأ
========================================================= */

function showError(text) {

    document.getElementById(
        "waitingScreen"
    ).innerHTML = `

        <div class="error-card">

            <div class="error-icon">
                ⚠️
            </div>

            <h2>
                حدث خطأ
            </h2>

            <p>
                ${escapeHtml(text)}
            </p>

            <button
                class="back-games-btn"
                onclick="goBack()">

                العودة

            </button>

        </div>

    `;

}


/* =========================================================
   العودة
========================================================= */

function goBack() {

    window.location.href =
        "games.html";

}


/* =========================================================
   حماية HTML
========================================================= */

function escapeHtml(text) {

    const div =
        document.createElement(
            "div"
        );

    div.textContent =
        text || "";

    return div.innerHTML;

}


/* =========================================================
   تشغيل
========================================================= */

async function startBattle() {

    matchId =
        getMatchIdFromUrl();


    if (!matchId) {

        showError(
            "رابط المباراة غير صحيح."
        );

        return;

    }


    const loggedIn =
        await loadCurrentUser();


    if (!loggedIn) return;


    await loadMatch();


    setupMatchRealtime();


    startMatchPolling();

}


/* =========================================================
   تنظيف
========================================================= */

window.addEventListener(
    "beforeunload",
    () => {

        clearInterval(
            pollTimer
        );


        if (realtimeChannel) {

            supabaseClient.removeChannel(
                realtimeChannel
            );

        }

    }
);


startBattle();

</script>
