<!DOCTYPE html>

<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
   content="width=device-width, initial-scale=1.0">

<title>EnglishWords - معركة الكلمات</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase.js"></script>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    min-height: 100%;
}

body {
    background: #f7f8fc;
    color: #171827;
    font-family: Arial, Tahoma, sans-serif;
}

button {
    font-family: inherit;
}

.page {
    width: 100%;
    max-width: 600px;
    margin: auto;
    min-height: 100vh;
    padding: 14px 14px 25px;
}

/* =========================================
   الهيدر
========================================= */

.header {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 12px;
}

.back-btn {
    width: 42px;
    height: 42px;
    flex-shrink: 0;
    border: none;
    border-radius: 50%;
    background: white;
    box-shadow: 0 3px 12px rgba(0,0,0,.07);
    font-size: 21px;
    cursor: pointer;
}

.header-info {
    flex: 1;
    min-width: 0;
}

.header-info h1 {
    margin: 0 0 3px;
    font-size: 19px;
}

.header-info p {
    margin: 0;
    color: #888;
    font-size: 11px;
}

/* =========================================
   الانتظار
========================================= */

.waiting-card {
    background: white;
    border-radius: 23px;
    padding: 30px 20px;
    text-align: center;
    box-shadow: 0 5px 20px rgba(0,0,0,.06);
}

.waiting-icon {
    font-size: 50px;
    margin-bottom: 12px;
}

.waiting-card h2 {
    margin: 0 0 8px;
    font-size: 21px;
}

.waiting-card p {
    color: #888;
    line-height: 1.7;
    font-size: 13px;
    margin: 0;
}

.loader {
    width: 35px;
    height: 35px;
    border: 4px solid #eee;
    border-top-color: #6254eb;
    border-radius: 50%;
    margin: 20px auto 0;
    animation: spin .8s linear infinite;
}

@keyframes spin {
    to {
        transform: rotate(360deg);
    }
}

/* =========================================
   اللعبة
========================================= */

#gameScreen {
    display: none;
}

/* =========================================
   اللاعبين
========================================= */

.players {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    gap: 8px;
    margin-bottom: 10px;
}

.player-card {
    background: white;
    border-radius: 17px;
    padding: 8px 7px;
    text-align: center;
    box-shadow: 0 3px 13px rgba(0,0,0,.05);
}

.player-avatar {
    width: 38px;
    height: 38px;
    margin: auto auto 4px;
    border-radius: 50%;
    background: linear-gradient(135deg,#7667f5,#5b4ee8);
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 15px;
    font-weight: bold;
}

.player-card strong {
    display: block;
    font-size: 11px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.player-score {
    margin-top: 3px;
    font-size: 19px;
    font-weight: bold;
    color: #6254eb;
}

.vs {
    font-size: 14px;
    font-weight: bold;
    color: #aaa;
}

/* =========================================
   الحالة
========================================= */

.status-card {
    background: linear-gradient(135deg,#6254eb,#8374ed);
    color: white;
    border-radius: 17px;
    padding: 10px;
    text-align: center;
    margin-bottom: 10px;
    box-shadow: 0 6px 17px rgba(98,84,235,.18);
}

.status-card strong {
    display: block;
    font-size: 14px;
    margin-bottom: 2px;
}

.status-card span {
    font-size: 10px;
    opacity: .9;
}

/* =========================================
   السؤال
========================================= */

.question-card {
    background: white;
    border-radius: 22px;
    padding: 13px 13px 15px;
    box-shadow: 0 5px 20px rgba(0,0,0,.06);
}

.question-number {
    text-align: center;
    color: #888;
    font-size: 10px;
    margin-bottom: 7px;
}

/* =========================================
   الصورة
========================================= */

.question-image-wrap {
    width: 100%;
    height: 190px;
    border-radius: 17px;
    overflow: hidden;
    background: #f1f2f7;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 9px;
}

.question-image {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
}

.question-image.error {
    display: none;
}

.image-placeholder {
    font-size: 42px;
    color: #aaa;
}

/* =========================================
   السؤال النصي
========================================= */

.question-title {
    text-align: center;
    font-size: 14px;
    font-weight: bold;
    margin-bottom: 9px;
}

/* =========================================
   الخيارات
========================================= */

.answers {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
}

.answer-btn {
    width: 100%;
    min-height: 46px;
    border: 2px solid #eeeeee;
    background: #fafafa;
    border-radius: 13px;
    padding: 9px 6px;
    font-size: 14px;
    font-weight: bold;
    direction: ltr;
    cursor: pointer;
    transition: .15s;
}

.answer-btn:active {
    transform: scale(.98);
}

.answer-btn:disabled {
    cursor: default;
}

.answer-btn.correct {
    background: #e2f8eb;
    border-color: #35b878;
    color: #16834f;
}

.answer-btn.wrong {
    background: #ffe7e7;
    border-color: #e35a5a;
    color: #c83232;
}

/* =========================================
   النتيجة
========================================= */

.result-card {
    display: none;
    background: white;
    border-radius: 23px;
    padding: 30px 20px;
    text-align: center;
    box-shadow: 0 5px 20px rgba(0,0,0,.06);
}

.result-icon {
    font-size: 55px;
    margin-bottom: 8px;
}

.result-card h2 {
    margin: 0 0 8px;
}

.result-card p {
    color: #888;
    line-height: 1.7;
}

.result-score {
    font-size: 27px;
    font-weight: bold;
    color: #6254eb;
    margin: 14px 0;
}

.back-games-btn {
    border: none;
    background: #6254eb;
    color: white;
    padding: 12px 22px;
    border-radius: 13px;
    cursor: pointer;
    font-weight: bold;
}

/* =========================================
   الرسالة
========================================= */

.message {
    position: fixed;
    left: 50%;
    bottom: 18px;
    transform: translateX(-50%);
    width: calc(100% - 30px);
    max-width: 500px;
    background: #171827;
    color: white;
    padding: 12px 15px;
    border-radius: 14px;
    text-align: center;
    z-index: 99999;
    display: none;
    font-size: 12px;
}

/* =========================================
   خطأ
========================================= */

.error-card {
    background: white;
    border-radius: 23px;
    padding: 28px 20px;
    text-align: center;
    box-shadow: 0 5px 20px rgba(0,0,0,.06);
}

.error-icon {
    font-size: 45px;
    margin-bottom: 10px;
}

.error-card h2 {
    margin: 0 0 8px;
}

.error-card p {
    color: #888;
    line-height: 1.7;
}

/* =========================================
   للجوال الصغير
========================================= */

@media (max-height: 700px) {

    .page {
        padding-top: 8px;
    }

    .header {
        margin-bottom: 7px;
    }

    .back-btn {
        width: 37px;
        height: 37px;
        font-size: 18px;
    }

    .header-info h1 {
        font-size: 17px;
    }

    .header-info p {
        font-size: 9px;
    }

    .players {
        margin-bottom: 7px;
    }

    .player-card {
        padding: 5px;
    }

    .player-avatar {
        width: 32px;
        height: 32px;
    }

    .player-score {
        font-size: 17px;
    }

    .status-card {
        padding: 7px;
        margin-bottom: 7px;
    }

    .status-card strong {
        font-size: 12px;
    }

    .status-card span {
        font-size: 9px;
    }

    .question-card {
        padding: 9px 10px 11px;
    }

    .question-image-wrap {
        height: 145px;
        margin-bottom: 6px;
    }

    .question-title {
        font-size: 12px;
        margin-bottom: 6px;
    }

    .answers {
        gap: 6px;
    }

    .answer-btn {
        min-height: 39px;
        padding: 6px 4px;
        font-size: 12px;
    }

}


/* =========================================
   للجوال العادي
========================================= */

@media (max-width: 420px) {

    .question-image-wrap {
        height: 175px;
    }

}


/* =========================================
   جوال قصير جدًا
========================================= */

@media (max-width: 420px) and (max-height: 700px) {

    .question-image-wrap {
        height: 125px;
    }

    .question-card {
        padding: 8px;
    }

    .question-number {
        margin-bottom: 4px;
    }

    .question-title {
        margin-bottom: 5px;
    }

}

</style>

</head>

<script>

/* =========================================================
   المتغيرات
========================================================= */

let currentUser = null;

let matchId = null;

let matchData = null;

let profiles = {};

let realtimeChannel = null;

let pollTimer = null;

let answeredThisQuestion = false;

let words = [];

let currentQuestion = null;


/* =========================================================
   الحصول على match من الرابط
========================================================= */

function getMatchIdFromUrl() {

    const params =
        new URLSearchParams(
            window.location.search
        );

    return params.get("match");

}


/* =========================================================
   المستخدم الحالي
========================================================= */

async function loadCurrentUser() {

    const {
        data,
        error
    } = await supabaseClient.auth.getUser();

    if (
        error ||
        !data ||
        !data.user
    ) {

        window.location.href =
            "login.html";

        return false;

    }

    currentUser =
        data.user;

    return true;

}


/* =========================================================
   رسالة
========================================================= */

function showMessage(text) {

    const box =
        document.getElementById(
            "message"
        );

    box.textContent =
        text;

    box.style.display =
        "block";

    clearTimeout(
        window.messageTimer
    );

    window.messageTimer =
        setTimeout(() => {

            box.style.display =
                "none";

        }, 3000);

}


/* =========================================================
   تحميل المباراة
========================================================= */

async function loadMatch() {

    if (!matchId) {

        showError(
            "لم يتم تحديد المباراة."
        );

        return;

    }

    const {
        data,
        error
    } = await supabaseClient
        .from("game_matches")
        .select(`
            id,
            invite_id,
            player1_id,
            player2_id,
            game_type,
            current_question,
            player1_score,
            player2_score,
            status,
            created_at,
            updated_at
        `)
        .eq(
            "id",
            matchId
        )
        .maybeSingle();

    if (error) {

        console.error(
            "Load match error:",
            error
        );

        document.getElementById(
            "waitingText"
        ).textContent =
            "حدث خطأ أثناء تحميل المباراة ❌";

        return;

    }

    if (!data) {

        document.getElementById(
            "waitingText"
        ).textContent =
            "لم يتم العثور على المباراة.";

        return;

    }

    if (
        data.player1_id !==
        currentUser.id &&
        data.player2_id !==
        currentUser.id
    ) {

        showError(
            "هذه المباراة ليست متاحة لحسابك."
        );

        return;

    }

    matchData =
        data;

    await loadProfiles();

    updatePlayers();

    handleMatchState();

}


/* =========================================================
   تحميل اللاعبين
========================================================= */

async function loadProfiles() {

    const ids = [
        matchData.player1_id,
        matchData.player2_id
    ];

    const {
        data,
        error
    } = await supabaseClient
        .from("profiles")
        .select(
            "id, display_name"
        )
        .in(
            "id",
            ids
        );

    if (error) {

        console.error(
            "Load profiles error:",
            error
        );

        return;

    }

    profiles = {};

    (data || []).forEach(profile => {

        profiles[
            profile.id
        ] = profile;

    });

}


/* =========================================================
   تحديث اللاعبين
========================================================= */

function updatePlayers() {

    const player1 =
        profiles[
            matchData.player1_id
        ];

    const player2 =
        profiles[
            matchData.player2_id
        ];

    const name1 =
        player1?.display_name ||
        "اللاعب الأول";

    const name2 =
        player2?.display_name ||
        "اللاعب الثاني";

    document.getElementById(
        "player1Name"
    ).textContent =
        name1;

    document.getElementById(
        "player2Name"
    ).textContent =
        name2;

    document.getElementById(
        "player1Avatar"
    ).textContent =
        name1
            .charAt(0)
            .toUpperCase();

    document.getElementById(
        "player2Avatar"
    ).textContent =
        name2
            .charAt(0)
            .toUpperCase();

    document.getElementById(
        "player1Score"
    ).textContent =
        Number(
            matchData.player1_score || 0
        );

    document.getElementById(
        "player2Score"
    ).textContent =
        Number(
            matchData.player2_score || 0
        );

}


/* =========================================================
   تحميل الكلمات التي لديها صور فقط
========================================================= */

async function loadWords() {

    const {
        data,
        error
    } = await supabaseClient
        .from("words")
        .select(`
            id,
            english,
            arabic,
            image
        `)
        .not(
            "image",
            "is",
            null
        )
        .neq(
            "image",
            ""
        )
        .not(
            "english",
            "is",
            null
        )
        .neq(
            "english",
            ""
        )
        .limit(1000);

    if (error) {

        console.error(
            "Load words error:",
            error
        );

        showError(
            "تعذر تحميل كلمات اللعبة."
        );

        return false;

    }

    words =
        (data || []).filter(word => {

            return (
                word.image &&
                String(word.image).trim() &&
                word.english &&
                String(word.english).trim()
            );

        });

    if (words.length < 4) {

        showError(
            "نحتاج إلى 4 كلمات على الأقل تحتوي على صور."
        );

        return false;

    }

    return true;

}


/* =========================================================
   إنشاء ترتيب ثابت للأسئلة
========================================================= */

function getQuestionSeed() {

    let seed = 0;

    if (matchData?.invite_id) {

        for (
            let i = 0;
            i < matchData.invite_id.length;
            i++
        ) {

            seed =
                (
                    seed * 31 +
                    matchData.invite_id.charCodeAt(i)
                ) >>> 0;

        }

    }

    return seed;

}


/* =========================================================
   خلط ثابت
========================================================= */

function seededRandom(seed) {

    let value =
        seed || 1;

    return function() {

        value =
            (
                value * 1664525 +
                1013904223
            ) >>> 0;

        return value / 4294967296;

    };

}


/* =========================================================
   تجهيز أسئلة المباراة
========================================================= */

function buildQuestion(questionIndex) {

    if (!words.length) return null;

    const random =
        seededRandom(
            getQuestionSeed() +
            questionIndex * 999
        );

    const shuffled =
        [...words].sort(
            () => random() - 0.5
        );

    const target =
        shuffled[0];

    const wrongWords =
        shuffled
            .slice(1)
            .filter(word => {

                return (
                    String(word.english).toLowerCase() !==
                    String(target.english).toLowerCase()
                );

            })
            .slice(0, 3);

    if (wrongWords.length < 3) {

        return null;

    }

    const options = [

        {
            english:
                target.english,

            correct:
                true

        },

        ...wrongWords.map(word => {

            return {

                english:
                    word.english,

                correct:
                    false

            };

        })

    ];

    const finalRandom =
        seededRandom(
            getQuestionSeed() +
            questionIndex * 7777 +
            55
        );

    options.sort(
        () => finalRandom() - 0.5
    );

    return {

        wordId:
            target.id,

        image:
            target.image,

        english:
            target.english,

        options:
            options

    };

}


/* =========================================================
   حالة المباراة
========================================================= */

async function handleMatchState() {

    if (!matchData) return;

    if (
        matchData.status ===
        "finished"
    ) {

        showGameResult();

        return;

    }

    if (
        matchData.status ===
        "waiting"
    ) {

        updateStatus(
            "⚔️ المباراة جاهزة!",
            "جاري بدء المعركة..."
        );

        await startMatchIfReady();

        return;

    }

    if (
        matchData.status ===
        "playing"
    ) {

        const loaded =
            await ensureWordsLoaded();

        if (!loaded) return;

        showGame();

        renderQuestion();

    }

}


/* =========================================================
   التأكد من الكلمات
========================================================= */

async function ensureWordsLoaded() {

    if (words.length >= 4) {

        return true;

    }

    return await loadWords();

}


/* =========================================================
   بدء المباراة
========================================================= */

async function startMatchIfReady() {

    if (!matchData) return;

    await new Promise(
        resolve =>
            setTimeout(
                resolve,
                800
            )
    );

    const {
        data,
        error
    } = await supabaseClient
        .from("game_matches")
        .update({

            status:
                "playing",

            updated_at:
                new Date().toISOString()

        })
        .eq(
            "id",
            matchData.id
        )
        .eq(
            "status",
            "waiting"
        )
        .select()
        .maybeSingle();

    if (error) {

        console.error(
            "Start match error:",
            error
        );

        /*
           إذا كان الطرف الآخر هو الذي بدأ المباراة،
           نعيد تحميلها.
        */

        await loadMatch();

        return;

    }

    if (data) {

        matchData =
            data;

        const loaded =
            await ensureWordsLoaded();

        if (!loaded) return;

        showGame();

        renderQuestion();

    } else {

        await loadMatch();

    }

}


/* =========================================================
   إظهار اللعبة
========================================================= */

function showGame() {

    document.getElementById(
        "waitingScreen"
    ).style.display =
        "none";

    document.getElementById(
        "gameScreen"
    ).style.display =
        "block";

}


/* =========================================================
   الحالة
========================================================= */

function updateStatus(
    title,
    text
) {

    document.getElementById(
        "gameStatus"
    ).textContent =
        title;

    document.getElementById(
        "gameStatusText"
    ).textContent =
        text;

}


/* =========================================================
   عرض السؤال
========================================================= */

function renderQuestion() {

    if (!matchData) return;

    const questionIndex =
        Number(
            matchData.current_question || 0
        );

    const totalQuestions = 10;

    if (
        questionIndex >=
        totalQuestions
    ) {

        showGameResult();

        return;

    }

    currentQuestion =
        buildQuestion(
            questionIndex
        );

    if (!currentQuestion) {

        showError(
            "تعذر تجهيز خيارات السؤال."
        );

        return;

    }

    answeredThisQuestion =
        false;

    document.getElementById(
        "questionNumber"
    ).textContent =
        "السؤال " +
        (questionIndex + 1) +
        " من " +
        totalQuestions;

    const image =
        document.getElementById(
            "questionImage"
        );

    const placeholder =
        document.getElementById(
            "imagePlaceholder"
        );

    image.classList.remove(
        "error"
    );

    image.src =
        currentQuestion.image;

    image.alt =
        currentQuestion.english;

    placeholder.style.display =
        "none";

    image.style.display =
        "block";

    image.onerror =
        function() {

            image.style.display =
                "none";

            placeholder.style.display =
                "block";

        };

    const answersBox =
        document.getElementById(
            "answers"
        );

    answersBox.innerHTML =
        "";

    currentQuestion.options.forEach(
        option => {

            const button =
                document.createElement(
                    "button"
                );

            button.className =
                "answer-btn";

            button.textContent =
                option.english;

            button.dataset.correct =
                option.correct
                    ? "true"
                    : "false";

            button.onclick =
                () => answerQuestion(
                    option.correct,
                    button
                );

            answersBox.appendChild(
                button
            );

        }
    );

    updateStatus(
        "⚔️ دورك الآن!",
        "اختر الكلمة الإنجليزية الصحيحة"
    );

}


/* =========================================================
   الإجابة
========================================================= */

async function answerQuestion(
    correct,
    clickedButton
) {

    if (
        answeredThisQuestion
    ) return;

    if (!matchData) return;

    answeredThisQuestion =
        true;

    const buttons =
        document.querySelectorAll(
            ".answer-btn"
        );

    buttons.forEach(
        button => {

            button.disabled =
                true;

        }
    );

    if (correct) {

        clickedButton.classList.add(
            "correct"
        );

    } else {

        clickedButton.classList.add(
            "wrong"
        );

        buttons.forEach(
            button => {

                if (
                    button.dataset.correct ===
                    "true"
                ) {

                    button.classList.add(
                        "correct"
                    );

                }

            }
        );

    }

    /*
       نعرض النتيجة لحظيًا.
    */

    updateStatus(
        correct
            ? "✅ إجابة صحيحة!"
            : "❌ إجابة خاطئة",
        "انتظر السؤال التالي..."
    );

    await new Promise(
        resolve =>
            setTimeout(
                resolve,
                700
            )
    );

    await advanceQuestion(
        correct
    );

}


/* =========================================================
   الانتقال للسؤال التالي
========================================================= */

async function advanceQuestion(
    wasCorrect
) {

    if (!matchData) return;

    const currentIndex =
        Number(
            matchData.current_question || 0
        );

    const nextQuestion =
        currentIndex + 1;

    let player1Score =
        Number(
            matchData.player1_score || 0
        );

    let player2Score =
        Number(
            matchData.player2_score || 0
        );

    if (wasCorrect) {

        if (
            matchData.player1_id ===
            currentUser.id
        ) {

            player1Score++;

        } else {

            player2Score++;

        }

    }

    const newData = {

        current_question:
            nextQuestion,

        player1_score:
            player1Score,

        player2_score:
            player2Score,

        status:
            nextQuestion >= 10
                ? "finished"
                : "playing",

        updated_at:
            new Date().toISOString()

    };

    const {
        data,
        error
    } = await supabaseClient
        .from("game_matches")
        .update(
            newData
        )
        .eq(
            "id",
            matchData.id
        )
        .eq(
            "current_question",
            currentIndex
        )
        .select()
        .maybeSingle();

    if (error) {

        console.error(
            "Advance question error:",
            error
        );

        /*
           إذا حاول اللاعبان الانتقال معًا،
           قد يفشل أحدهما لأن السؤال تغير.
           نعيد تحميل المباراة.
        */

        answeredThisQuestion =
            false;

        await loadMatch();

        return;

    }

    if (data) {

        matchData =
            data;

        updatePlayers();

        if (
            matchData.status ===
            "finished"
        ) {

            showGameResult();

        } else {

            renderQuestion();

        }

    } else {

        await loadMatch();

    }

}


/* =========================================================
   النتيجة
========================================================= */

function showGameResult() {

    document.getElementById(
        "questionCard"
    ).style.display =
        "none";

    document.getElementById(
        "resultCard"
    ).style.display =
        "block";

    const score1 =
        Number(
            matchData?.player1_score || 0
        );

    const score2 =
        Number(
            matchData?.player2_score || 0
        );

    document.getElementById(
        "resultScore"
    ).textContent =
        score1 +
        " - " +
        score2;

    let title =
        "انتهت المعركة!";

    let text =
        "أحسنت!";

    if (
        score1 ===
        score2
    ) {

        document.getElementById(
            "resultIcon"
        ).textContent =
            "🤝";

        title =
            "تعادل!";

        text =
            "نتيجة رائعة من الطرفين.";

    } else {

        const iAmPlayer1 =
            matchData.player1_id ===
            currentUser.id;

        const myScore =
            iAmPlayer1
                ? score1
                : score2;

        const opponentScore =
            iAmPlayer1
                ? score2
                : score1;

        if (
            myScore >
            opponentScore
        ) {

            document.getElementById(
                "resultIcon"
            ).textContent =
                "🏆";

            title =
                "فزت! 🎉";

            text =
                "ممتاز! لقد تفوقت على خصمك.";

        } else {

            document.getElementById(
                "resultIcon"
            ).textContent =
                "💪";

            title =
                "انتهت المعركة";

            text =
                "حاول مرة أخرى وحسّن نتيجتك.";

        }

    }

    document.getElementById(
        "resultTitle"
    ).textContent =
        title;

    document.getElementById(
        "resultText"
    ).textContent =
        text;

}


/* =========================================================
   Realtime
========================================================= */

function setupMatchRealtime() {

    if (!matchId) return;

    if (realtimeChannel) {

        supabaseClient.removeChannel(
            realtimeChannel
        );

    }

    realtimeChannel =
        supabaseClient
            .channel(
                "battle-match-" +
                matchId
            )
            .on(
                "postgres_changes",
                {

                    event:
                        "UPDATE",

                    schema:
                        "public",

                    table:
                        "game_matches",

                    filter:
                        "id=eq." +
                        matchId

                },
                async payload => {

                    console.log(
                        "Match update:",
                        payload.new
                    );

                    const oldQuestion =
                        Number(
                            matchData?.current_question || 0
                        );

                    const newQuestion =
                        Number(
                            payload.new.current_question || 0
                        );

                    matchData =
                        payload.new;

                    updatePlayers();

                    if (
                        matchData.status ===
                        "finished"
                    ) {

                        showGameResult();

                        return;

                    }

                    if (
                        matchData.status ===
                        "playing"
                    ) {

                        /*
                           لا نعيد رسم السؤال إذا كان
                           اللاعب الحالي ما زال يجاوب.
                        */

                        if (
                            newQuestion !==
                            oldQuestion
                        ) {

                            showGame();

                            renderQuestion();

                        }

                    }

                }
            )
            .subscribe(
                status => {

                    console.log(
                        "Battle realtime:",
                        status
                    );

                }
            );

}


/* =========================================================
   البحث الدوري
========================================================= */

function startMatchPolling() {

    clearInterval(
        pollTimer
    );

    pollTimer =
        setInterval(
            async () => {

                if (!matchId) return;

                if (
                    !matchData ||
                    matchData.status ===
                    "waiting"
                ) {

                    await loadMatch();

                }

            },
            2000
        );

}


/* =========================================================
   خطأ
========================================================= */

function showError(text) {

    document.getElementById(
        "waitingScreen"
    ).innerHTML = `

        <div class="error-card">

            <div class="error-icon">
                ⚠️
            </div>

            <h2>
                حدث خطأ
            </h2>

            <p>
                ${escapeHtml(text)}
            </p>

            <button
                class="back-games-btn"
                onclick="goBack()">

                العودة

            </button>

        </div>

    `;

}


/* =========================================================
   الرجوع
========================================================= */

function goBack() {

    /*
       نذهب مباشرة إلى games.html
       بدل history.back()
       حتى لا يرجع المتصفح إلى صفحة المعركة مرة أخرى.
    */

    window.location.replace(
        "games.html"
    );

}


/* =========================================================
   حماية HTML
========================================================= */

function escapeHtml(text) {

    const div =
        document.createElement(
            "div"
        );

    div.textContent =
        text || "";

    return div.innerHTML;

}


/* =========================================================
   تشغيل
========================================================= */

async function startBattle() {

    matchId =
        getMatchIdFromUrl();

    if (!matchId) {

        showError(
            "رابط المباراة غير صحيح."
        );

        return;

    }

    const loggedIn =
        await loadCurrentUser();

    if (!loggedIn) return;

    /*
       نحمل الكلمات ذات الصور
       قبل بدء المباراة.
    */

    const wordsLoaded =
        await loadWords();

    if (!wordsLoaded) return;

    await loadMatch();

    setupMatchRealtime();

    startMatchPolling();

}


/* =========================================================
   تنظيف
========================================================= */

window.addEventListener(
    "beforeunload",
    () => {

        clearInterval(
            pollTimer
        );

        if (realtimeChannel) {

            supabaseClient.removeChannel(
                realtimeChannel
            );

        }

    }
);


startBattle();

</script>
