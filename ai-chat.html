<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>AI English Conversation</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>
<script src="presence.js"></script>
<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, Tahoma, sans-serif;
    background: #f5f7fb;
}

.ai-container {
    max-width: 700px;
    height: 100vh;
    margin: auto;
    background: white;
    display: flex;
    flex-direction: column;
}

/* =========================
   الهيدر
========================= */

.header {
    background: linear-gradient(
        135deg,
        #6254eb,
        #8374ed
    );

    color: white;

    padding: 18px;

    font-size: 20px;
    font-weight: bold;

    display: flex;
    align-items: center;
    justify-content: space-between;
}

.home-btn {

    border: none;

    background: white;

    color: #5c51dc;

    padding: 9px 13px;

    border-radius: 12px;

    font-size: 13px;

    font-weight: bold;

    cursor: pointer;
}

.home-btn:active {
    transform: scale(.95);
}


/* =========================
   الرسائل
========================= */

.messages {

    flex: 1;

    overflow-y: auto;

    padding: 20px;
}

.message {

    max-width: 82%;

    padding: 12px 15px;

    margin-bottom: 12px;

    border-radius: 17px;

    line-height: 1.6;

    white-space: pre-wrap;
}

.user {

    background: #6254eb;

    color: white;

    margin-right: auto;
}

.ai {

    background: #f1f2f6;

    color: #171827;

    margin-left: auto;
}


/* =========================
   حالة الاستماع
========================= */

.listening-box {

    display: none;

    text-align: center;

    padding: 8px;

    color: #6254eb;

    font-size: 13px;

    background: #f3f1ff;
}


/* =========================
   منطقة الإدخال
========================= */

.input-box {

    display: flex;

    gap: 8px;

    padding: 12px;

    border-top: 1px solid #eee;

    background: white;
}

#messageInput {

    flex: 1;

    border: none;

    outline: none;

    background: #f3f4f8;

    border-radius: 14px;

    padding: 0 15px;

    height: 50px;

    font-size: 16px;
}


/* =========================
   زر المايك
========================= */

#micButton {

    width: 50px;

    height: 50px;

    border: none;

    border-radius: 14px;

    background: #eeeaff;

    color: #6254eb;

    font-size: 21px;

    cursor: pointer;
}

#micButton.listening {

    background: #6254eb;

    color: white;

    animation: pulse 1s infinite;
}


/* =========================
   زر الإرسال
========================= */

#sendButton {

    width: 50px;

    height: 50px;

    border: none;

    border-radius: 14px;

    background: #6254eb;

    color: white;

    font-size: 18px;

    cursor: pointer;
}

#sendButton:disabled {

    opacity: .5;

}


/* =========================
   الحركة
========================= */

@keyframes pulse {

    0% {
        transform: scale(1);
    }

    50% {
        transform: scale(1.08);
    }

    100% {
        transform: scale(1);
    }

}

</style>

</head>


<body>


<div class="ai-container">


    <!-- =========================
         الهيدر
    ========================== -->

    <div class="header">

        <span>
            🤖 English Conversation
        </span>

        <button
            class="home-btn"
            onclick="window.location.href='index.html'">

            🏠 الرئيسية

        </button>

    </div>



    <!-- =========================
         الرسائل
    ========================== -->

    <div
        id="messages"
        class="messages">


        <div class="message ai">

            Hi! 👋

            Let's practice English together.

            What did you do today?

        </div>


    </div>



    <!-- =========================
         حالة المايك
    ========================== -->

    <div
        id="listeningBox"
        class="listening-box">

        🎤 Listening...

    </div>



    <!-- =========================
         الإدخال
    ========================== -->

    <div class="input-box">


        <input
            id="messageInput"
            type="text"
            placeholder="Write in English..."
            autocomplete="off"
        >


        <button
            id="micButton"
            onclick="toggleMicrophone()">

            🎤

        </button>


        <button
            id="sendButton"
            onclick="sendMessage()">

            ➤

        </button>


    </div>


</div>



<script>


/* =====================================================
   العناصر
===================================================== */

const messagesBox =
    document.getElementById("messages");

const input =
    document.getElementById("messageInput");

const sendButton =
    document.getElementById("sendButton");

const micButton =
    document.getElementById("micButton");

const listeningBox =
    document.getElementById("listeningBox");


/* =====================================================
   Speech Recognition
===================================================== */

const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;


let recognition = null;

let isListening = false;


if (SpeechRecognition) {

    recognition =
        new SpeechRecognition();

    recognition.lang =
        "en-US";

    recognition.continuous =
        false;

    recognition.interimResults =
        false;


    recognition.onstart =
        function() {

            isListening = true;

            micButton.classList.add(
                "listening"
            );

            listeningBox.style.display =
                "block";

            listeningBox.textContent =
                "🎤 Listening...";

        };


    recognition.onresult =
        function(event) {

            const transcript =
                event.results[0][0].transcript;

            input.value =
                transcript;

            listeningBox.textContent =
                "✅ تم التعرف على الكلام";


            /* إرسال الكلام تلقائيًا */

            setTimeout(
                function() {

                    sendMessage();

                },
                300
            );

        };


    recognition.onerror =
        function(event) {

            console.error(
                "Speech recognition error:",
                event.error
            );

            listeningBox.textContent =
                "❌ لم أستطع فهم الصوت";

        };


    recognition.onend =
        function() {

            isListening = false;

            micButton.classList.remove(
                "listening"
            );

            setTimeout(
                function() {

                    listeningBox.style.display =
                        "none";

                },
                700
            );

        };

}


/* =====================================================
   تشغيل / إيقاف المايك
===================================================== */

function toggleMicrophone() {

    if (!recognition) {

        alert(
            "المتصفح لا يدعم التعرف على الصوت. جرّب Chrome أو Safari."
        );

        return;

    }


    if (isListening) {

        recognition.stop();

        return;

    }


    try {

        recognition.start();

    } catch (error) {

        console.error(error);

    }

}


/* =====================================================
   إرسال الرسالة إلى Gemini
===================================================== */

async function sendMessage() {

    const message =
        input.value.trim();


    if (!message)
        return;


    addMessage(
        message,
        "user"
    );


    input.value = "";

    sendButton.disabled = true;

    micButton.disabled = true;


    const loading =
        addMessage(
            "Thinking...",
            "ai"
        );


    try {

        const {
            data,
            error
        } =
            await supabaseClient.functions.invoke(
                "ai-chat",
                {
                    body: {
                        message: message
                    }
                }
            );


        loading.remove();


        if (error) {

            console.error(
                "AI error:",
                error
            );

            addMessage(
                "حدث خطأ في الاتصال بالذكاء الاصطناعي ❌",
                "ai"
            );

            return;

        }


        if (
            !data ||
            !data.reply
        ) {

            addMessage(
                "لم يصل رد من الذكاء الاصطناعي ❌",
                "ai"
            );

            return;

        }


        /* ==========================
           عرض رد Gemini
        ========================== */

        addMessage(
            data.reply,
            "ai"
        );


        /* ==========================
           نطق رد Gemini تلقائيًا
        ========================== */

        speakText(
            data.reply
        );


    } catch (error) {

        console.error(
            "Request error:",
            error
        );


        loading.remove();


        addMessage(
            "حدث خطأ أثناء الاتصال ❌",
            "ai"
        );


    } finally {

        sendButton.disabled = false;

        micButton.disabled = false;

    }

}


/* =====================================================
   إضافة رسالة
===================================================== */

function addMessage(
    text,
    type
) {

    const div =
        document.createElement("div");


    div.className =
        "message " + type;


    div.textContent =
        text;


    messagesBox.appendChild(
        div
    );


    messagesBox.scrollTop =
        messagesBox.scrollHeight;


    return div;

}


/* =====================================================
   تحويل نص Gemini إلى صوت
===================================================== */

function speakText(text) {

    if (
        !("speechSynthesis" in window)
    ) {

        console.log(
            "Speech synthesis not supported"
        );

        return;

    }


    /* إيقاف أي صوت سابق */

    window.speechSynthesis.cancel();


    const speech =
        new SpeechSynthesisUtterance(
            text
        );


    /* اللغة الإنجليزية */

    speech.lang =
        "en-US";


    /* سرعة الكلام */

    speech.rate =
        0.9;


    /* نبرة الصوت */

    speech.pitch =
        1;


    /* مستوى الصوت */

    speech.volume =
        1;


    window.speechSynthesis.speak(
        speech
    );

}


/* =====================================================
   Enter للإرسال
===================================================== */

input.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "Enter"
        ) {

            event.preventDefault();

            sendMessage();

        }

    }
);


</script>


</body>

</html>
