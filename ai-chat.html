<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>AI English Chat</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, Tahoma, sans-serif;
    background: #f5f7fb;
    color: #171827;
}

.ai-container {
    max-width: 700px;
    height: 100vh;
    height: 100dvh;
    margin: auto;
    background: white;
    display: flex;
    flex-direction: column;
}


/* ==============================
   الهيدر
============================== */

.header {

    position: relative;

    background:
        linear-gradient(
            135deg,
            #6254eb,
            #8374ed
        );

    color: white;

    padding: 18px 20px;

    min-height: 72px;

    display: flex;

    align-items: center;

    justify-content: center;

    font-size: 19px;

    font-weight: bold;
}


/* زر الرئيسية */

.home-btn {

    position: absolute;

    left: 12px;

    top: 14px;

    border: none;

    background: white;

    color: #5c51dc;

    padding: 9px 13px;

    border-radius: 13px;

    font-size: 13px;

    font-weight: bold;

    cursor: pointer;

    box-shadow:
        0 4px 15px rgba(0,0,0,.12);
}

.home-btn:active {

    transform: scale(.95);

}


/* ==============================
   الرسائل
============================== */

.messages {

    flex: 1;

    overflow-y: auto;

    padding: 20px;

    display: flex;

    flex-direction: column;
}

.message {

    max-width: 82%;

    padding: 12px 15px;

    margin-bottom: 10px;

    border-radius: 17px;

    line-height: 1.6;

    white-space: pre-wrap;

    word-break: break-word;

    font-size: 15px;
}

.user {

    background: #6254eb;

    color: white;

    margin-left: auto;

    border-bottom-right-radius: 5px;
}

.ai {

    background: #f1f2f6;

    color: #171827;

    margin-right: auto;

    border-bottom-left-radius: 5px;
}


/* ==============================
   منطقة الإدخال
============================== */

.input-box {

    display: flex;

    align-items: center;

    gap: 8px;

    padding: 10px;

    border-top: 1px solid #eee;

    background: white;
}


/* حقل الكتابة */

#messageInput {

    flex: 1;

    min-width: 0;

    border: none;

    outline: none;

    background: #f3f4f8;

    border-radius: 14px;

    padding: 0 15px;

    height: 50px;

    font-size: 16px;
}


/* الأزرار */

.voice-button,
.send-button,
.stop-button {

    width: 50px;

    height: 50px;

    flex-shrink: 0;

    border: none;

    border-radius: 14px;

    color: white;

    font-size: 20px;

    cursor: pointer;

    display: flex;

    align-items: center;

    justify-content: center;
}


.voice-button {

    background: #6254eb;
}


.voice-button.listening {

    background: #ef3f58;

    animation:
        pulse 1s infinite;
}


.send-button {

    background: #6254eb;
}


.stop-button {

    background: #777;

}


.voice-button:disabled,
.send-button:disabled {

    opacity: .5;

    cursor: not-allowed;
}


@keyframes pulse {

    0% {
        transform: scale(1);
    }

    50% {
        transform: scale(1.08);
    }

    100% {
        transform: scale(1);
    }

}


/* ==============================
   حالة المايك
============================== */

.voice-status {

    text-align: center;

    color: #777;

    font-size: 12px;

    min-height: 20px;

    padding:
        3px 10px 7px;

    background: white;
}


/* ==============================
   الجوال
============================== */

@media (max-width: 500px) {

    .header {

        font-size: 17px;

        padding-right: 10px;

        padding-left: 10px;
    }

    .home-btn {

        left: 8px;

        font-size: 11px;

        padding: 8px 10px;
    }

    .message {

        max-width: 88%;

        font-size: 14px;
    }

    #messageInput {

        font-size: 15px;
    }

    .voice-button,
    .send-button,
    .stop-button {

        width: 47px;

        height: 47px;
    }

}

</style>

</head>


<body>


<div class="ai-container">


    <!-- ==============================
         الهيدر
    ============================== -->

    <div class="header">

        <button
            class="home-btn"
            onclick="goHome()">

            🏠 الرئيسية

        </button>


        🤖 English Conversation

    </div>



    <!-- ==============================
         الرسائل
    ============================== -->

    <div
        id="messages"
        class="messages">


        <div class="message ai">

            Hi! 👋
            Let's practice English together.

            <br>

            What did you do today?

        </div>


    </div>



    <!-- حالة المايك -->

    <div
        id="voiceStatus"
        class="voice-status">

    </div>



    <!-- ==============================
         الإدخال
    ============================== -->

    <div class="input-box">


        <!-- زر المايك -->

        <button
            id="voiceButton"
            class="voice-button"
            onclick="toggleVoice()"
            title="تحدث">

            🎤

        </button>


        <!-- الكتابة -->

        <input
            id="messageInput"
            type="text"
            placeholder="Write in English..."
            autocomplete="off"
        >


        <!-- الإرسال -->

        <button
            id="sendButton"
            class="send-button"
            onclick="sendMessage()"
            title="إرسال">

            ➤

        </button>


        <!-- إيقاف الصوت -->

        <button
            id="stopButton"
            class="stop-button"
            onclick="stopSpeaking()"
            title="إيقاف الصوت">

            🔇

        </button>


    </div>


</div>



<script>

/* ==========================================
   العناصر
========================================== */

const messagesBox =
    document.getElementById("messages");

const input =
    document.getElementById("messageInput");

const sendButton =
    document.getElementById("sendButton");

const voiceButton =
    document.getElementById("voiceButton");

const stopButton =
    document.getElementById("stopButton");

const voiceStatus =
    document.getElementById("voiceStatus");


/* ==========================================
   الرجوع للرئيسية
========================================== */

function goHome() {

    stopSpeaking();

    window.location.href =
        "index.html";

}


/* ==========================================
   إضافة رسالة
========================================== */

function addMessage(text, type) {

    const div =
        document.createElement("div");

    div.className =
        "message " + type;

    div.textContent =
        text;

    messagesBox.appendChild(div);

    messagesBox.scrollTop =
        messagesBox.scrollHeight;

    return div;
}


/* ==========================================
   إرسال الرسالة
========================================== */

async function sendMessage(customMessage = null) {

    const message =
        customMessage !== null
            ? customMessage.trim()
            : input.value.trim();


    if (!message)
        return;


    addMessage(
        message,
        "user"
    );


    input.value = "";

    sendButton.disabled = true;

    voiceButton.disabled = true;


    const loading =
        addMessage(
            "Thinking...",
            "ai"
        );


    try {

        const {
            data,
            error
        } =
            await supabaseClient.functions.invoke(
                "ai-chat",
                {
                    body: {
                        message: message
                    }
                }
            );


        loading.remove();


        if (error) {

            console.error(
                "AI error:",
                error
            );


            addMessage(
                "حدث خطأ في الاتصال بالذكاء الاصطناعي ❌",
                "ai"
            );

            return;
        }


        if (
            !data ||
            !data.reply
        ) {

            addMessage(
                "لم يصل رد من الذكاء الاصطناعي ❌",
                "ai"
            );

            return;
        }


        /* الرد الكتابي */

        addMessage(
            data.reply,
            "ai"
        );


        /* الرد الصوتي */

        speakText(
            data.reply
        );


    } catch (error) {

        console.error(
            "Request error:",
            error
        );


        loading.remove();


        addMessage(
            "حدث خطأ أثناء الاتصال ❌",
            "ai"
        );


    } finally {

        sendButton.disabled = false;

        voiceButton.disabled = false;

        input.focus();

    }

}


/* ==========================================
   تحويل رد AI إلى صوت
========================================== */

function speakText(text) {

    if (
        !("speechSynthesis" in window)
    ) {

        console.log(
            "Speech synthesis غير مدعوم"
        );

        return;
    }


    /* إيقاف أي كلام سابق */

    window.speechSynthesis.cancel();


    const speech =
        new SpeechSynthesisUtterance(
            text
        );


    /*
       نخلي الصوت إنجليزي
    */

    speech.lang =
        "en-US";


    /*
       سرعة الكلام
       أبطأ قليلًا للمبتدئين
    */

    speech.rate =
        0.88;


    /*
       درجة الصوت
    */

    speech.pitch =
        1;


    speech.volume =
        1;


    /*
       اختيار صوت إنجليزي
       إذا كان متوفرًا
    */

    const voices =
        window.speechSynthesis.getVoices();


    const englishVoice =
        voices.find(
            voice =>
                voice.lang &&
                voice.lang
                    .toLowerCase()
                    .startsWith("en")
        );


    if (englishVoice) {

        speech.voice =
            englishVoice;

    }


    speech.onstart =
        function() {

            stopButton.style.opacity =
                "1";

        };


    speech.onend =
        function() {

            stopButton.style.opacity =
                ".7";

        };


    speech.onerror =
        function(error) {

            console.error(
                "Speech error:",
                error
            );

        };


    window.speechSynthesis.speak(
        speech
    );

}


/* ==========================================
   إيقاف صوت AI
========================================== */

function stopSpeaking() {

    if (
        "speechSynthesis" in window
    ) {

        window.speechSynthesis.cancel();

    }

}


/* ==========================================
   Speech Recognition
========================================== */

const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;


let recognition = null;

let isListening = false;


if (SpeechRecognition) {

    recognition =
        new SpeechRecognition();


    /*
       اللغة الإنجليزية
    */

    recognition.lang =
        "en-US";


    /*
       لا نحتاج نتائج كثيرة
    */

    recognition.continuous =
        false;


    recognition.interimResults =
        false;


    recognition.onstart =
        function() {

            isListening = true;


            voiceButton.classList.add(
                "listening"
            );


            voiceButton.textContent =
                "⏹️";


            voiceStatus.textContent =
                "🎤 Listening... Speak English";

        };


    recognition.onresult =
        function(event) {

            const transcript =
                event
                    .results[0][0]
                    .transcript
                    .trim();


            if (!transcript)
                return;


            /*
               نعرض النص في مربع الكتابة
               أولًا
            */

            input.value =
                transcript;


            voiceStatus.textContent =
                "تم التعرف على كلامك، جاري الإرسال...";


            /*
               نرسل الكلام للـ AI
            */

            sendMessage(
                transcript
            );

        };


    recognition.onerror =
        function(event) {

            console.error(
                "Speech recognition error:",
                event.error
            );


            if (
                event.error ===
                "not-allowed"
            ) {

                voiceStatus.textContent =
                    "❌ اسمح للموقع باستخدام المايك";

            } else if (
                event.error ===
                "no-speech"
            ) {

                voiceStatus.textContent =
                    "لم أسمع صوتًا، حاول مرة أخرى 🎤";

            } else {

                voiceStatus.textContent =
                    "حدث خطأ في المايك ❌";

            }

        };


    recognition.onend =
        function() {

            isListening = false;


            voiceButton.classList.remove(
                "listening"
            );


            voiceButton.textContent =
                "🎤";


            /*
               نمسح الحالة بعد قليل
            */

            setTimeout(
                function() {

                    voiceStatus.textContent =
                        "";

                },
                1500
            );

        };

} else {

    voiceButton.disabled =
        true;


    voiceStatus.textContent =
        "المتصفح لا يدعم التعرف على الصوت";

}


/* ==========================================
   تشغيل / إيقاف المايك
========================================== */

function toggleVoice() {

    if (!recognition) {

        alert(
            "المتصفح لا يدعم التحدث بالمايك."
        );

        return;
    }


    if (isListening) {

        recognition.stop();

        return;

    }


    /*
       إيقاف صوت AI قبل الاستماع
    */

    stopSpeaking();


    try {

        recognition.start();

    } catch (error) {

        console.error(
            "Microphone error:",
            error
        );

    }

}


/* ==========================================
   زر Enter
========================================== */

input.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "Enter"
        ) {

            event.preventDefault();

            sendMessage();

        }

    }
);


/* ==========================================
   تحميل أصوات الجهاز
========================================== */

if (
    "speechSynthesis" in window
) {

    window.speechSynthesis.onvoiceschanged =
        function() {

            window.speechSynthesis
                .getVoices();

        };

}

</script>

</body>

</html>
