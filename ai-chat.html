<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<style>
.home-btn {
    position: fixed;
    top: 15px;
    left: 15px;
    z-index: 9999;

    border: none;
    background: white;
    color: #5c51dc;

    padding: 10px 16px;
    border-radius: 14px;

    font-size: 14px;
    font-weight: bold;

    cursor: pointer;

    box-shadow: 0 4px 15px rgba(0,0,0,.12);
}

.home-btn:active {
    transform: scale(.95);
}
</style>



<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AI English Chat</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, Tahoma, sans-serif;
    background: #f5f7fb;
}

.ai-container {
    max-width: 700px;
    height: 100vh;
    margin: auto;
    background: white;
    display: flex;
    flex-direction: column;
}

.header {
    background: linear-gradient(135deg, #6254eb, #8374ed);
    color: white;
    padding: 20px;
    font-size: 20px;
    font-weight: bold;
}

.messages {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
}

.message {
    max-width: 80%;
    padding: 12px 15px;
    margin-bottom: 10px;
    border-radius: 16px;
    line-height: 1.5;
}

.user {
    background: #6254eb;
    color: white;
    margin-right: auto;
}

.ai {
    background: #f1f2f6;
    color: #171827;
    margin-left: auto;
}

.input-box {
    display: flex;
    gap: 8px;
    padding: 12px;
    border-top: 1px solid #eee;
}

#messageInput {
    flex: 1;
    border: none;
    outline: none;
    background: #f3f4f8;
    border-radius: 14px;
    padding: 0 15px;
    height: 50px;
    font-size: 16px;
}

#sendButton {
    width: 50px;
    height: 50px;
    border: none;
    border-radius: 14px;
    background: #6254eb;
    color: white;
    font-size: 18px;
    cursor: pointer;
}

#sendButton:disabled {
    opacity: .5;
}
</style>

</head>

<body>
<button class="home-btn" onclick="window.location.href='index.html'">
    🏠 الرئيسية
</button>
<div class="ai-container">

    <div class="header">
        🤖 English Conversation
    </div>

    <div id="messages" class="messages">

        <div class="message ai">
            Hi! 👋 Let's practice English together.
            <br>
            What did you do today?
        </div>

    </div>

    <div class="input-box">

        <input
            id="messageInput"
            type="text"
            placeholder="Write in English..."
            autocomplete="off"
        >

        <button
            id="sendButton"
            onclick="sendMessage()">
            ➤
        </button>

    </div>

</div>


<script>

const messagesBox =
    document.getElementById("messages");

const input =
    document.getElementById("messageInput");

const sendButton =
    document.getElementById("sendButton");


async function sendMessage() {

    const message =
        input.value.trim();

    if (!message)
        return;


    addMessage(
        message,
        "user"
    );

    input.value = "";

    sendButton.disabled = true;


    const loading =
        addMessage(
            "Thinking...",
            "ai"
        );


    try {

        const {
            data,
            error
        } =
            await supabaseClient.functions.invoke(
                "ai-chat",
                {
                    body: {
                        message: message
                    }
                }
            );


        loading.remove();


        if (error) {

            console.error(
                "AI error:",
                error
            );

            addMessage(
                "حدث خطأ في الاتصال بالذكاء الاصطناعي ❌",
                "ai"
            );

            return;
        }


        if (
            !data ||
            !data.reply
        ) {

            addMessage(
                "لم يصل رد من الذكاء الاصطناعي ❌",
                "ai"
            );

            return;
        }


        addMessage(
            data.reply,
            "ai"
        );


    } catch (error) {

        console.error(
            "Request error:",
            error
        );

        loading.remove();

        addMessage(
            "حدث خطأ أثناء الاتصال ❌",
            "ai"
        );

    } finally {

        sendButton.disabled = false;

        input.focus();

    }

}


function addMessage(
    text,
    type
) {

    const div =
        document.createElement("div");

    div.className =
        "message " + type;

    div.textContent =
        text;

    messagesBox.appendChild(div);

    messagesBox.scrollTop =
        messagesBox.scrollHeight;

    return div;

}


input.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "Enter"
        ) {

            event.preventDefault();

            sendMessage();

        }

    }
);

</script>

</body>
</html>
