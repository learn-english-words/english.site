
<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>الدردشة - EnglishWords</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase.js"></script>


<style>

/* ==========================================
   الأساس
========================================== */

* {
    box-sizing: border-box;
}

body {

    margin: 0;

    font-family:
        Arial,
        Tahoma,
        sans-serif;

    background: #f5f7fb;

    color: #171827;
}

button,
input {

    font-family: inherit;
}


.chat-container {

    max-width: 900px;

    height: 100vh;

    margin: auto;

    background: white;

    display: flex;

    flex-direction: column;

    overflow: hidden;
}


/* ==========================================
   الهيدر
========================================== */

.topbar {

    padding: 15px 18px;

    background:
        linear-gradient(
            135deg,
            #6254eb,
            #8374ed
        );

    color: white;

    display: flex;

    align-items: center;

    gap: 12px;
}


.back {

    border: none;

    background:
        rgba(255,255,255,.18);

    color: white;

    width: 42px;

    height: 42px;

    border-radius: 13px;

    cursor: pointer;

    font-size: 20px;
}


.topbar h2 {

    margin: 0;

    font-size: 20px;
}


/* ==========================================
   قائمة المستخدمين
========================================== */

.conversations-section {

    flex: 1;

    overflow-y: auto;
}


.search-box {

    padding: 15px;

    border-bottom: 1px solid #eee;

    background: white;

    position: sticky;

    top: 0;

    z-index: 10;
}


.search-box input {

    width: 100%;

    border: none;

    outline: none;

    background: #f5f6fa;

    border-radius: 14px;

    padding: 13px 15px;

    font-size: 14px;
}


#usersContainer {

    width: 100%;
}


/* ==========================================
   المستخدم
========================================== */

.user {

    width: 100%;

    padding: 14px 17px;

    border: none;

    border-bottom:
        1px solid #f0f0f3;

    background: white;

    display: flex;

    align-items: center;

    gap: 12px;

    cursor: pointer;

    text-align: right;

    transition: .15s;
}


.user:hover {

    background: #f8f8ff;
}


.user:active {

    transform: scale(.99);
}


.avatar-wrap {

    position: relative;

    flex-shrink: 0;
}


.avatar {

    width: 52px;

    height: 52px;

    border-radius: 50%;

    background:
        linear-gradient(
            135deg,
            #6254eb,
            #8374ed
        );

    color: white;

    display: flex;

    align-items: center;

    justify-content: center;

    font-size: 19px;

    font-weight: bold;
}


.user-info {

    flex: 1;

    min-width: 0;
}


.user-top {

    display: flex;

    align-items: center;

    justify-content: space-between;

    gap: 10px;
}


.user-name {

    font-weight: bold;

    font-size: 15px;

    white-space: nowrap;

    overflow: hidden;

    text-overflow: ellipsis;
}


.last-time {

    color: #999;

    font-size: 10px;

    white-space: nowrap;
}


.last-message {

    margin-top: 5px;

    color: #888;

    font-size: 12px;

    white-space: nowrap;

    overflow: hidden;

    text-overflow: ellipsis;
}


/* ==========================================
   الحالة
========================================== */

.user-status {

    margin-top: 4px;

    color: #999;

    font-size: 10px;
}


/* ==========================================
   الحالة الفارغة
========================================== */

.empty {

    text-align: center;

    color: #888;

    padding: 50px 20px;

    font-size: 13px;
}


/* ==========================================
   شاشة المحادثة
========================================== */

.chat-screen {

    position: fixed;

    inset: 0;

    background: #f5f7fb;

    z-index: 3000;

    display: none;

    flex-direction: column;
}


.chat-screen.show {

    display: flex;
}


/* ==========================================
   هيدر المحادثة
========================================== */

.chat-header {

    min-height: 70px;

    padding: 10px 15px;

    background: white;

    border-bottom:
        1px solid #eee;

    display: flex;

    align-items: center;

    gap: 10px;
}


.chat-back {

    border: none;

    background: #f2f3f7;

    width: 42px;

    height: 42px;

    border-radius: 13px;

    cursor: pointer;

    font-size: 20px;
}


.chat-avatar {

    width: 45px;

    height: 45px;

    border-radius: 50%;

    background:
        linear-gradient(
            135deg,
            #6254eb,
            #8374ed
        );

    color: white;

    display: flex;

    align-items: center;

    justify-content: center;

    font-weight: bold;
}


.chat-user-info {

    flex: 1;
}


.chat-user-name {

    font-weight: bold;

    font-size: 15px;
}


.chat-status {

    color: #999;

    font-size: 11px;

    margin-top: 4px;
}


.call-btn {

    border: none;

    background: #16a34a;

    color: white;

    width: 43px;

    height: 43px;

    border-radius: 50%;

    cursor: pointer;

    font-size: 19px;
}


/* ==========================================
   الرسائل
========================================== */

.messages {

    flex: 1;

    overflow-y: auto;

    padding: 18px;

    display: flex;

    flex-direction: column;

    gap: 8px;
}


.message {

    max-width: 75%;

    padding: 10px 14px;

    border-radius: 17px;

    word-break: break-word;

    font-size: 14px;

    line-height: 1.5;
}


.mine {

    align-self: flex-start;

    background: #6254eb;

    color: white;

    border-bottom-left-radius: 5px;
}


.theirs {

    align-self: flex-end;

    background: white;

    color: #171827;

    border-bottom-right-radius: 5px;

    box-shadow:
        0 2px 8px rgba(0,0,0,.04);
}


.message-time {

    display: block;

    font-size: 9px;

    margin-top: 4px;

    opacity: .7;
}


/* ==========================================
   يكتب الآن
========================================== */

.typing {

    display: none;

    padding:
        0
        18px
        7px;

    color: #777;

    font-size: 11px;
}


.typing.show {

    display: block;
}


/* ==========================================
   الإرسال
========================================== */

.send-box {

    display: flex;

    gap: 8px;

    padding: 10px;

    background: white;

    border-top:
        1px solid #eee;
}


.send-box input {

    flex: 1;

    padding:
        13px
        15px;

    border: none;

    outline: none;

    background: #f5f6fa;

    border-radius: 15px;

    font-size: 14px;
}


.send-box button {

    width: 48px;

    border: none;

    background: #6254eb;

    color: white;

    border-radius: 15px;

    cursor: pointer;

    font-size: 18px;
}


/* ==========================================
   المكالمة الواردة
========================================== */

.call-overlay {

    position: fixed;

    inset: 0;

    background:
        rgba(0,0,0,.55);

    display: none;

    align-items: center;

    justify-content: center;

    z-index: 9999;

    padding: 20px;
}


.call-box {

    width: 100%;

    max-width: 350px;

    background: white;

    border-radius: 22px;

    padding: 30px 20px;

    text-align: center;
}


.call-avatar {

    width: 80px;

    height: 80px;

    border-radius: 50%;

    background: #6254eb;

    color: white;

    display: flex;

    align-items: center;

    justify-content: center;

    margin: auto;

    font-size: 30px;

    font-weight: bold;
}


.call-box h2 {

    margin:
        15px
        0
        8px;
}


.call-box p {

    color: #666;
}


.call-actions {

    display: flex;

    justify-content: center;

    gap: 20px;

    margin-top: 25px;
}


.call-action {

    border: none;

    width: 58px;

    height: 58px;

    border-radius: 50%;

    color: white;

    font-size: 24px;

    cursor: pointer;
}


.accept-call {

    background: #16a34a;
}


.reject-call {

    background: #dc2626;
}


/* ==========================================
   الجوال
========================================== */

@media (max-width: 600px) {

    .chat-container {

        width: 100%;
    }


    .message {

        max-width: 82%;
    }

}

</style>

</head>


<body>


<div class="chat-container">


<header class="topbar">

    <button
        class="back"
        onclick="window.location.href='index.html'">

        ←

    </button>


    <h2>
        💬 الدردشة
    </h2>

</header>


<section
    class="conversations-section">


    <div class="search-box">

        <input
            type="text"
            id="searchInput"
            placeholder="🔎 ابحث عن مستخدم..."
            autocomplete="off">

    </div>


    <div id="usersContainer">

        <div class="empty">

            جاري تحميل المستخدمين...

        </div>

    </div>


</section>


</div>



<!-- ==========================================
     شاشة المحادثة
========================================== -->

<div
    id="chatScreen"
    class="chat-screen">


<header class="chat-header">


    <button
        class="chat-back"
        onclick="closeChat()">

        →

    </button>


    <div
        class="chat-avatar"
        id="chatAvatar">

        ؟

    </div>


    <div class="chat-user-info">

        <div
            class="chat-user-name"
            id="chatTitle">

            مستخدم

        </div>


        <div
            class="chat-status"
            id="chatStatus">

            متاح للدردشة

        </div>

    </div>


    <button
        class="call-btn"
        onclick="startCall()"
        title="اتصال صوتي">

        📞

    </button>


</header>



<div
    class="messages"
    id="messages">

    <div class="empty">

        لا توجد رسائل بعد 👋

    </div>

</div>



<div
    id="typingIndicator"
    class="typing">

    يكتب الآن...

</div>



<div class="send-box">


    <input
        type="text"
        id="messageInput"
        placeholder="اكتب رسالتك..."
        autocomplete="off">


    <button
        onclick="sendMessage()">

        ➤

    </button>


</div>


</div>



<!-- ==========================================
     المكالمة الواردة
========================================== -->

<div
    id="callOverlay"
    class="call-overlay">


<div class="call-box">


    <div
        id="callAvatar"
        class="call-avatar">

        ؟

    </div>


    <h2>
        📞 مكالمة واردة
    </h2>


    <p id="callerName">

        مستخدم يتصل بك...

    </p>


    <div class="call-actions">


        <button
            class="call-action reject-call"
            onclick="rejectCall()">

            ❌

        </button>


        <button
            class="call-action accept-call"
            onclick="acceptCall()">

            📞

        </button>


    </div>


</div>


</div>



<script>

/* ==========================================
   المتغيرات
========================================== */

let currentUser = null;

let selectedUser = null;

let currentConversation = null;

let realtimeChannel = null;

let callsChannel = null;

let incomingCall = null;

let allUsers = [];

let userResults = [];

let typingChannel = null;

let typingSendTimer = null;


/* ==========================================
   الوقت
========================================== */

function formatTime(date) {

    if (!date) return "";

    return new Date(date).toLocaleTimeString(
        "ar-SA",
        {
            hour: "numeric",
            minute: "2-digit"
        }
    );

}


/* ==========================================
   تحميل المستخدم الحالي
========================================== */

async function loadCurrentUser() {

    const {
        data: { user },
        error
    } =
        await supabaseClient.auth.getUser();


    if (error || !user) {

        window.location.href =
            "login.html";

        return;

    }


    currentUser = user;


    await loadUsers();


    subscribeToCalls();

}


/* ==========================================
   تحميل المستخدمين
========================================== */

async function loadUsers() {

    const {
        data,
        error
    } =
        await supabaseClient
            .from("profiles")
            .select(
                "id, display_name, is_public"
            )
            .neq(
                "id",
                currentUser.id
            )
            .eq(
                "is_public",
                true
            )
            .order(
                "display_name",
                {
                    ascending: true
                }
            );


    if (error) {

        console.error(
            "خطأ في تحميل المستخدمين:",
            error
        );


        document.getElementById(
            "usersContainer"
        ).innerHTML =

            '<div class="empty">' +
            'حدث خطأ في تحميل المستخدمين ❌' +
            '</div>';

        return;

    }


    allUsers = data || [];


    userResults =
        allUsers.map(user => ({

            user: user,

            lastMessage: null,

            conversationId: null

        }));


    renderUsers(userResults);


    loadLastMessages();

}


/* ==========================================
   تحميل آخر الرسائل
========================================== */

async function loadLastMessages() {

    const results = [];


    for (
        const user
        of allUsers
    ) {

        let lastMessage = null;

        let conversationId = null;


        try {

            const {
                data: conversations
            } =
                await supabaseClient
                    .from("conversations")
                    .select("id")
                    .or(
                        `and(user1_id.eq.${currentUser.id},user2_id.eq.${user.id}),and(user1_id.eq.${user.id},user2_id.eq.${currentUser.id})`
                    )
                    .limit(1);


            if (
                conversations &&
                conversations.length > 0
            ) {

                conversationId =
                    conversations[0].id;


                const {
                    data: messages
                } =
                    await supabaseClient
                        .from("messages")
                        .select(
                            "message, created_at"
                        )
                        .eq(
                            "conversation_id",
                            conversationId
                        )
                        .order(
                            "created_at",
                            {
                                ascending: false
                            }
                        )
                        .limit(1);


                if (
                    messages &&
                    messages.length > 0
                ) {

                    lastMessage =
                        messages[0];

                }

            }

        }

        catch (error) {

            console.error(
                "خطأ في آخر رسالة:",
                error
            );

        }


        results.push({

            user: user,

            lastMessage:
                lastMessage,

            conversationId:
                conversationId

        });

    }


    results.sort(
        (a, b) => {

            const aTime =
                a.lastMessage
                    ? new Date(
                        a.lastMessage.created_at
                    ).getTime()
                    : 0;


            const bTime =
                b.lastMessage
                    ? new Date(
                        b.lastMessage.created_at
                    ).getTime()
                    : 0;


            return bTime - aTime;

        }
    );


    userResults = results;


    const searchInput =
        document.getElementById(
            "searchInput"
        );


    if (
        searchInput &&
        searchInput.value.trim() !== ""
    ) {

        filterUsers();

    }

    else {

        renderUsers(
            userResults
        );

    }

}


/* ==========================================
   عرض المستخدمين
========================================== */

function renderUsers(results) {

    const container =
        document.getElementById(
            "usersContainer"
        );


    container.innerHTML = "";


    if (
        !results ||
        results.length === 0
    ) {

        container.innerHTML =

            '<div class="empty">' +
            'لا يوجد مستخدم بهذا الاسم 🔎' +
            '</div>';

        return;

    }


    results.forEach(item => {

        const user =
            item.user;


        const last =
            item.lastMessage;


        const button =
            document.createElement(
                "button"
            );


        button.className =
            "user";


        const avatarWrap =
            document.createElement(
                "div"
            );


        avatarWrap.className =
            "avatar-wrap";


        const avatar =
            document.createElement(
                "div"
            );


        avatar.className =
            "avatar";


        const name =
            user.display_name ||
            "مستخدم";


        avatar.textContent =
            name
                .charAt(0)
                .toUpperCase();


        avatarWrap.appendChild(
            avatar
        );


        const info =
            document.createElement(
                "div"
            );


        info.className =
            "user-info";


        const top =
            document.createElement(
                "div"
            );


        top.className =
            "user-top";


        const nameElement =
            document.createElement(
                "div"
            );


        nameElement.className =
            "user-name";


        nameElement.textContent =
            name;


        const time =
            document.createElement(
                "div"
            );


        time.className =
            "last-time";


        time.textContent =
            last
                ? formatTime(
                    last.created_at
                )
                : "";


        top.appendChild(
            nameElement
        );


        top.appendChild(
            time
        );


        const lastText =
            document.createElement(
                "div"
            );


        lastText.className =
            "last-message";


        lastText.textContent =
            last
                ? last.message
                : "ابدأ محادثة جديدة 💬";


        const status =
            document.createElement(
                "div"
            );


        status.className =
            "user-status";


        status.textContent =
            "متاح للدردشة";


        info.appendChild(
            top
        );


        info.appendChild(
            lastText
        );


        info.appendChild(
            status
        );


        button.appendChild(
            avatarWrap
        );


        button.appendChild(
            info
        );


        button.onclick =
            () => {

                openConversation(
                    user
                );

            };


        container.appendChild(
            button
        );

    });

}


/* ==========================================
   البحث
========================================== */

function filterUsers() {

    const input =
        document.getElementById(
            "searchInput"
        );


    const search =
        input.value
            .trim()
            .toLowerCase();


    if (!search) {

        renderUsers(
            userResults.length
                ? userResults
                : allUsers.map(
                    user => ({
                        user,
                        lastMessage: null,
                        conversationId: null
                    })
                )
        );

        return;

    }


    const filtered =
        userResults.filter(
            item => {

                const name =
                    (
                        item.user.display_name ||
                        ""
                    ).toLowerCase();


                return name.includes(
                    search
                );

            }
        );


    renderUsers(
        filtered
    );

}


document
    .getElementById(
        "searchInput"
    )
    .addEventListener(
        "input",
        filterUsers
    );


/* ==========================================
   فتح المحادثة
========================================== */

async function openConversation(user) {

    selectedUser =
        user;


    const name =
        user.display_name ||
        "مستخدم";


    document.getElementById(
        "chatTitle"
    ).textContent =
        name;


    document.getElementById(
        "chatAvatar"
    ).textContent =
        name
            .charAt(0)
            .toUpperCase();


    document.getElementById(
        "chatStatus"
    ).textContent =
        "متاح للدردشة";


    document.getElementById(
        "chatScreen"
    ).classList.add(
        "show"
    );


    const {
        data,
        error
    } =
        await supabaseClient
            .from("conversations")
            .select("*")
            .or(
                `and(user1_id.eq.${currentUser.id},user2_id.eq.${user.id}),and(user1_id.eq.${user.id},user2_id.eq.${currentUser.id})`
            )
            .maybeSingle();


    if (error) {

        console.error(
            "Conversation error:",
            error
        );

        return;

    }


    if (data) {

        currentConversation =
            data;

    }

    else {

        const {
            data: newConversation,
            error: createError
        } =
            await supabaseClient
                .from("conversations")
                .insert({

                    user1_id:
                        currentUser.id,

                    user2_id:
                        user.id

                })
                .select()
                .single();


        if (createError) {

            console.error(
                "Create conversation error:",
                createError
            );

            return;

        }


        currentConversation =
            newConversation;

    }


    await loadMessages();


    subscribeToMessages();


    subscribeToTyping();

}


/* ==========================================
   إغلاق المحادثة
========================================== */

function closeChat() {

    document
        .getElementById(
            "chatScreen"
        )
        .classList.remove(
            "show"
        );


    if (realtimeChannel) {

        supabaseClient.removeChannel(
            realtimeChannel
        );

        realtimeChannel =
            null;

    }


    if (typingChannel) {

        supabaseClient.removeChannel(
            typingChannel
        );

        typingChannel =
            null;

    }


    selectedUser =
        null;

}


/* ==========================================
   تحميل الرسائل
========================================== */

async function loadMessages() {

    if (!currentConversation)
        return;


    const {
        data,
        error
    } =
        await supabaseClient
            .from("messages")
            .select("*")
            .eq(
                "conversation_id",
                currentConversation.id
            )
            .order(
                "created_at",
                {
                    ascending: true
                }
            );


    if (error) {

        console.error(
            "Messages error:",
            error
        );

        return;

    }


    const container =
        document.getElementById(
            "messages"
        );


    container.innerHTML =
        "";


    if (
        !data ||
        data.length === 0
    ) {

        container.innerHTML =

            '<div class="empty">' +
            'لا توجد رسائل بعد 👋' +
            '</div>';

        return;

    }


    data.forEach(
        message => {

            displayMessage(
                message
            );

        }
    );


    container.scrollTop =
        container.scrollHeight;

}


/* ==========================================
   عرض رسالة
========================================== */

function displayMessage(message) {

    const container =
        document.getElementById(
            "messages"
        );


    /*
       إذا كانت الشاشة تعرض رسالة
       "لا توجد رسائل"، نحذفها
    */

    const empty =
        container.querySelector(
            ".empty"
        );


    if (empty) {

        empty.remove();

    }


    const div =
        document.createElement(
            "div"
        );


    div.className =
        "message";


    if (
        message.sender_id ===
        currentUser.id
    ) {

        div.classList.add(
            "mine"
        );

    }

    else {

        div.classList.add(
            "theirs"
        );

    }


    div.textContent =
        message.message;


    const time =
        document.createElement(
            "span"
        );


    time.className =
        "message-time";


    time.textContent =
        formatTime(
            message.created_at
        );


    div.appendChild(
        time
    );


    container.appendChild(
        div
    );


    container.scrollTop =
        container.scrollHeight;

}


/* ==========================================
   إرسال رسالة
========================================== */

async function sendMessage() {

    if (!currentConversation) {

        alert(
            "اختر مستخدمًا أولًا"
        );

        return;

    }


    const input =
        document.getElementById(
            "messageInput"
        );


    const text =
        input.value.trim();


    if (!text)
        return;


    /*
       نرسل الرسالة إلى Supabase
       ونطلب البيانات التي تم إنشاؤها
    */

    const {
        data,
        error
    } =
        await supabaseClient
            .from("messages")
            .insert({

                conversation_id:
                    currentConversation.id,

                sender_id:
                    currentUser.id,

                message:
                    text

            })
            .select()
            .single();


    if (error) {

        console.error(
            "Send message error:",
            error
        );

        alert(
            "حدث خطأ أثناء إرسال الرسالة"
        );

        return;

    }


    /*
       نفرغ مربع الكتابة
    */

    input.value =
        "";


    /*
       نعرض الرسالة عندنا فورًا
    */

    if (data) {

        displayMessage(
            data
        );

    }


    /*
       نحدث آخر رسالة في القائمة
    */

    loadLastMessages();

}


/* ==========================================
   Enter
========================================== */

document
    .getElementById(
        "messageInput"
    )
    .addEventListener(
        "keydown",
        function(event) {

            if (
                event.key === "Enter"
            ) {

                event.preventDefault();

                sendMessage();

            }

        }
    );


/* ==========================================
   Realtime الرسائل
========================================== */

function subscribeToMessages() {

    if (!currentConversation)
        return;


    if (realtimeChannel) {

        supabaseClient.removeChannel(
            realtimeChannel
        );

    }


    realtimeChannel =
        supabaseClient
            .channel(
                "chat-" +
                currentConversation.id
            )
            .on(

                "postgres_changes",

                {

                    event: "INSERT",

                    schema: "public",

                    table: "messages",

                    filter:
                        "conversation_id=eq." +
                        currentConversation.id

                },

                payload => {

                    /*
                       رسائل الطرف الآخر فقط
                       لأن رسالتنا نعرضها مباشرة
                       داخل sendMessage()
                    */

                    if (
                        payload.new.sender_id !==
                        currentUser.id
                    ) {

                        displayMessage(
                            payload.new
                        );

                    }

                }

            )
            .subscribe();

}


/* ==========================================
   يكتب الآن
========================================== */

function subscribeToTyping() {

    if (!currentConversation)
        return;


    if (typingChannel) {

        supabaseClient.removeChannel(
            typingChannel
        );

    }


    typingChannel =
        supabaseClient
            .channel(
                "typing-" +
                currentConversation.id
            )
            .on(

                "broadcast",

                {
                    event: "typing"
                },

                payload => {

                    if (
                        payload.payload &&
                        payload.payload.userId !==
                        currentUser.id
                    ) {

                        const indicator =
                            document.getElementById(
                                "typingIndicator"
                            );


                        indicator.classList.add(
                            "show"
                        );


                        clearTimeout(
                            window.typingTimer
                        );


                        window.typingTimer =
                            setTimeout(
                                () => {

                                    indicator.classList.remove(
                                        "show"
                                    );

                                },
                                1500
                            );

                    }

                }

            )
            .subscribe();

}


/* ==========================================
   إرسال حالة الكتابة
========================================== */

document
    .getElementById(
        "messageInput"
    )
    .addEventListener(
        "input",
        function() {

            if (
                !currentConversation ||
                !typingChannel
            ) {

                return;

            }


            clearTimeout(
                typingSendTimer
            );


            typingChannel.send({

                type:
                    "broadcast",

                event:
                    "typing",

                payload: {

                    userId:
                        currentUser.id

                }

            });


            typingSendTimer =
                setTimeout(
                    () => {},
                    700
                );

        }
    );


/* ==========================================
   بدء المكالمة
========================================== */

async function startCall() {

    if (!selectedUser) {

        alert(
            "اختر مستخدمًا أولًا"
        );

        return;

    }


    const {
        data,
        error
    } =
        await supabaseClient
            .from("calls")
            .insert({

                caller_id:
                    currentUser.id,

                receiver_id:
                    selectedUser.id,

                status:
                    "ringing"

            })
            .select()
            .single();


    if (error) {

        console.error(
            "Call error:",
            error
        );


        alert(
            "❌ حدث خطأ أثناء إرسال طلب المكالمة:\n" +
            error.message
        );

        return;

    }


    alert(
        "📞 تم إرسال طلب المكالمة إلى " +
        (
            selectedUser.display_name ||
            "المستخدم"
        )
    );

}


/* ==========================================
   استقبال المكالمات
========================================== */

function subscribeToCalls() {

    if (callsChannel) {

        supabaseClient.removeChannel(
            callsChannel
        );

    }


    callsChannel =
        supabaseClient
            .channel(
                "calls-" +
                currentUser.id
            )
            .on(

                "postgres_changes",

                {

                    event:
                        "INSERT",

                    schema:
                        "public",

                    table:
                        "calls"

                },

                async payload => {

                    const call =
                        payload.new;


                    if (
                        call.receiver_id !==
                        currentUser.id
                    ) {

                        return;

                    }


                    if (
                        call.status !==
                        "ringing"
                    ) {

                        return;

                    }


                    incomingCall =
                        call;


                    await showIncomingCall(
                        call
                    );

                }

            )
            .subscribe();

}


/* ==========================================
   عرض المكالمة
========================================== */

async function showIncomingCall(call) {

    let callerName =
        "مستخدم";


    const {
        data,
        error
    } =
        await supabaseClient
            .from("profiles")
            .select(
                "display_name"
            )
            .eq(
                "id",
                call.caller_id
            )
            .maybeSingle();


    if (
        !error &&
        data
    ) {

        callerName =
            data.display_name ||
            "مستخدم";

    }


    document.getElementById(
        "callerName"
    ).textContent =
        callerName +
        " يتصل بك";


    document.getElementById(
        "callAvatar"
    ).textContent =
        callerName
            .charAt(0)
            .toUpperCase();


    document.getElementById(
        "callOverlay"
    ).style.display =
        "flex";

}


/* ==========================================
   قبول المكالمة
========================================== */

async function acceptCall() {

    if (!incomingCall)
        return;


    const {
        error
    } =
        await supabaseClient
            .from("calls")
            .update({

                status:
                    "accepted"

            })
            .eq(
                "id",
                incomingCall.id
            );


    if (error) {

        console.error(
            error
        );


        alert(
            "❌ حدث خطأ أثناء قبول المكالمة"
        );

        return;

    }


    document.getElementById(
        "callOverlay"
    ).style.display =
        "none";


    alert(
        "✅ تم قبول المكالمة.\n\nالصوت بين الطرفين نضيفه في الخطوة التالية."
    );


    incomingCall =
        null;

}


/* ==========================================
   رفض المكالمة
========================================== */

async function rejectCall() {

    if (!incomingCall)
        return;


    const {
        error
    } =
        await supabaseClient
            .from("calls")
            .update({

                status:
                    "rejected"

            })
            .eq(
                "id",
                incomingCall.id
            );


    if (error) {

        console.error(
            error
        );

        return;

    }


    document.getElementById(
        "callOverlay"
    ).style.display =
        "none";


    incomingCall =
        null;

}


/* ==========================================
   تشغيل الصفحة
========================================== */

loadCurrentUser();

</script>
