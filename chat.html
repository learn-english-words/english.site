
<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>الدردشة - EnglishWords</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
}

body {

    font-family:
        Arial,
        Tahoma,
        sans-serif;

    background: #f5f7fb;

    color: #171827;

    overflow: hidden;
}

button,
input {
    font-family: inherit;
}


/* ==========================================
   الصفحة الرئيسية
========================================== */

.chat-container {

    width: 100%;

    max-width: 900px;

    height: 100vh;

    height: 100dvh;

    margin: auto;

    background: white;

    display: flex;

    flex-direction: column;

    overflow: hidden;
}


/* ==========================================
   الهيدر
========================================== */

.topbar {

    flex-shrink: 0;

    padding:
        15px
        18px;

    background:
        linear-gradient(
            135deg,
            #6254eb,
            #8374ed
        );

    color: white;

    display: flex;

    align-items: center;

    gap: 12px;
}


.back {

    border: none;

    background:
        rgba(255,255,255,.18);

    color: white;

    width: 42px;

    height: 42px;

    border-radius: 13px;

    cursor: pointer;

    font-size: 20px;
}


.topbar-title {

    flex: 1;

    display: flex;

    align-items: center;

    gap: 8px;
}


.topbar h2 {

    margin: 0;

    font-size: 20px;
}


/* ==========================================
   عداد الإشعارات
========================================== */

.notification-badge {

    min-width: 22px;

    height: 22px;

    padding: 0 6px;

    border-radius: 20px;

    background: #ef4444;

    color: white;

    display: none;

    align-items: center;

    justify-content: center;

    font-size: 11px;

    font-weight: bold;
}


.notification-badge.show {

    display: flex;
}


/* ==========================================
   قائمة المستخدمين
========================================== */

.conversations-section {

    flex: 1;

    min-height: 0;

    overflow-y: auto;

    overflow-x: hidden;
}


.search-box {

    padding: 15px;

    border-bottom:
        1px solid #eee;

    background: white;

    position: sticky;

    top: 0;

    z-index: 10;
}


.search-box input {

    width: 100%;

    border: none;

    outline: none;

    background: #f5f6fa;

    border-radius: 14px;

    padding:
        13px
        15px;

    font-size: 14px;
}


#usersContainer {

    width: 100%;
}


/* ==========================================
   المستخدم
========================================== */

.user {

    width: 100%;

    padding:
        14px
        17px;

    border: none;

    border-bottom:
        1px solid #f0f0f3;

    background: white;

    display: flex;

    align-items: center;

    gap: 12px;

    cursor: pointer;

    text-align: right;

    transition: .15s;

    position: relative;
}


.user:hover {

    background: #f8f8ff;
}


.user:active {

    transform: scale(.99);
}


.avatar-wrap {

    position: relative;

    flex-shrink: 0;
}


.avatar {

    width: 52px;

    height: 52px;

    border-radius: 50%;

    background:
        linear-gradient(
            135deg,
            #6254eb,
            #8374ed
        );

    color: white;

    display: flex;

    align-items: center;

    justify-content: center;

    font-size: 19px;

    font-weight: bold;
}


.user-info {

    flex: 1;

    min-width: 0;
}


.user-top {

    display: flex;

    align-items: center;

    justify-content: space-between;

    gap: 10px;
}


.user-name {

    font-weight: bold;

    font-size: 15px;

    white-space: nowrap;

    overflow: hidden;

    text-overflow: ellipsis;
}


.last-time {

    color: #999;

    font-size: 10px;

    white-space: nowrap;
}


.last-message {

    margin-top: 5px;

    color: #888;

    font-size: 12px;

    white-space: nowrap;

    overflow: hidden;

    text-overflow: ellipsis;
}


.user-status {

    margin-top: 4px;

    color: #999;

    font-size: 10px;
}


/* ==========================================
   عدد الرسائل للمستخدم
========================================== */

.user-unread {

    min-width: 21px;

    height: 21px;

    padding:
        0
        6px;

    border-radius: 20px;

    background: #ef4444;

    color: white;

    display: none;

    align-items: center;

    justify-content: center;

    font-size: 10px;

    font-weight: bold;

    flex-shrink: 0;
}


.user-unread.show {

    display: flex;
}


/* ==========================================
   الإشعار العائم
========================================== */

.message-notification {

    position: fixed;

    top: 15px;

    left: 50%;

    transform:
        translateX(-50%)
        translateY(-120px);

    width:
        calc(100% - 30px);

    max-width: 400px;

    background: white;

    border-radius: 17px;

    padding:
        13px
        15px;

    box-shadow:
        0 10px 35px
        rgba(0,0,0,.18);

    display: flex;

    align-items: center;

    gap: 11px;

    z-index: 10000;

    cursor: pointer;

    opacity: 0;

    transition:
        .3s ease;
}


.message-notification.show {

    opacity: 1;

    transform:
        translateX(-50%)
        translateY(0);
}


.notification-avatar {

    width: 42px;

    height: 42px;

    flex-shrink: 0;

    border-radius: 50%;

    background:
        linear-gradient(
            135deg,
            #6254eb,
            #8374ed
        );

    color: white;

    display: flex;

    align-items: center;

    justify-content: center;

    font-weight: bold;
}


.notification-content {

    min-width: 0;

    flex: 1;
}


.notification-name {

    font-size: 13px;

    font-weight: bold;
}


.notification-text {

    margin-top: 3px;

    color: #777;

    font-size: 11px;

    white-space: nowrap;

    overflow: hidden;

    text-overflow: ellipsis;
}


/* ==========================================
   الحالة الفارغة
========================================== */

.empty {

    text-align: center;

    color: #888;

    padding:
        50px
        20px;

    font-size: 13px;
}


/* ==========================================
   شاشة المحادثة
========================================== */

.chat-screen {

    position: fixed;

    inset: 0;

    background: #f5f7fb;

    z-index: 3000;

    display: none;

    flex-direction: column;

    width: 100%;

    height: 100%;

    height: 100dvh;
}


.chat-screen.show {

    display: flex;
}


/* ==========================================
   هيدر المحادثة
========================================== */

.chat-header {

    flex-shrink: 0;

    min-height: 70px;

    padding:
        10px
        15px;

    background: white;

    border-bottom:
        1px solid #eee;

    display: flex;

    align-items: center;

    gap: 10px;
}


.chat-back {

    border: none;

    background: #f2f3f7;

    width: 42px;

    height: 42px;

    border-radius: 13px;

    cursor: pointer;

    font-size: 20px;

    flex-shrink: 0;
}


.chat-avatar {

    width: 45px;

    height: 45px;

    border-radius: 50%;

    background:
        linear-gradient(
            135deg,
            #6254eb,
            #8374ed
        );

    color: white;

    display: flex;

    align-items: center;

    justify-content: center;

    font-weight: bold;

    flex-shrink: 0;
}


.chat-user-info {

    flex: 1;

    min-width: 0;
}


.chat-user-name {

    font-weight: bold;

    font-size: 15px;
}


.chat-status {

    color: #999;

    font-size: 11px;

    margin-top: 4px;
}


.call-btn {

    border: none;

    background: #16a34a;

    color: white;

    width: 43px;

    height: 43px;

    border-radius: 50%;

    cursor: pointer;

    font-size: 19px;

    flex-shrink: 0;
}


/* ==========================================
   الرسائل
========================================== */

.messages {

    flex: 1;

    min-height: 0;

    overflow-y: auto;

    overflow-x: hidden;

    padding:
        18px;

    display: flex;

    flex-direction: column;

    gap: 8px;
}


.message {

    max-width: 75%;

    padding:
        10px
        14px;

    border-radius: 17px;

    word-break: break-word;

    font-size: 14px;

    line-height: 1.5;
}


.mine {

    align-self: flex-start;

    background: #6254eb;

    color: white;

    border-bottom-left-radius: 5px;
}


.theirs {

    align-self: flex-end;

    background: white;

    color: #171827;

    border-bottom-right-radius: 5px;

    box-shadow:
        0 2px 8px
        rgba(0,0,0,.04);
}


.message-time {

    display: block;

    font-size: 9px;

    margin-top: 4px;

    opacity: .7;
}


/* ==========================================
   يكتب الآن
========================================== */

.typing {

    display: none;

    flex-shrink: 0;

    padding:
        0
        18px
        7px;

    color: #777;

    font-size: 11px;
}


.typing.show {

    display: block;
}


/* ==========================================
   صندوق الإرسال
========================================== */

.send-box {

    flex-shrink: 0;

    width: 100%;

    display: flex;

    flex-direction: row;

    gap: 8px;

    padding:
        10px;

    background: white;

    border-top:
        1px solid #eee;

    direction: rtl;
}


/*
   خانة الكتابة تكون في اليمين
*/

.send-box input {

    flex: 1;

    min-width: 0;

    width: auto;

    padding:
        13px
        15px;

    border: none;

    outline: none;

    background: #f5f6fa;

    border-radius: 15px;

    font-size: 14px;

    direction: rtl;
}


/*
   زر الإرسال ثابت بجانب الخانة
   ولا يحتاج المستخدم يلف الشاشة
*/

.send-box button {

    flex:
        0
        0
        48px;

    width: 48px;

    height: 48px;

    border: none;

    background: #6254eb;

    color: white;

    border-radius: 15px;

    cursor: pointer;

    font-size: 18px;

    display: flex;

    align-items: center;

    justify-content: center;

    touch-action: manipulation;
}


/* ==========================================
   المكالمة الواردة
========================================== */

.call-overlay {

    position: fixed;

    inset: 0;

    background:
        rgba(0,0,0,.55);

    display: none;

    align-items: center;

    justify-content: center;

    z-index: 9999;

    padding: 20px;
}


.call-box {

    width: 100%;

    max-width: 350px;

    background: white;

    border-radius: 22px;

    padding:
        30px
        20px;

    text-align: center;
}


.call-avatar {

    width: 80px;

    height: 80px;

    border-radius: 50%;

    background: #6254eb;

    color: white;

    display: flex;

    align-items: center;

    justify-content: center;

    margin: auto;

    font-size: 30px;

    font-weight: bold;
}


.call-box h2 {

    margin:
        15px
        0
        8px;
}


.call-box p {

    color: #666;
}


.call-actions {

    display: flex;

    justify-content: center;

    gap: 20px;

    margin-top: 25px;
}


.call-action {

    border: none;

    width: 58px;

    height: 58px;

    border-radius: 50%;

    color: white;

    font-size: 24px;

    cursor: pointer;
}


.accept-call {

    background: #16a34a;
}


.reject-call {

    background: #dc2626;
}


/* ==========================================
   الجوال
========================================== */

@media (max-width: 600px) {

    .chat-container {

        width: 100%;

        max-width: none;
    }


    .message {

        max-width: 82%;
    }


    .send-box {

        padding:
            8px;

        gap: 7px;
    }


    .send-box input {

        font-size: 14px;

        padding:
            12px
            14px;
    }


    .send-box button {

        width: 47px;

        flex-basis: 47px;

        height: 47px;

        border-radius: 14px;
    }

}


/* ==========================================
   منع مشاكل لوحة المفاتيح
========================================== */

@supports (height: 100dvh) {

    .chat-container,
    .chat-screen {

        height: 100dvh;
    }

}

</style>

</head>


<body>


<!-- ==========================================
     الإشعار العائم
========================================== -->

<div
    id="messageNotification"
    class="message-notification">

    <div
        id="notificationAvatar"
        class="notification-avatar">

        ؟

    </div>

    <div class="notification-content">

        <div
            id="notificationName"
            class="notification-name">

            رسالة جديدة

        </div>

        <div
            id="notificationText"
            class="notification-text">

            لديك رسالة جديدة

        </div>

    </div>

</div>


<!-- ==========================================
     الصفحة الرئيسية
========================================== -->

<div class="chat-container">


<header class="topbar">


    <button
        class="back"
        onclick="window.location.href='index.html'">

        ←

    </button>


    <div class="topbar-title">

        <h2>
            💬 الدردشة
        </h2>


        <div
            id="notificationBadge"
            class="notification-badge">

            0

        </div>

    </div>


</header>


<section class="conversations-section">


    <div class="search-box">

        <input
            type="text"
            id="searchInput"
            placeholder="🔎 ابحث عن مستخدم..."
            autocomplete="off">

    </div>


    <div id="usersContainer">

        <div class="empty">

            جاري تحميل المستخدمين...

        </div>

    </div>


</section>


</div>


<!-- ==========================================
     شاشة المحادثة
========================================== -->

<div
    id="chatScreen"
    class="chat-screen">


<header class="chat-header">


    <button
        class="chat-back"
        onclick="closeChat()">

        →


    </button>


    <div
        class="chat-avatar"
        id="chatAvatar">

        ؟


    </div>


    <div class="chat-user-info">


        <div
            class="chat-user-name"
            id="chatTitle">

            مستخدم

        </div>


        <div
            class="chat-status"
            id="chatStatus">

            متاح للدردشة

        </div>


    </div>


    <button
        class="call-btn"
        onclick="startCall()"
        title="اتصال صوتي">

        📞

    </button>


</header>


<div
    class="messages"
    id="messages">


    <div class="empty">

        لا توجد رسائل بعد 👋

    </div>


</div>


<div
    id="typingIndicator"
    class="typing">

    يكتب الآن...

</div>


<div class="send-box">


    <input
        type="text"
        id="messageInput"
        placeholder="اكتب رسالتك..."
        autocomplete="off">


    <button
        id="sendButton"
        type="button"
        onclick="sendMessage()">

        ➤

    </button>


</div>


</div>


<!-- ==========================================
     المكالمة الواردة
========================================== -->

<div
    id="callOverlay"
    class="call-overlay">


<div class="call-box">


    <div
        id="callAvatar"
        class="call-avatar">

        ؟

    </div>


    <h2>

        📞 مكالمة واردة

    </h2>


    <p id="callerName">

        مستخدم يتصل بك...

    </p>


    <div class="call-actions">


        <button
            class="call-action reject-call"
            onclick="rejectCall()">

            ❌

        </button>


        <button
            class="call-action accept-call"
            onclick="acceptCall()">

            📞

        </button>


    </div>


</div>


</div>


<script>

/* ==========================================
   المتغيرات
========================================== */

let currentUser = null;

let selectedUser = null;

let currentConversation = null;

let realtimeChannel = null;

let globalMessagesChannel = null;

let callsChannel = null;

let incomingCall = null;

let allUsers = [];

let userResults = [];

let typingChannel = null;

let typingSendTimer = null;

let notificationTimer = null;


/*
   عدد الإشعارات
*/

let totalUnread = 0;


/*
   الرسائل غير المقروءة لكل مستخدم
*/

let unreadCounts = {};


/* ==========================================
   الوقت
========================================== */

function formatTime(date) {

    if (!date)
        return "";


    return new Date(date)
        .toLocaleTimeString(
            "ar-SA",
            {
                hour: "numeric",
                minute: "2-digit"
            }
        );

}


/* ==========================================
   تحميل المستخدم الحالي
========================================== */

async function loadCurrentUser() {

    const {
        data: { user },
        error
    } =
        await supabaseClient
            .auth
            .getUser();


    if (
        error ||
        !user
    ) {

        window.location.href =
            "login.html";

        return;

    }


    currentUser =
        user;


    await loadUsers();


    /*
       مهم:
       نستمع لجميع الرسائل من بداية الصفحة
    */

    subscribeToAllMessages();


    subscribeToCalls();

}


/* ==========================================
   تحميل المستخدمين
========================================== */

async function loadUsers() {

    const {
        data,
        error
    } =
        await supabaseClient
            .from("profiles")
            .select(
                "id, display_name, is_public"
            )
            .neq(
                "id",
                currentUser.id
            )
            .eq(
                "is_public",
                true
            )
            .order(
                "display_name",
                {
                    ascending: true
                }
            );


    if (error) {

        console.error(
            "خطأ في تحميل المستخدمين:",
            error
        );


        document.getElementById(
            "usersContainer"
        ).innerHTML =

            '<div class="empty">' +
            'حدث خطأ في تحميل المستخدمين ❌' +
            '</div>';

        return;

    }


    allUsers =
        data || [];


    userResults =
        allUsers.map(
            user => ({

                user:
                    user,

                lastMessage:
                    null,

                conversationId:
                    null

            })
        );


    renderUsers(
        userResults
    );


    loadLastMessages();

}


/* ==========================================
   تحميل آخر الرسائل
========================================== */

async function loadLastMessages() {

    const results = [];


    for (
        const user
        of allUsers
    ) {

        let lastMessage = null;

        let conversationId = null;


        try {

            const {
                data: conversations
            } =
                await supabaseClient
                    .from("conversations")
                    .select("id")
                    .or(
                        `and(user1_id.eq.${currentUser.id},user2_id.eq.${user.id}),and(user1_id.eq.${user.id},user2_id.eq.${currentUser.id})`
                    )
                    .limit(1);


            if (
                conversations &&
                conversations.length > 0
            ) {

                conversationId =
                    conversations[0].id;


                const {
                    data: messages
                } =
                    await supabaseClient
                        .from("messages")
                        .select(
                            "message, created_at"
                        )
                        .eq(
                            "conversation_id",
                            conversationId
                        )
                        .order(
                            "created_at",
                            {
                                ascending: false
                            }
                        )
                        .limit(1);


                if (
                    messages &&
                    messages.length > 0
                ) {

                    lastMessage =
                        messages[0];

                }

            }

        }

        catch (error) {

            console.error(
                "خطأ في آخر رسالة:",
                error
            );

        }


        results.push({

            user:
                user,

            lastMessage:
                lastMessage,

            conversationId:
                conversationId

        });

    }


    results.sort(
        (a, b) => {

            const aTime =
                a.lastMessage
                    ? new Date(
                        a.lastMessage.created_at
                    ).getTime()
                    : 0;


            const bTime =
                b.lastMessage
                    ? new Date(
                        b.lastMessage.created_at
                    ).getTime()
                    : 0;


            return bTime - aTime;

        }
    );


    userResults =
        results;


    const searchInput =
        document.getElementById(
            "searchInput"
        );


    if (
        searchInput &&
        searchInput.value.trim() !== ""
    ) {

        filterUsers();

    }

    else {

        renderUsers(
            userResults
        );

    }

}


/* ==========================================
   عرض المستخدمين
========================================== */

function renderUsers(results) {

    const container =
        document.getElementById(
            "usersContainer"
        );


    container.innerHTML =
        "";


    if (
        !results ||
        results.length === 0
    ) {

        container.innerHTML =

            '<div class="empty">' +
            'لا يوجد مستخدم بهذا الاسم 🔎' +
            '</div>';

        return;

    }


    results.forEach(
        item => {

            const user =
                item.user;


            const last =
                item.lastMessage;


            const button =
                document.createElement(
                    "button"
                );


            button.className =
                "user";


            /* الصورة */

            const avatarWrap =
                document.createElement(
                    "div"
                );


            avatarWrap.className =
                "avatar-wrap";


            const avatar =
                document.createElement(
                    "div"
                );


            avatar.className =
                "avatar";


            const name =
                user.display_name ||
                "مستخدم";


            avatar.textContent =
                name
                    .charAt(0)
                    .toUpperCase();


            avatarWrap.appendChild(
                avatar
            );


            /* المعلومات */

            const info =
                document.createElement(
                    "div"
                );


            info.className =
                "user-info";


            const top =
                document.createElement(
                    "div"
                );


            top.className =
                "user-top";


            const nameElement =
                document.createElement(
                    "div"
                );


            nameElement.className =
                "user-name";


            nameElement.textContent =
                name;


            const time =
                document.createElement(
                    "div"
                );


            time.className =
                "last-time";


            time.textContent =
                last
                    ? formatTime(
                        last.created_at
                    )
                    : "";


            top.appendChild(
                nameElement
            );


            top.appendChild(
                time
            );


            const lastText =
                document.createElement(
                    "div"
                );


            lastText.className =
                "last-message";


            lastText.textContent =
                last
                    ? last.message
                    : "ابدأ محادثة جديدة 💬";


            const status =
                document.createElement(
                    "div"
                );


            status.className =
                "user-status";


            status.textContent =
                "متاح للدردشة";


            info.appendChild(
                top
            );


            info.appendChild(
                lastText
            );


            info.appendChild(
                status
            );


            /*
               عدد الرسائل غير المقروءة
            */

            const unread =
                document.createElement(
                    "div"
                );


            unread.className =
                "user-unread";


            const unreadCount =
                unreadCounts[user.id] || 0;


            if (
                unreadCount > 0
            ) {

                unread.textContent =
                    unreadCount > 99
                        ? "99+"
                        : unreadCount;

                unread.classList.add(
                    "show"
                );

            }


            button.appendChild(
                avatarWrap
            );


            button.appendChild(
                info
            );


            button.appendChild(
                unread
            );


            button.onclick =
                () => {

                    openConversation(
                        user
                    );

                };


            container.appendChild(
                button
            );

        }
    );

}


/* ==========================================
   البحث
========================================== */

function filterUsers() {

    const input =
        document.getElementById(
            "searchInput"
        );


    const search =
        input.value
            .trim()
            .toLowerCase();


    if (!search) {

        renderUsers(
            userResults.length
                ? userResults
                : allUsers.map(
                    user => ({

                        user,

                        lastMessage:
                            null,

                        conversationId:
                            null

                    })
                )
        );

        return;

    }


    const filtered =
        userResults.filter(
            item => {

                const name =
                    (
                        item.user.display_name ||
                        ""
                    )
                    .toLowerCase();


                return name.includes(
                    search
                );

            }
        );


    renderUsers(
        filtered
    );

}


document
    .getElementById(
        "searchInput"
    )
    .addEventListener(
        "input",
        filterUsers
    );


/* ==========================================
   فتح المحادثة
========================================== */

async function openConversation(user) {

    selectedUser =
        user;


    /*
       عند فتح المحادثة:
       نصفر إشعارات هذا المستخدم
    */

    clearUnreadForUser(
        user.id
    );


    const name =
        user.display_name ||
        "مستخدم";


    document.getElementById(
        "chatTitle"
    ).textContent =
        name;


    document.getElementById(
        "chatAvatar"
    ).textContent =
        name
            .charAt(0)
            .toUpperCase();


    document.getElementById(
        "chatStatus"
    ).textContent =
        "متاح للدردشة";


    document.getElementById(
        "chatScreen"
    ).classList.add(
        "show"
    );


    const {
        data,
        error
    } =
        await supabaseClient
            .from("conversations")
            .select("*")
            .or(
                `and(user1_id.eq.${currentUser.id},user2_id.eq.${user.id}),and(user1_id.eq.${user.id},user2_id.eq.${currentUser.id})`
            )
            .maybeSingle();


    if (error) {

        console.error(
            "Conversation error:",
            error
        );

        return;

    }


    if (data) {

        currentConversation =
            data;

    }

    else {

        const {
            data: newConversation,
            error: createError
        } =
            await supabaseClient
                .from("conversations")
                .insert({

                    user1_id:
                        currentUser.id,

                    user2_id:
                        user.id

                })
                .select()
                .single();


        if (createError) {

            console.error(
                "Create conversation error:",
                createError
            );

            return;

        }


        currentConversation =
            newConversation;

    }


    await loadMessages();


    subscribeToTyping();

}


/* ==========================================
   إغلاق المحادثة
========================================== */

function closeChat() {

    document
        .getElementById(
            "chatScreen"
        )
        .classList.remove(
            "show"
        );


    if (typingChannel) {

        supabaseClient.removeChannel(
            typingChannel
        );

        typingChannel =
            null;

    }


    if (realtimeChannel) {

        supabaseClient.removeChannel(
            realtimeChannel
        );

        realtimeChannel =
            null;

    }


    currentConversation =
        null;


    selectedUser =
        null;

}


/* ==========================================
   تحميل الرسائل
========================================== */

async function loadMessages() {

    if (!currentConversation)
        return;


    const {
        data,
        error
    } =
        await supabaseClient
            .from("messages")
            .select("*")
            .eq(
                "conversation_id",
                currentConversation.id
            )
            .order(
                "created_at",
                {
                    ascending: true
                }
            );


    if (error) {

        console.error(
            "Messages error:",
            error
        );

        return;

    }


    const container =
        document.getElementById(
            "messages"
        );


    container.innerHTML =
        "";


    if (
        !data ||
        data.length === 0
    ) {

        container.innerHTML =

            '<div class="empty">' +
            'لا توجد رسائل بعد 👋' +
            '</div>';

        return;

    }


    data.forEach(
        message => {

            displayMessage(
                message
            );

        }
    );


    container.scrollTop =
        container.scrollHeight;

}


/* ==========================================
   عرض رسالة
========================================== */

function displayMessage(message) {

    const container =
        document.getElementById(
            "messages"
        );


    /*
       إزالة "لا توجد رسائل"
    */

    const empty =
        container.querySelector(
            ".empty"
        );


    if (empty) {

        empty.remove();

    }


    /*
       منع تكرار الرسالة
    */

    if (
        message.id &&
        container.querySelector(
            `[data-message-id="${message.id}"]`
        )
    ) {

        return;

    }


    const div =
        document.createElement(
            "div"
        );


    div.className =
        "message";


    if (
        message.sender_id ===
        currentUser.id
    ) {

        div.classList.add(
            "mine"
        );

    }

    else {

        div.classList.add(
            "theirs"
        );

    }


    if (message.id) {

        div.dataset.messageId =
            message.id;

    }


    div.textContent =
        message.message;


    const time =
        document.createElement(
            "span"
        );


    time.className =
        "message-time";


    time.textContent =
        formatTime(
            message.created_at
        );


    div.appendChild(
        time
    );


    container.appendChild(
        div
    );


    container.scrollTop =
        container.scrollHeight;

}


/* ==========================================
   إرسال رسالة
========================================== */

async function sendMessage() {

    if (!currentConversation) {

        alert(
            "اختر مستخدمًا أولًا"
        );

        return;

    }


    const input =
        document.getElementById(
            "messageInput"
        );


    const text =
        input.value.trim();


    if (!text)
        return;


    /*
       نعطل الزر مؤقتًا
       لمنع الضغط المتكرر
    */

    const sendButton =
        document.getElementById(
            "sendButton"
        );


    sendButton.disabled =
        true;


    const {
        data,
        error
    } =
        await supabaseClient
            .from("messages")
            .insert({

                conversation_id:
                    currentConversation.id,

                sender_id:
                    currentUser.id,

                message:
                    text

            })
            .select()
            .single();


    sendButton.disabled =
        false;


    if (error) {

        console.error(
            "Send message error:",
            error
        );


        alert(
            "حدث خطأ أثناء إرسال الرسالة"
        );

        return;

    }


    input.value =
        "";


    /*
       تظهر عند المرسل مباشرة
    */

    if (data) {

        displayMessage(
            data
        );

    }


    /*
       تحديث القائمة
    */

    updateLastMessageInList(
        currentConversation.id,
        data
    );

}


/* ==========================================
   Enter لإرسال الرسالة
========================================== */

document
    .getElementById(
        "messageInput"
    )
    .addEventListener(
        "keydown",
        function(event) {

            if (
                event.key === "Enter"
            ) {

                event.preventDefault();

                sendMessage();

            }

        }
    );


/* ==========================================
   تحديث آخر رسالة في القائمة
========================================== */

function updateLastMessageInList(
    conversationId,
    message
) {

    if (!message)
        return;


    const item =
        userResults.find(
            x =>
                x.conversationId ===
                conversationId
        );


    if (item) {

        item.lastMessage = {

            message:
                message.message,

            created_at:
                message.created_at

        };

    }


    userResults.sort(
        (a, b) => {

            const aTime =
                a.lastMessage
                    ? new Date(
                        a.lastMessage.created_at
                    ).getTime()
                    : 0;


            const bTime =
                b.lastMessage
                    ? new Date(
                        b.lastMessage.created_at
                    ).getTime()
                    : 0;


            return bTime - aTime;

        }
    );


    filterUsers();

}


/* ==========================================
   Realtime لجميع الرسائل
========================================== */

function subscribeToAllMessages() {

    if (!currentUser)
        return;


    if (globalMessagesChannel) {

        supabaseClient.removeChannel(
            globalMessagesChannel
        );

    }


    globalMessagesChannel =
        supabaseClient
            .channel(
                "all-messages-" +
                currentUser.id
            )
            .on(

                "postgres_changes",

                {

                    event:
                        "INSERT",

                    schema:
                        "public",

                    table:
                        "messages"

                },

                async payload => {

                    const message =
                        payload.new;


                    if (
                        !message ||
                        !message.conversation_id
                    ) {

                        return;

                    }


                    /*
                       نعرف المحادثة
                    */

                    const {
                        data: conversation,
                        error
                    } =
                        await supabaseClient
                            .from("conversations")
                            .select(
                                "id, user1_id, user2_id"
                            )
                            .eq(
                                "id",
                                message.conversation_id
                            )
                            .maybeSingle();


                    if (
                        error ||
                        !conversation
                    ) {

                        return;

                    }


                    /*
                       نتأكد أنها تخصنا
                    */

                    const isMyConversation =

                        conversation.user1_id ===
                            currentUser.id

                        ||

                        conversation.user2_id ===
                            currentUser.id;


                    if (
                        !isMyConversation
                    ) {

                        return;

                    }


                    /*
                       إذا الرسالة مني:
                       لا نسوي إشعار
                    */

                    if (
                        message.sender_id ===
                        currentUser.id
                    ) {

                        return;

                    }


                    /*
                       إذا أنا داخل نفس المحادثة
                    */

                    const isCurrentChat =

                        currentConversation &&

                        currentConversation.id ===
                            message.conversation_id;


                    if (isCurrentChat) {

                        displayMessage(
                            message
                        );

                        /*
                           ما نطلع إشعار
                           لأن الرسالة أمامه
                        */

                    }

                    else {

                        /*
                           الرسالة وصلت
                           والشخص ليس داخل المحادثة
                        */

                        let sender =
                            allUsers.find(
                                u =>
                                    u.id ===
                                    message.sender_id
                            );


                        /*
                           إذا ما لقيناه
                           نجيبه من profiles
                        */

                        if (!sender) {

                            const {
                                data
                            } =
                                await supabaseClient
                                    .from("profiles")
                                    .select(
                                        "id, display_name, is_public"
                                    )
                                    .eq(
                                        "id",
                                        message.sender_id
                                    )
                                    .maybeSingle();


                            sender =
                                data;

                        }


                        /*
                           إضافة الإشعار
                        */

                        if (sender) {

                            showMessageNotification(
                                sender,
                                message
                            );


                            addUnread(
                                sender.id
                            );

                        }

                    }


                    /*
                       تحديث آخر رسالة
                    */

                    let item =
                        userResults.find(
                            x =>
                                x.conversationId ===
                                message.conversation_id
                        );


                    /*
                       إذا المحادثة غير موجودة
                    */

                    if (!item) {

                        const sender =
                            allUsers.find(
                                u =>
                                    u.id ===
                                    message.sender_id
                            );


                        if (sender) {

                            item = {

                                user:
                                    sender,

                                lastMessage:
                                    null,

                                conversationId:
                                    message.conversation_id

                            };


                            userResults.push(
                                item
                            );

                        }

                    }


                    if (item) {

                        item.lastMessage = {

                            message:
                                message.message,

                            created_at:
                                message.created_at

                        };


                        userResults.sort(
                            (a, b) => {

                                const aTime =
                                    a.lastMessage
                                        ? new Date(
                                            a.lastMessage.created_at
                                        ).getTime()
                                        : 0;


                                const bTime =
                                    b.lastMessage
                                        ? new Date(
                                            b.lastMessage.created_at
                                        ).getTime()
                                        : 0;


                                return bTime - aTime;

                            }
                        );


                        filterUsers();

                    }

                }

            )
            .subscribe(
                status => {

                    console.log(
                        "Messages realtime:",
                        status
                    );

                }
            );

}


/* ==========================================
   إشعار الرسالة
========================================== */

function showMessageNotification(
    sender,
    message
) {

    const notification =
        document.getElementById(
            "messageNotification"
        );


    const avatar =
        document.getElementById(
            "notificationAvatar"
        );


    const name =
        document.getElementById(
            "notificationName"
        );


    const text =
        document.getElementById(
            "notificationText"
        );


    const senderName =
        sender.display_name ||
        "مستخدم";


    avatar.textContent =
        senderName
            .charAt(0)
            .toUpperCase();


    name.textContent =
        "💬 " +
        senderName;


    text.textContent =
        message.message;


    notification.classList.add(
        "show"
    );


    clearTimeout(
        notificationTimer
    );


    notificationTimer =
        setTimeout(
            () => {

                notification.classList.remove(
                    "show"
                );

            },
            4000
        );


    /*
       إذا ضغط على الإشعار
       نفتح المحادثة
    */

    notification.onclick =
        () => {

            notification.classList.remove(
                "show"
            );


            openConversation(
                sender
            );

        };

}


/* ==========================================
   إضافة إشعار غير مقروء
========================================== */

function addUnread(
    userId
) {

    unreadCounts[userId] =
        (
            unreadCounts[userId] ||
            0
        ) + 1;


    totalUnread++;


    updateNotificationBadge();


    filterUsers();

}


/* ==========================================
   تصفير إشعارات مستخدم
========================================== */

function clearUnreadForUser(
    userId
) {

    const count =
        unreadCounts[userId] ||
        0;


    if (count <= 0)
        return;


    totalUnread -=
        count;


    if (totalUnread < 0)
        totalUnread = 0;


    unreadCounts[userId] =
        0;


    updateNotificationBadge();


    filterUsers();

}


/* ==========================================
   تحديث العداد العام
========================================== */

function updateNotificationBadge() {

    const badge =
        document.getElementById(
            "notificationBadge"
        );


    if (
        totalUnread > 0
    ) {

        badge.textContent =
            totalUnread > 99
                ? "99+"
                : totalUnread;


        badge.classList.add(
            "show"
        );

    }

    else {

        badge.textContent =
            "0";


        badge.classList.remove(
            "show"
        );

    }

}


/* ==========================================
   يكتب الآن
========================================== */

function subscribeToTyping() {

    if (!currentConversation)
        return;


    if (typingChannel) {

        supabaseClient.removeChannel(
            typingChannel
        );

    }


    typingChannel =
        supabaseClient
            .channel(
                "typing-" +
                currentConversation.id
            )
            .on(

                "broadcast",

                {
                    event:
                        "typing"
                },

                payload => {

                    if (

                        payload.payload &&

                        payload.payload.userId !==
                            currentUser.id

                    ) {

                        const indicator =
                            document.getElementById(
                                "typingIndicator"
                            );


                        indicator.classList.add(
                            "show"
                        );


                        clearTimeout(
                            window.typingTimer
                        );


                        window.typingTimer =
                            setTimeout(
                                () => {

                                    indicator.classList.remove(
                                        "show"
                                    );

                                },
                                1500
                            );

                    }

                }

            )
            .subscribe();

}


/* ==========================================
   إرسال حالة الكتابة
========================================== */

document
    .getElementById(
        "messageInput"
    )
    .addEventListener(
        "input",
        function() {

            if (
                !currentConversation ||
                !typingChannel
            ) {

                return;

            }


            clearTimeout(
                typingSendTimer
            );


            typingChannel.send({

                type:
                    "broadcast",

                event:
                    "typing",

                payload: {

                    userId:
                        currentUser.id

                }

            });


            typingSendTimer =
                setTimeout(
                    () => {},
                    700
                );

        }
    );


/* ==========================================
   بدء المكالمة
========================================== */

async function startCall() {

    if (!selectedUser) {

        alert(
            "اختر مستخدمًا أولًا"
        );

        return;

    }


    const {
        data,
        error
    } =
        await supabaseClient
            .from("calls")
            .insert({

                caller_id:
                    currentUser.id,

                receiver_id:
                    selectedUser.id,

                status:
                    "ringing"

            })
            .select()
            .single();


    if (error) {

        console.error(
            "Call error:",
            error
        );


        alert(
            "❌ حدث خطأ أثناء إرسال طلب المكالمة:\n" +
            error.message
        );

        return;

    }


    alert(
        "📞 تم إرسال طلب المكالمة إلى " +
        (
            selectedUser.display_name ||
            "المستخدم"
        )
    );

}


/* ==========================================
   استقبال المكالمات
========================================== */

function subscribeToCalls() {

    if (callsChannel) {

        supabaseClient.removeChannel(
            callsChannel
        );

    }


    callsChannel =
        supabaseClient
            .channel(
                "calls-" +
                currentUser.id
            )
            .on(

                "postgres_changes",

                {

                    event:
                        "INSERT",

                    schema:
                        "public",

                    table:
                        "calls"

                },

                async payload => {

                    const call =
                        payload.new;


                    if (
                        call.receiver_id !==
                        currentUser.id
                    ) {

                        return;

                    }


                    if (
                        call.status !==
                        "ringing"
                    ) {

                        return;

                    }


                    incomingCall =
                        call;


                    await showIncomingCall(
                        call
                    );

                }

            )
            .subscribe();

}


/* ==========================================
   عرض المكالمة
========================================== */

async function showIncomingCall(
    call
) {

    let callerName =
        "مستخدم";


    const {
        data,
        error
    } =
        await supabaseClient
            .from("profiles")
            .select(
                "display_name"
            )
            .eq(
                "id",
                call.caller_id
            )
            .maybeSingle();


    if (
        !error &&
        data
    ) {

        callerName =
            data.display_name ||
            "مستخدم";

    }


    document.getElementById(
        "callerName"
    ).textContent =
        callerName +
        " يتصل بك";


    document.getElementById(
        "callAvatar"
    ).textContent =
        callerName
            .charAt(0)
            .toUpperCase();


    document.getElementById(
        "callOverlay"
    ).style.display =
        "flex";

}


/* ==========================================
   قبول المكالمة
========================================== */

async function acceptCall() {

    if (!incomingCall)
        return;


    const {
        error
    } =
        await supabaseClient
            .from("calls")
            .update({

                status:
                    "accepted"

            })
            .eq(
                "id",
                incomingCall.id
            );


    if (error) {

        console.error(
            error
        );


        alert(
            "❌ حدث خطأ أثناء قبول المكالمة"
        );

        return;

    }


    document.getElementById(
        "callOverlay"
    ).style.display =
        "none";


    alert(
        "✅ تم قبول المكالمة.\n\nالصوت بين الطرفين نضيفه في الخطوة التالية."
    );


    incomingCall =
        null;

}


/* ==========================================
   رفض المكالمة
========================================== */

async function rejectCall() {

    if (!incomingCall)
        return;


    const {
        error
    } =
        await supabaseClient
            .from("calls")
            .update({

                status:
                    "rejected"

            })
            .eq(
                "id",
                incomingCall.id
            );


    if (error) {

        console.error(
            error
        );

        return;

    }


    document.getElementById(
        "callOverlay"
    ).style.display =
        "none";


    incomingCall =
        null;

}


/* ==========================================
   تشغيل الصفحة
========================================== */

loadCurrentUser();

</script>
