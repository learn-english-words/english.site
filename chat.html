<script>


// ==========================================
// المتغيرات
// ==========================================

let currentUser = null;

let selectedUser = null;

let currentConversation = null;

let realtimeChannel = null;

let callsChannel = null;

let incomingCall = null;



// ==========================================
// تحميل المستخدم الحالي
// ==========================================

async function loadCurrentUser() {

    const {
        data: { user },
        error
    } = await supabaseClient.auth.getUser();


    if (error || !user) {

        window.location.href = "login.html";

        return;

    }


    currentUser = user;

    loadUsers();

    subscribeToCalls();

}



// ==========================================
// تحميل المستخدمين
// ==========================================

async function loadUsers() {

    const {
        data,
        error
    } = await supabaseClient
        .from("profiles")
        .select("id, display_name, is_public")
        .neq("id", currentUser.id)
        .eq("is_public", true)
        .order("display_name");


    if (error) {

        console.error(
            "خطأ في تحميل المستخدمين:",
            error
        );

        document.getElementById(
            "usersList"
        ).textContent =
            "حدث خطأ في تحميل المستخدمين";

        return;

    }


    const container =
        document.getElementById("usersList");


    container.innerHTML = "";


    if (!data || data.length === 0) {

        container.innerHTML =
            '<div class="empty" style="margin: 10px;">لا يوجد مستخدمون متاحون للدردشة حاليًا 🔒</div>';

        return;

    }


    data.forEach(user => {

        const div =
            document.createElement("div");

        div.className = "user";


        const avatar =
            document.createElement("div");

        avatar.className = "avatar";


        const displayName =
            user.display_name || "مستخدم";


        avatar.textContent =
            displayName
                .charAt(0)
                .toUpperCase();


        const name =
            document.createElement("div");

        name.textContent =
            displayName;


        div.appendChild(avatar);

        div.appendChild(name);


        div.onclick = () => {

            openConversation(user);

        };


        container.appendChild(div);

    });

}



// ==========================================
// فتح المحادثة
// ==========================================

async function openConversation(user) {

    selectedUser = user;


    document.getElementById(
        "chatTitle"
    ).textContent =
        "💬 " +
        (user.display_name || "مستخدم");


    document.getElementById(
        "callBtn"
    ).style.display =
        "flex";


    const {
        data,
        error
    } = await supabaseClient
        .from("conversations")
        .select("*")
        .or(
            `and(user1_id.eq.${currentUser.id},user2_id.eq.${user.id}),and(user1_id.eq.${user.id},user2_id.eq.${currentUser.id})`
        )
        .maybeSingle();


    if (error) {

        console.error(error);

        return;

    }


    if (data) {

        currentConversation = data;

    }

    else {

        const {
            data: newConversation,
            error: createError
        } = await supabaseClient
            .from("conversations")
            .insert({

                user1_id:
                    currentUser.id,

                user2_id:
                    user.id

            })
            .select()
            .single();


        if (createError) {

            console.error(createError);

            return;

        }


        currentConversation =
            newConversation;

    }


    loadMessages();

    subscribeToMessages();

}



// ==========================================
// بدء مكالمة
// ==========================================

async function startCall() {

    if (!selectedUser) {

        alert("اختر مستخدمًا أولًا");

        return;

    }


    const {
        data,
        error
    } = await supabaseClient
        .from("calls")
        .insert({

            caller_id:
                currentUser.id,

            receiver_id:
                selectedUser.id,

            status:
                "ringing"

        })
        .select()
        .single();


    if (error) {

        console.error(
            "Call error:",
            error
        );

        alert(
            "❌ حدث خطأ أثناء إرسال طلب المكالمة:\n" +
            error.message
        );

        return;

    }


    alert(
        "📞 تم إرسال طلب المكالمة إلى " +
        (selectedUser.display_name || "المستخدم")
    );

}



// ==========================================
// الاستماع للمكالمات الواردة
// ==========================================

function subscribeToCalls() {

    if (callsChannel) {

        supabaseClient.removeChannel(
            callsChannel
        );

    }


    callsChannel =
        supabaseClient
            .channel(
                "calls-" +
                currentUser.id
            )
            .on(

                "postgres_changes",

                {

                    event: "INSERT",

                    schema: "public",

                    table: "calls"

                },

                async payload => {

                    const call =
                        payload.new;


                    if (
                        call.receiver_id !==
                        currentUser.id
                    ) {

                        return;

                    }


                    if (
                        call.status !==
                        "ringing"
                    ) {

                        return;

                    }


                    incomingCall =
                        call;


                    await showIncomingCall(
                        call
                    );

                }

            )
            .subscribe();

}



// ==========================================
// عرض المكالمة الواردة
// ==========================================

async function showIncomingCall(call) {

    let callerName =
        "مستخدم";


    const {
        data,
        error
    } = await supabaseClient
        .from("profiles")
        .select("display_name")
        .eq(
            "id",
            call.caller_id
        )
        .maybeSingle();


    if (!error && data) {

        callerName =
            data.display_name ||
            "مستخدم";

    }


    document.getElementById(
        "callerName"
    ).textContent =
        callerName +
        " يتصل بك";


    document.getElementById(
        "callAvatar"
    ).textContent =
        callerName
            .charAt(0)
            .toUpperCase();


    document.getElementById(
        "callOverlay"
    ).style.display =
        "flex";

}



// ==========================================
// قبول المكالمة
// ==========================================

async function acceptCall() {

    if (!incomingCall) return;


    const {
        error
    } = await supabaseClient
        .from("calls")
        .update({

            status:
                "accepted"

        })
        .eq(
            "id",
            incomingCall.id
        );


    if (error) {

        console.error(error);

        alert(
            "❌ حدث خطأ أثناء قبول المكالمة"
        );

        return;

    }


    document.getElementById(
        "callOverlay"
    ).style.display =
        "none";


    alert(
        "✅ تم قبول المكالمة.\n\nالخطوة القادمة سنشغل الصوت بين الطرفين."
    );


    incomingCall = null;

}



// ==========================================
// رفض المكالمة
// ==========================================

async function rejectCall() {

    if (!incomingCall) return;


    const {
        error
    } = await supabaseClient
        .from("calls")
        .update({

            status:
                "rejected"

        })
        .eq(
            "id",
            incomingCall.id
        );


    if (error) {

        console.error(error);

        return;

    }


    document.getElementById(
        "callOverlay"
    ).style.display =
        "none";


    incomingCall = null;

}



// ==========================================
// تحميل الرسائل
// ==========================================

async function loadMessages() {

    if (!currentConversation) return;


    const {
        data,
        error
    } = await supabaseClient
        .from("messages")
        .select("*")
        .eq(
            "conversation_id",
            currentConversation.id
        )
        .order(
            "created_at",
            {
                ascending: true
            }
        );


    if (error) {

        console.error(error);

        return;

    }


    const container =
        document.getElementById("messages");


    container.innerHTML = "";


    if (!data || data.length === 0) {

        container.innerHTML =
            '<div class="empty">لا توجد رسائل بعد 👋</div>';

        return;

    }


    data.forEach(message => {

        displayMessage(message);

    });


    container.scrollTop =
        container.scrollHeight;

}



// ==========================================
// عرض رسالة
// ==========================================

function displayMessage(message) {

    const container =
        document.getElementById("messages");


    const div =
        document.createElement("div");


    div.className =
        "message";


    if (
        message.sender_id ===
        currentUser.id
    ) {

        div.classList.add("mine");

    }

    else {

        div.classList.add("theirs");

    }


    div.textContent =
        message.message;


    container.appendChild(div);


    container.scrollTop =
        container.scrollHeight;

}



// ==========================================
// إرسال رسالة
// ==========================================

async function sendMessage() {

    if (!currentConversation) {

        alert(
            "اختر مستخدمًا أولًا"
        );

        return;

    }


    const input =
        document.getElementById(
            "messageInput"
        );


    const text =
        input.value.trim();


    if (!text) return;


    const {
        error
    } = await supabaseClient
        .from("messages")
        .insert({

            conversation_id:
                currentConversation.id,

            sender_id:
                currentUser.id,

            message:
                text

        });


    if (error) {

        console.error(error);

        alert(
            "حدث خطأ أثناء إرسال الرسالة"
        );

        return;

    }


    input.value = "";

}



// ==========================================
// Realtime للرسائل
// ==========================================

function subscribeToMessages() {

    if (realtimeChannel) {

        supabaseClient.removeChannel(
            realtimeChannel
        );

    }


    realtimeChannel =
        supabaseClient
            .channel(
                "chat-" +
                currentConversation.id
            )
            .on(

                "postgres_changes",

                {

                    event: "INSERT",

                    schema: "public",

                    table: "messages",

                    filter:
                        "conversation_id=eq." +
                        currentConversation.id

                },

                payload => {

                    displayMessage(
                        payload.new
                    );

                }

            )
            .subscribe();

}



// ==========================================
// Enter للإرسال
// ==========================================

document
    .getElementById("messageInput")
    .addEventListener(
        "keydown",
        function(event) {

            if (
                event.key === "Enter"
            ) {

                sendMessage();

            }

        }
    );



// ==========================================
// تشغيل
// ==========================================

loadCurrentUser();


</script>
