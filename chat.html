<style>

/* ==========================================
   الأساس
========================================== */

/* ==========================================

/* ==========================================

========================================== */

.user {

/* ==========================================

.call-avatar {

/* ==========================================

/* ==========================================

body.chat-open {

<script>

/* ==========================================
   المتغيرات
========================================== */

let currentUser = null;

let selectedUser = null;

let currentConversation = null;

let realtimeChannel = null;

let callsChannel = null;

let incomingCall = null;

let allUsers = [];

let userResults = [];

let typingChannel = null;

let typingSendTimer = null;

let allMessagesChannel = null;


/* ==========================================
   🔴 مفاتيح عداد الرسائل
========================================== */

function getReadKey(conversationId) {

    return (
        "englishwords_read_" +
        currentUser.id +
        "_" +
        conversationId
    );

}


function getLastReadTime(conversationId) {

    if (!currentUser || !conversationId)
        return null;

    return localStorage.getItem(
        getReadKey(conversationId)
    );

}


function saveLastReadTime(
    conversationId,
    time
) {

    if (
        !currentUser ||
        !conversationId ||
        !time
    ) {

        return;

    }

    localStorage.setItem(
        getReadKey(conversationId),
        time
    );

}


/* ==========================================
   تحديد المحادثة كمقروءة
========================================== */

function markConversationAsRead(
    conversationId,
    latestMessageTime = null
) {

    if (!conversationId)
        return;

    if (latestMessageTime) {

        saveLastReadTime(
            conversationId,
            latestMessageTime
        );

    }

}


/* ==========================================
   الوقت
========================================== */

function formatTime(date) {

    if (!date)
        return "";

    return new Date(date).toLocaleTimeString(
        "ar-SA",
        {
            hour: "numeric",
            minute: "2-digit"
        }
    );

}


/* ==========================================
   تحميل المستخدم الحالي
========================================== */

async function loadCurrentUser() {

    const {
        data: {
            user
        },
        error
    } =
        await supabaseClient.auth.getUser();


    if (
        error ||
        !user
    ) {

        window.location.href =
            "login.html";

        return;

    }


    currentUser =
        user;


    /*
       طلب إذن الإشعارات من notifications.js
    */

    if (
        typeof requestNotificationPermission ===
        "function"
    ) {

        await requestNotificationPermission();

    }


    await loadUsers();

    subscribeToCalls();

    subscribeToAllMessages();

}


/* ==========================================
   تحميل المستخدمين
========================================== */

async function loadUsers() {

    const {
        data,
        error
    } =
        await supabaseClient
            .from("profiles")
            .select(
                "id, display_name, is_public"
            )
            .neq(
                "id",
                currentUser.id
            )
            .eq(
                "is_public",
                true
            )
            .order(
                "display_name",
                {
                    ascending: true
                }
            );


    if (error) {

        console.error(
            "خطأ في تحميل المستخدمين:",
            error
        );


        document.getElementById(
            "usersContainer"
        ).innerHTML =

            '<div class="empty">' +
            'حدث خطأ في تحميل المستخدمين ❌' +
            '</div>';

        return;

    }


    allUsers =
        data || [];


    userResults =
        allUsers.map(
            user => ({

                user: user,

                lastMessage: null,

                conversationId: null,

                unreadCount: 0

            })
        );


    renderUsers(
        userResults
    );


    await loadLastMessages();

}


/* ==========================================
   تحميل آخر الرسائل
========================================== */

async function loadLastMessages() {

    const results = [];


    for (
        const user
        of allUsers
    ) {

        let lastMessage =
            null;

        let conversationId =
            null;


        try {

            const {
                data: conversations
            } =
                await supabaseClient
                    .from("conversations")
                    .select("id")
                    .or(
                        `and(user1_id.eq.${currentUser.id},user2_id.eq.${user.id}),and(user1_id.eq.${user.id},user2_id.eq.${currentUser.id})`
                    )
                    .limit(1);


            if (
                conversations &&
                conversations.length > 0
            ) {

                conversationId =
                    conversations[0].id;


                const {
                    data: messages
                } =
                    await supabaseClient
                        .from("messages")
                        .select(
                            "id, message, created_at, sender_id"
                        )
                        .eq(
                            "conversation_id",
                            conversationId
                        )
                        .order(
                            "created_at",
                            {
                                ascending: false
                            }
                        )
                        .limit(1);


                if (
                    messages &&
                    messages.length > 0
                ) {

                    lastMessage =
                        messages[0];

                }

            }

        }

        catch (error) {

            console.error(
                "خطأ في آخر رسالة:",
                error
            );

        }


        results.push({

            user: user,

            lastMessage:
                lastMessage,

            conversationId:
                conversationId,

            unreadCount: 0

        });

    }


    results.sort(
        (a, b) => {

            const aTime =
                a.lastMessage
                    ? new Date(
                        a.lastMessage.created_at
                    ).getTime()
                    : 0;


            const bTime =
                b.lastMessage
                    ? new Date(
                        b.lastMessage.created_at
                    ).getTime()
                    : 0;


            return bTime - aTime;

        }
    );


    userResults =
        results;


    await loadUnreadCounts();


    const searchInput =
        document.getElementById(
            "searchInput"
        );


    if (
        searchInput &&
        searchInput.value.trim() !== ""
    ) {

        filterUsers();

    }

    else {

        renderUsers(
            userResults
        );

    }

}


/* ==========================================
   🔴 حساب الرسائل غير المقروءة
========================================== */

async function loadUnreadCounts() {

    for (
        const item
        of userResults
    ) {

        if (!item.conversationId) {

            item.unreadCount = 0;

            continue;

        }


        const conversationId =
            item.conversationId;


        let lastRead =
            getLastReadTime(
                conversationId
            );


        if (
            !lastRead &&
            item.lastMessage
        ) {

            saveLastReadTime(
                conversationId,
                item.lastMessage.created_at
            );


            item.unreadCount = 0;

            continue;

        }


        if (!lastRead) {

            item.unreadCount = 0;

            continue;

        }


        try {

            const {
                count,
                error
            } =
                await supabaseClient
                    .from("messages")
                    .select(
                        "id",
                        {
                            count: "exact",
                            head: true
                        }
                    )
                    .eq(
                        "conversation_id",
                        conversationId
                    )
                    .eq(
                        "sender_id",
                        item.user.id
                    )
                    .gt(
                        "created_at",
                        lastRead
                    );


            if (error) {

                console.error(
                    "Unread count error:",
                    error
                );

                item.unreadCount = 0;

            }

            else {

                item.unreadCount =
                    count || 0;

            }

        }

        catch (error) {

            console.error(
                "Unread count exception:",
                error
            );

            item.unreadCount = 0;

        }

    }

}


/* ==========================================
   عرض المستخدمين
========================================== */

function renderUsers(results) {

    const container =
        document.getElementById(
            "usersContainer"
        );


    container.innerHTML =
        "";


    if (
        !results ||
        results.length === 0
    ) {

        container.innerHTML =

            '<div class="empty">' +
            'لا يوجد مستخدم بهذا الاسم 🔎' +
            '</div>';

        return;

    }


    results.forEach(
        item => {

            const user =
                item.user;


            const last =
                item.lastMessage;


            const unreadCount =
                item.unreadCount || 0;


            const button =
                document.createElement(
                    "button"
                );


            button.className =
                "user";


            if (unreadCount > 0) {

                button.classList.add(
                    "has-unread"
                );

            }


            const avatarWrap =
                document.createElement(
                    "div"
                );


            avatarWrap.className =
                "avatar-wrap";


            const avatar =
                document.createElement(
                    "div"
                );


            avatar.className =
                "avatar";


            const name =
                user.display_name ||
                "مستخدم";


            avatar.textContent =
                name
                    .charAt(0)
                    .toUpperCase();


            avatarWrap.appendChild(
                avatar
            );


            if (unreadCount > 0) {

                const badge =
                    document.createElement(
                        "div"
                    );


                badge.className =
                    "unread-badge";


                badge.textContent =
                    unreadCount > 99
                        ? "99+"
                        : unreadCount;


                avatarWrap.appendChild(
                    badge
                );

            }


            const info =
                document.createElement(
                    "div"
                );


            info.className =
                "user-info";


            const top =
                document.createElement(
                    "div"
                );


            top.className =
                "user-top";


            const nameElement =
                document.createElement(
                    "div"
                );


            nameElement.className =
                "user-name";


            nameElement.textContent =
                name;


            const time =
                document.createElement(
                    "div"
                );


            time.className =
                "last-time";


            time.textContent =
                last
                    ? formatTime(
                        last.created_at
                    )
                    : "";


            top.appendChild(
                nameElement
            );


            top.appendChild(
                time
            );


            const lastText =
                document.createElement(
                    "div"
                );


            lastText.className =
                "last-message";


            lastText.textContent =
                last
                    ? last.message
                    : "ابدأ محادثة جديدة 💬";


            const status =
                document.createElement(
                    "div"
                );


            status.className =
                "user-status";


            status.textContent =
                unreadCount > 0
                    ? "لديك رسائل جديدة 🔴"
                    : "متاح للدردشة";


            info.appendChild(
                top
            );


            info.appendChild(
                lastText
            );


            info.appendChild(
                status
            );


            button.appendChild(
                avatarWrap
            );


            button.appendChild(
                info
            );


            button.onclick =
                () => {

                    openConversation(
                        user
                    );

                };


            container.appendChild(
                button
            );

        }
    );

}


/* ==========================================
   البحث
========================================== */

function filterUsers() {

    const input =
        document.getElementById(
            "searchInput"
        );


    const search =
        input.value
            .trim()
            .toLowerCase();


    if (!search) {

        renderUsers(
            userResults.length
                ? userResults
                : allUsers.map(
                    user => ({

                        user,

                        lastMessage: null,

                        conversationId: null,

                        unreadCount: 0

                    })
                )
        );

        return;

    }


    const filtered =
        userResults.filter(
            item => {

                const name =
                    (
                        item.user.display_name ||
                        ""
                    ).toLowerCase();


                return name.includes(
                    search
                );

            }
        );


    renderUsers(
        filtered
    );

}


document
    .getElementById(
        "searchInput"
    )
    .addEventListener(
        "input",
        filterUsers
    );


/* ==========================================
   فتح المحادثة
========================================== */

async function openConversation(
    user
) {

    selectedUser =
        user;


    const name =
        user.display_name ||
        "مستخدم";


    document.getElementById(
        "chatTitle"
    ).textContent =
        name;


    document.getElementById(
        "chatAvatar"
    ).textContent =
        name
            .charAt(0)
            .toUpperCase();


    document.getElementById(
        "chatStatus"
    ).textContent =
        "متاح للدردشة";


    document.getElementById(
        "chatScreen"
    ).classList.add(
        "show"
    );


    document.body.classList.add(
        "chat-open"
    );


    const {
        data,
        error
    } =
        await supabaseClient
            .from("conversations")
            .select("*")
            .or(
                `and(user1_id.eq.${currentUser.id},user2_id.eq.${user.id}),and(user1_id.eq.${user.id},user2_id.eq.${currentUser.id})`
            )
            .maybeSingle();


    if (error) {

        console.error(
            "Conversation error:",
            error
        );

        return;

    }


    if (data) {

        currentConversation =
            data;

    }

    else {

        const {
            data: newConversation,
            error: createError
        } =
            await supabaseClient
                .from("conversations")
                .insert({

                    user1_id:
                        currentUser.id,

                    user2_id:
                        user.id

                })
                .select()
                .single();


        if (createError) {

            console.error(
                "Create conversation error:",
                createError
            );

            return;

        }


        currentConversation =
            newConversation;

    }


    setUnreadCount(
        user.id,
        0
    );


    await loadMessages();

    await markCurrentConversationRead();

    subscribeToMessages();

    subscribeToTyping();

}


/* ==========================================
   🔴 تصفير عداد مستخدم
========================================== */

function setUnreadCount(
    userId,
    count
) {

    const index =
        userResults.findIndex(
            item =>
                item.user.id ===
                userId
        );


    if (index === -1)
        return;


    userResults[index].unreadCount =
        count;


    const searchInput =
        document.getElementById(
            "searchInput"
        );


    if (
        searchInput &&
        !searchInput.value.trim()
    ) {

        renderUsers(
            userResults
        );

    }

}


/* ==========================================
   🔴 زيادة العداد
========================================== */

function increaseUnreadCount(
    userId
) {

    const index =
        userResults.findIndex(
            item =>
                item.user.id ===
                userId
        );


    if (index === -1)
        return;


    userResults[index].unreadCount =
        (
            userResults[index].unreadCount ||
            0
        ) + 1;


    const searchInput =
        document.getElementById(
            "searchInput"
        );


    if (
        searchInput &&
        !searchInput.value.trim()
    ) {

        renderUsers(
            userResults
        );

    }

}


/* ==========================================
   وضع المحادثة الحالية كمقروءة
========================================== */

async function markCurrentConversationRead() {

    if (!currentConversation)
        return;


    const {
        data,
        error
    } =
        await supabaseClient
            .from("messages")
            .select("created_at")
            .eq(
                "conversation_id",
                currentConversation.id
            )
            .order(
                "created_at",
                {
                    ascending: false
                }
            )
            .limit(1);


    if (
        !error &&
        data &&
        data.length > 0
    ) {

        markConversationAsRead(
            currentConversation.id,
            data[0].created_at
        );

    }


    if (selectedUser) {

        setUnreadCount(
            selectedUser.id,
            0
        );

    }

}

========================================== */

function closeChat() {

        )

    } =

/* ==========================================
   عرض رسالة
========================================== */

function displayMessage(
    message,
    scroll = true
) {

    const container =
        document.getElementById(
            "messages"
        );


    const empty =
        container.querySelector(
            ".empty"
        );


    if (empty) {
        empty.remove();
    }


    if (
        message.id &&
        container.querySelector(
            `[data-message-id="${message.id}"]`
        )
    ) {

        return;

    }


    const div =
        document.createElement(
            "div"
        );


    div.className =
        "message";


    if (
        message.sender_id ===
        currentUser.id
    ) {

        div.classList.add(
            "mine"
        );

    }

    else {

        div.classList.add(
            "theirs"
        );

    }


    if (message.id) {

        div.dataset.messageId =
            message.id;

    }


    div.textContent =
        message.message;


    const time =
        document.createElement(
            "span"
        );


    time.className =
        "message-time";


    time.textContent =
        formatTime(
            message.created_at
        );


    div.appendChild(
        time
    );


    container.appendChild(
        div
    );


    if (scroll) {

        scrollMessagesToBottom();

    }

}


/* ==========================================
   إرسال رسالة
========================================== */

async function sendMessage() {

    if (!currentConversation) {

        alert(
            "اختر مستخدمًا أولًا"
        );

        return;

    }


    const input =
        document.getElementById(
            "messageInput"
        );


    const sendButton =
        document.getElementById(
            "sendButton"
        );


    const text =
        input.value.trim();


    if (!text)
        return;


    const messageText =
        text;


    sendButton.classList.add(
        "sending"
    );


    const {
        data,
        error
    } =
        await supabaseClient
            .from("messages")
            .insert({

                conversation_id:
                    currentConversation.id,

                sender_id:
                    currentUser.id,

                message:
                    messageText

            })
            .select()
            .single();


    sendButton.classList.remove(
        "sending"
    );


    if (error) {

        console.error(
            "Send message error:",
            error
        );


        alert(
            "حدث خطأ أثناء إرسال الرسالة:\n" +
            error.message
        );

        return;

    }


    input.value =
        "";


    if (data) {

        displayMessage(
            data,
            true
        );

    }


    updateLastMessageLocally(
        selectedUser,
        data || {

            message:
                messageText,

            created_at:
                new Date().toISOString()

        }
    );


    if (data) {

        markConversationAsRead(
            currentConversation.id,
            data.created_at
        );

    }


    input.focus();

}


/* ==========================================
   تحديث آخر رسالة مباشرة
========================================== */

function updateLastMessageLocally(
    user,
    message
) {

    if (!user)
        return;


    const index =
        userResults.findIndex(
            item =>
                item.user.id ===
                user.id
        );


    if (index === -1)
        return;


    userResults[index].lastMessage =
        message;


    userResults[index].conversationId =
        currentConversation
            ? currentConversation.id
            : userResults[index].conversationId;


    const item =
        userResults.splice(
            index,
            1
        )[0];


    userResults.unshift(
        item
    );


    const searchInput =
        document.getElementById(
            "searchInput"
        );


    if (
        !searchInput.value.trim()
    ) {

        renderUsers(
            userResults
        );

    }

}

document

            if (

/* ==========================================
   Realtime الرسائل داخل المحادثة
========================================== */

function subscribeToMessages() {

    if (!currentConversation)
        return;


    if (realtimeChannel) {

        supabaseClient.removeChannel(
            realtimeChannel
        );

    }


    realtimeChannel =
        supabaseClient
            .channel(
                "chat-" +
                currentConversation.id +
                "-" +
                Date.now()
            )
            .on(

                "postgres_changes",

                {

                    event:
                        "INSERT",

                    schema:
                        "public",

                    table:
                        "messages",

                    filter:
                        "conversation_id=eq." +
                        currentConversation.id

                },

                payload => {

                    if (
                        payload.new.sender_id !==
                        currentUser.id
                    ) {

                        displayMessage(
                            payload.new,
                            true
                        );


                        updateConversationFromRealtime(
                            payload.new
                        );


                        markConversationAsRead(
                            currentConversation.id,
                            payload.new.created_at
                        );


                        if (selectedUser) {

                            setUnreadCount(
                                selectedUser.id,
                                0
                            );

                        }

                    }

                }

            )
            .subscribe(
                status => {

                    console.log(
                        "Chat realtime:",
                        status
                    );

                }
            );

}


/* ==========================================
   تحديث القائمة من Realtime
========================================== */

async function updateConversationFromRealtime(
    message
) {

    if (!selectedUser)
        return;


    updateLastMessageLocally(
        selectedUser,
        message
    );

}


/* ==========================================
   🔴 Realtime لكل الرسائل
========================================== */

function subscribeToAllMessages() {

    if (allMessagesChannel) {

        supabaseClient.removeChannel(
            allMessagesChannel
        );

    }


    allMessagesChannel =
        supabaseClient
            .channel(
                "all-messages-" +
                currentUser.id +
                "-" +
                Date.now()
            )
            .on(

                "postgres_changes",

                {

                    event:
                        "INSERT",

                    schema:
                        "public",

                    table:
                        "messages"

                },

                async payload => {

                    const message =
                        payload.new;


                    /*
                       تجاهل رسائلنا
                    */

                    if (
                        message.sender_id ===
                        currentUser.id
                    ) {

                        return;

                    }


                    const sender =
                        await getUserProfile(
                            message.sender_id
                        );


                    if (!sender)
                        return;


                    /*
                       إذا الرسالة داخل
                       المحادثة المفتوحة حاليًا
                    */

                    if (
                        selectedUser &&
                        currentConversation &&
                        message.conversation_id ===
                        currentConversation.id
                    ) {

                        return;

                    }


                    /*
                       🔴 زيادة العداد
                    */

                    increaseUnreadCount(
                        sender.id
                    );


                    /*
                       🔔 إشعار داخل الموقع
                       من notifications.js
                    */

                    if (
                        typeof showMessageNotification ===
                        "function"
                    ) {

                        showMessageNotification(
                            sender,
                            message.message
                        );

                    }


                    /*
                       🔔 إشعار المتصفح
                       من notifications.js
                    */

                    if (
                        typeof sendBrowserNotification ===
                        "function"
                    ) {

                        sendBrowserNotification(
                            sender.display_name ||
                            "مستخدم",
                            message.message
                        );

                    }


                    /*
                       تحديث آخر رسالة
                    */

                    const existingIndex =
                        userResults.findIndex(
                            item =>
                                item.user.id ===
                                sender.id
                        );


                    if (
                        existingIndex !== -1
                    ) {

                        userResults[
                            existingIndex
                        ].lastMessage =
                            message;


                        userResults[
                            existingIndex
                        ].conversationId =
                            message.conversation_id;


                        const item =
                            userResults.splice(
                                existingIndex,
                                1
                            )[0];


                        userResults.unshift(
                            item
                        );


                        const searchInput =
                            document.getElementById(
                                "searchInput"
                            );


                        if (
                            !searchInput.value.trim()
                        ) {

                            renderUsers(
                                userResults
                            );

                        }

                    }

                    else {

                        await loadUsers();

                    }

                }

            )
            .subscribe(
                status => {

                    console.log(
                        "All messages realtime:",
                        status
                    );

                }
            );

}


/* ==========================================
   جلب بيانات المستخدم
========================================== */

async function getUserProfile(
    userId
) {

    const localUser =
        allUsers.find(
            user =>
                user.id === userId
        );


    if (localUser) {

        return localUser;

    }


    const {
        data,
        error
    } =
        await supabaseClient
            .from("profiles")
            .select(
                "id, display_name, is_public"
            )
            .eq(
                "id",
                userId
            )
            .maybeSingle();


    if (error) {

        console.error(
            "Profile notification error:",
            error
        );

        return null;

    }


    return data;

}

function subscribeToTyping() {

                            );

/* ==========================================
   استقبال المكالمات
========================================== */

function subscribeToCalls() {

    if (callsChannel) {

        supabaseClient.removeChannel(
            callsChannel
        );

    }


    callsChannel =
        supabaseClient
            .channel(
                "calls-" +
                currentUser.id
            )
            .on(

                "postgres_changes",

                {

                    event:
                        "INSERT",

                    schema:
                        "public",

                    table:
                        "calls"

                },

                async payload => {

                        payload.new;

                    ) {

                        "ringing"
                    ) {

                    await showIncomingCall(
                        call
                    );

                }

            )
            .subscribe();

}


/* ==========================================
   عرض المكالمة
========================================== */

async function showIncomingCall(
    call
) {

    let callerName =
        "مستخدم";


    const {
        data,
        error
    } =
        await supabaseClient
            .from("profiles")
            .select(
                "display_name"
            )
            .eq(
                "id",
                call.caller_id
            )
            .maybeSingle();


    if (
        !error &&
        data
    ) {

        callerName =
            data.display_name ||
            "مستخدم";

    }


    document.getElementById(
        "callerName"
    ).textContent =
        callerName +
        " يتصل بك";


    document.getElementById(
        "callAvatar"
    ).textContent =
        callerName
            .charAt(0)
            .toUpperCase();


    document.getElementById(
        "callOverlay"
    ).style.display =
        "flex";

}


/* ==========================================
   قبول المكالمة
========================================== */

async function acceptCall() {

    if (!incomingCall)
        return;


    const {
        error
    } =
        await supabaseClient
            .from("calls")
            .update({

                status:
                    "accepted"

            })
            .eq(
                "id",
                incomingCall.id
            );


    if (error) {

        console.error(
            error
        );


        alert(
            "❌ حدث خطأ أثناء قبول المكالمة"
        );

        return;

    }


    document.getElementById(
        "callOverlay"
    ).style.display =
        "none";


    alert(
        "✅ تم قبول المكالمة.\n\nالصوت بين الطرفين نضيفه في الخطوة التالية."
    );


    incomingCall =
        null;

}


/* ==========================================
   رفض المكالمة
========================================== */

async function rejectCall() {

    if (!incomingCall)
        return;


    const {
        error
    } =
        await supabaseClient
            .from("calls")
            .update({

                status:
                    "rejected"

            })
            .eq(
                "id",
                incomingCall.id
            );


    if (error) {

        console.error(
            error
        );

        return;

    }


    document.getElementById(
        "callOverlay"
    ).style.display =
        "none";


    incomingCall =
        null;

}


/* ==========================================
   تنظيف Realtime
========================================== */

window.addEventListener(
    "beforeunload",
    () => {

        if (realtimeChannel) {

            supabaseClient.removeChannel(
                realtimeChannel
            );

        }


        if (typingChannel) {

            supabaseClient.removeChannel(
                typingChannel
            );

        }


        if (callsChannel) {

            supabaseClient.removeChannel(
                callsChannel
            );

        }


        if (allMessagesChannel) {

            supabaseClient.removeChannel(
                allMessagesChannel
            );

        }

    }
);


/* ==========================================
   تشغيل الصفحة
========================================== */

loadCurrentUser();

</script>
<script>
startPresence("chat");
</script>
