<html lang="ar" dir="rtl">

     crossorigin="anonymous"></script>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>تسجيل الدخول | English Words</title>

    <link rel="stylesheet" href="auth.css?v=20260905-1">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="supabase.js"></script>

</head>


<body>

    <main class="auth-container">

        <section class="auth-card">

            <div class="logo">
                E
            </div>


            <h1>مرحبًا بعودتك 👋</h1>

            <p class="subtitle">
                سجّل دخولك لمتابعة تعلمك
            </p>


            <!-- البريد -->

            <div class="form-group">

                <label for="email">
                    البريد الإلكتروني
                </label>

                <div class="input-box">

                    <span class="input-icon">
                        ✉
                    </span>

                    <input
                        type="email"
                        id="email"
                        placeholder="example@email.com"
                        autocomplete="email"
                    >

                </div>

            </div>


            <!-- كلمة المرور -->

            <div class="form-group">

                <label for="password">
                    كلمة المرور
                </label>

                <div class="input-box">

                    <span class="input-icon">
                        🔒
                    </span>

                    <input
                        type="password"
                        id="password"
                        placeholder="••••••••"
                        autocomplete="current-password"
                    >

                    <button
                        type="button"
                        class="password-toggle"
                        onclick="togglePassword()">

                        👁

                    </button>

                </div>

            </div>


            <!-- تسجيل الدخول بالبريد -->

            <button
                class="main-btn"
                onclick="login()">

                تسجيل الدخول ←

            </button>


            <!-- تسجيل الدخول باستخدام Google -->

            <button
                type="button"
                class="google-btn"
                onclick="loginWithGoogle()">

                <span class="google-icon">
                    G
                </span>

                تسجيل الدخول باستخدام Google

            </button>

            <div class="auth-divider"><span>أو</span></div>

            <button
                type="button"
                class="guest-btn"
                id="guestBtn"
                onclick="loginAsGuest()">

                <span class="guest-icon">👤</span>
                <span class="guest-copy"><b>الدخول كضيف</b><small>جرّب الموقع الآن بدون إنشاء حساب</small></span>
                <span class="guest-arrow">←</span>

            </button>


            <!-- الرسائل -->

            <p
                id="message"
                class="message">
            </p>


            <p class="bottom-text">

                ما عندك حساب؟

                <a href="register.html">
                    إنشاء حساب
                </a>

            </p>


            <a
                href="index.html"
                class="back-home">

                ← العودة للرئيسية

            </a>

        </section>

    </main>


    <script>

        // ==========================================
        // إظهار / إخفاء كلمة المرور
        // ==========================================

        function togglePassword() {

            const password =
                document.getElementById("password");

            const button =
                document.querySelector(".password-toggle");


            if (password.type === "password") {

                password.type = "text";

                button.textContent = "🙈";

            } else {

                password.type = "password";

                button.textContent = "👁";

            }

        }


        // ==========================================
        // تسجيل الدخول بالبريد وكلمة المرور
        // ==========================================

        async function login() {

            const email =
                document.getElementById("email")
                .value
                .trim();

            const password =
                document.getElementById("password")
                .value;

            const message =
                document.getElementById("message");


            message.textContent = "";


            if (!email || !password) {

                message.textContent =
                    "⚠️ اكتب البريد وكلمة المرور.";

                return;
            }


            const { data, error } =
                await supabaseClient.auth
                .signInWithPassword({

                    email: email,

                    password: password

                });


            if (error) {

                message.textContent =
                    "❌ " + error.message;

                return;
            }


            message.style.color =
                "#72e6a5";


            message.textContent =
                "✅ تم تسجيل الدخول!";


            setTimeout(() => {

                window.location.href =
                    "index.html";

            }, 700);

        }


        // ==========================================
        // تسجيل الدخول باستخدام Google
        // ==========================================

        async function loginWithGoogle() {

            const message =
                document.getElementById("message");


            message.textContent = "";


            const { error } =
                await supabaseClient.auth
                .signInWithOAuth({

                    provider: "google",

                    options: {

                        redirectTo:
                            "https://learn-english-words.github.io/english.site/index.html"

                    }

                });


            if (error) {

                message.style.color =
                    "#ff6b7a";

                message.textContent =
                    "❌ " + error.message;

            }

        }


        // ==========================================
        // الدخول بحساب ضيف مؤقت
        // ==========================================

        async function loginAsGuest() {

            const message = document.getElementById("message");
            const button = document.getElementById("guestBtn");

            message.textContent = "";
            button.disabled = true;
            button.classList.add("loading");
            button.querySelector(".guest-copy b").textContent = "جاري تجهيز حساب الضيف...";

            sessionStorage.setItem("englishwords_guest", "true");
            sessionStorage.setItem("englishwords_guest_name", "ضيف");

            try {
                await Promise.race([
                    supabaseClient.auth.signInAnonymously({
                        options: {
                            data: {
                                name: "Guest",
                                is_guest: true
                            }
                        }
                    }),
                    new Promise(resolve => setTimeout(resolve, 1200))
                ]);
            } catch (error) {
                console.warn("Guest session will continue locally:", error);
            }

            window.location.replace("index.html");
        }

    </script>

</body>

</html>
