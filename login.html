
<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>تسجيل الدخول | English Words</title>

    <link rel="stylesheet" href="auth.css">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="supabase.js"></script>

</head>

<script>
    // تسجيل زيارة الموقع
    async function trackVisit() {

        let visitorId = localStorage.getItem("visitor_id");

        // إنشاء رقم خاص للزائر لأول مرة
        if (!visitorId) {

            visitorId = crypto.randomUUID();

            localStorage.setItem(
                "visitor_id",
                visitorId
            );
        }


        // معرفة هل الزائر مسجل دخول
        const {
            data: { user }
        } = await supabaseClient.auth.getUser();


        // تسجيل الزيارة
        const { error } =
            await supabaseClient
                .from("visits")
                .insert({

                    visitor_id: visitorId,

                    user_id: user
                        ? user.id
                        : null

                });


        if (error) {

            console.error(
                "خطأ تسجيل الزيارة:",
                error
            );

        } else {

            console.log(
                "✅ تم تسجيل الزيارة"
            );

        }
    }


    // تشغيل تسجيل الزيارة
    trackVisit();

</script>
<body>

    <main class="auth-container">

        <section class="auth-card">

            <div class="logo">
                E
            </div>


            <h1>مرحبًا بعودتك 👋</h1>

            <p class="subtitle">
                سجّل دخولك لمتابعة تعلمك
            </p>


            <!-- البريد -->

            <div class="form-group">

                <label for="email">
                    البريد الإلكتروني
                </label>

                <div class="input-box">

                    <span class="input-icon">
                        ✉
                    </span>

                    <input
                        type="email"
                        id="email"
                        placeholder="example@email.com"
                        autocomplete="email"
                    >

                </div>

            </div>


            <!-- كلمة المرور -->

            <div class="form-group">

                <label for="password">
                    كلمة المرور
                </label>

                <div class="input-box">

                    <span class="input-icon">
                        🔒
                    </span>

                    <input
                        type="password"
                        id="password"
                        placeholder="••••••••"
                        autocomplete="current-password"
                    >

                    <button
                        type="button"
                        class="password-toggle"
                        onclick="togglePassword()">

                        👁

                    </button>

                </div>

            </div>


            <button
                class="main-btn"
                onclick="login()">

                تسجيل الدخول ←

            </button>


            <p
                id="message"
                class="message">
            </p>


            <p class="bottom-text">

                ما عندك حساب؟

                <a href="register.html">
                    إنشاء حساب
                </a>

            </p>


            <a
                href="index.html"
                class="back-home">

                ← العودة للرئيسية

            </a>

        </section>

    </main>


    <script>

        // إظهار / إخفاء كلمة المرور

        function togglePassword() {

            const password =
                document.getElementById("password");

            const button =
                document.querySelector(".password-toggle");


            if (password.type === "password") {

                password.type = "text";

                button.textContent = "🙈";

            } else {

                password.type = "password";

                button.textContent = "👁";

            }

        }


        // تسجيل الدخول

        async function login() {

            const email =
                document.getElementById("email")
                .value
                .trim();

            const password =
                document.getElementById("password")
                .value;

            const message =
                document.getElementById("message");


            message.textContent = "";


            if (!email || !password) {

                message.textContent =
                    "⚠️ اكتب البريد وكلمة المرور.";

                return;
            }


            const { data, error } =
                await supabaseClient.auth
                .signInWithPassword({

                    email: email,

                    password: password

                });


            if (error) {

                message.textContent =
                    "❌ " + error.message;

                return;
            }


            message.style.color = "#72e6a5";

            message.textContent =
                "✅ تم تسجيل الدخول!";


            setTimeout(() => {

                window.location.href =
                    "index.html";

            }, 700);

        }

    </script>

</body>

</html>
