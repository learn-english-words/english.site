
<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>إنشاء حساب | English Words</title>

    <link rel="stylesheet" href="auth.css">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="supabase.js"></script>

</head>


<body>

    <main class="auth-container">

        <section class="auth-card">

            <div class="logo">
                E
            </div>


            <h1>إنشاء حساب جديد ✨</h1>

            <p class="subtitle">
                أنشئ حسابك وابدأ رحلة تعلم الإنجليزية
            </p>


            <!-- الاسم -->

            <div class="form-group">

                <label for="name">
                    الاسم الكامل
                </label>

                <div class="input-box">

                    <span class="input-icon">
                        👤
                    </span>

                    <input
                        type="text"
                        id="name"
                        placeholder="أدخل اسمك"
                        autocomplete="name"
                    >

                </div>

            </div>


            <!-- البريد -->

            <div class="form-group">

                <label for="email">
                    البريد الإلكتروني
                </label>

                <div class="input-box">

                    <span class="input-icon">
                        ✉
                    </span>

                    <input
                        type="email"
                        id="email"
                        placeholder="example@email.com"
                        autocomplete="email"
                    >

                </div>

            </div>


            <!-- كلمة المرور -->

            <div class="form-group">

                <label for="password">
                    كلمة المرور
                </label>

                <div class="input-box">

                    <span class="input-icon">
                        🔒
                    </span>

                    <input
                        type="password"
                        id="password"
                        placeholder="••••••••"
                        autocomplete="new-password"
                    >

                    <button
                        type="button"
                        class="password-toggle"
                        onclick="togglePassword('password', this)">

                        👁

                    </button>

                </div>

            </div>


            <!-- تأكيد كلمة المرور -->

            <div class="form-group">

                <label for="confirmPassword">
                    تأكيد كلمة المرور
                </label>

                <div class="input-box">

                    <span class="input-icon">
                        🔒
                    </span>

                    <input
                        type="password"
                        id="confirmPassword"
                        placeholder="أعد كتابة كلمة المرور"
                        autocomplete="new-password"
                    >

                    <button
                        type="button"
                        class="password-toggle"
                        onclick="togglePassword('confirmPassword', this)">

                        👁

                    </button>

                </div>

            </div>


            <button
                class="main-btn"
                onclick="register()">

                إنشاء الحساب ✨

            </button>


            <p
                id="message"
                class="message">
            </p>


            <p class="bottom-text">

                لديك حساب بالفعل؟

                <a href="login.html">
                    تسجيل الدخول
                </a>

            </p>


            <a
                href="index.html"
                class="back-home">

                ← العودة للرئيسية

            </a>

        </section>

    </main>


    <script>

        // إظهار / إخفاء كلمة المرور

        function togglePassword(id, button) {

            const input =
                document.getElementById(id);


            if (input.type === "password") {

                input.type = "text";

                button.textContent = "🙈";

            } else {

                input.type = "password";

                button.textContent = "👁";

            }

        }


        // إنشاء الحساب

        async function register() {

            const name =
                document.getElementById("name")
                .value
                .trim();

            const email =
                document.getElementById("email")
                .value
                .trim();

            const password =
                document.getElementById("password")
                .value;

            const confirmPassword =
                document.getElementById("confirmPassword")
                .value;

            const message =
                document.getElementById("message");


            message.textContent = "";


            if (!name || !email || !password || !confirmPassword) {

                message.textContent =
                    "⚠️ املأ جميع البيانات.";

                return;
            }


            if (password.length < 6) {

                message.textContent =
                    "⚠️ كلمة المرور يجب أن تكون 6 أحرف على الأقل.";

                return;
            }


            if (password !== confirmPassword) {

                message.textContent =
                    "⚠️ كلمتا المرور غير متطابقتين.";

                return;
            }


            const { data, error } =
                await supabaseClient.auth.signUp({

                    email: email,

                    password: password,

                    options: {

                        data: {

                            name: name

                        }

                    }

                });


            if (error) {

                message.textContent =
                    "❌ " + error.message;

                return;
            }


            message.style.color = "#72e6a5";

            message.textContent =
                "✅ تم إنشاء الحساب بنجاح!";


            setTimeout(() => {

                window.location.href =
                    "index.html";

            }, 1000);

        }

    </script>



<script src="supabase.js"></script>
    <script src="notifications.js"></script>


</body>

</html>
