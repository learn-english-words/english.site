<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <script async
        src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3809987460267480"
        crossorigin="anonymous">
    </script>

    <meta
        name="google-adsense-account"
        content="ca-pub-3809987460267480"
    >

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>تعلم الكلمات</title>

    <link
        rel="stylesheet"
        href="words.css"
    >

    <style>

        /* ==========================================
           زر إظهار / إخفاء الترجمة
        ========================================== */

        .translation-toggle {

            display: inline-flex;

            align-items: center;

            justify-content: center;

            gap: 8px;

            margin-top: 10px;

            padding: 10px 18px;

            border: none;

            border-radius: 12px;

            background: #f1f4f9;

            color: #333;

            font-size: 15px;

            font-weight: 600;

            cursor: pointer;

            transition: 0.2s;

        }


        .translation-toggle:hover {

            transform: translateY(-1px);

            background: #e7ebf2;

        }


        .translation-toggle:active {

            transform: scale(0.98);

        }


        /* الترجمة مخفية افتراضيًا */

        .arabic-word.hidden-translation {

            display: none;

        }

    </style>

</head>


<body>


    <!-- ==========================================
         الشريط العلوي
    ========================================== -->

    <header class="topbar">

        <button
            class="back-btn"
            onclick="goBack()"
        >
            ← رجوع
        </button>


        <div class="title">
            📚 تعلم الكلمات
        </div>


        <button
            class="home-btn"
            onclick="goHome()"
        >
            🏠
        </button>

    </header>



    <!-- ==========================================
         المحتوى
    ========================================== -->

    <main class="container">


        <!-- ==========================================
             التقدم
        ========================================== -->

        <div class="progress-area">

            <div class="progress-info">

                <span>
                    تقدمك
                </span>

                <strong id="progressText">
                    1 / 10
                </strong>

            </div>


            <div class="progress-bar">

                <div id="progressFill"></div>

            </div>

        </div>



        <!-- ==========================================
             بطاقة الكلمة
        ========================================== -->

        <section class="word-card">


            <!-- الصورة -->

            <div class="image-container">

                <div
                    id="wordEmoji"
                    class="word-image"
                >
                    🍎
                </div>

            </div>



            <!-- محتوى الكلمة -->

            <div class="word-content">


                <!-- الإنجليزية -->

                <div
                    class="english-word"
                    id="englishWord"
                >
                    Apple
                </div>



                <!-- العربية -->

                <div
                    class="arabic-word hidden-translation"
                    id="arabicWord"
                >
                    تفاحة
                </div>



                <!-- زر إظهار الترجمة -->

                <button
                    type="button"
                    id="translationToggle"
                    class="translation-toggle"
                    onclick="toggleTranslation()"
                >
                    👁️ إظهار الترجمة
                </button>



                <!-- نطق الكلمة -->

                <button
                    type="button"
                    class="sound-btn"
                    onclick="speakWord()"
                >
                    🔊 اسمع الكلمة
                </button>



                <!-- ======================================
                     المثال
                ======================================= -->

                <div class="example">


                    <span>
                        💡 مثال
                    </span>


                    <p id="exampleText">
                        I eat an apple.
                    </p>


                    <small id="exampleArabic">
                        أنا آكل تفاحة.
                    </small>



                    <!-- أزرار نطق الجملة -->

                    <div class="example-sound-buttons">


                        <button
                            type="button"
                            class="example-sound-btn"
                            onclick="speakExample()"
                        >
                            🔊 اسمع الجملة
                        </button>


                        <button
                            type="button"
                            class="example-sound-btn"
                            onclick="speakExampleSlow()"
                        >
                            🐢 نطق بطيء
                        </button>


                    </div>


                </div>


            </div>


        </section>



        <!-- ==========================================
             أزرار المعرفة
        ========================================== -->

        <div class="knowledge-buttons">


            <button
                class="dont-know"
                onclick="answer(false)"
            >
                ❌ لا أعرفها
            </button>


            <button
                class="know"
                onclick="answer(true)"
            >
                ✅ أعرفها
            </button>


        </div>



        <!-- ==========================================
             الإجراءات
        ========================================== -->

        <div class="actions">


            <button
                id="favoriteBtn"
                onclick="toggleFavorite()"
            >
                ☆

                <span>
                    حفظ
                </span>

            </button>


            <button
                class="next-btn"
                onclick="nextWord()"
            >
                الكلمة التالية
                ←
            </button>


        </div>


    </main>



    <!-- Supabase -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


    <script src="supabase.js"></script>

    <script src="words.js"></script>

    <script src="notifications.js"></script>



    <!-- ==========================================
         إظهار / إخفاء الترجمة
    ========================================== -->

    <script>

        function toggleTranslation() {

            const arabicWord =
                document.getElementById("arabicWord");

            const toggleButton =
                document.getElementById("translationToggle");


            if (!arabicWord || !toggleButton) {

                return;

            }


            const isHidden =
                arabicWord.classList.contains("hidden-translation");


            if (isHidden) {

                arabicWord.classList.remove(
                    "hidden-translation"
                );

                toggleButton.innerHTML =
                    "🙈 إخفاء الترجمة";

            } else {

                arabicWord.classList.add(
                    "hidden-translation"
                );

                toggleButton.innerHTML =
                    "👁️ إظهار الترجمة";

            }

        }



        /* ==========================================
           إعادة إخفاء الترجمة
           عند تغيير الكلمة
        ========================================== */

        function resetTranslationVisibility() {

            const arabicWord =
                document.getElementById("arabicWord");

            const toggleButton =
                document.getElementById("translationToggle");


            if (arabicWord) {

                arabicWord.classList.add(
                    "hidden-translation"
                );

            }


            if (toggleButton) {

                toggleButton.innerHTML =
                    "👁️ إظهار الترجمة";

            }

        }


        /* ==========================================
           مراقبة تغيّر الكلمة
           بدون الحاجة لتعديل words.js
        ========================================== */

        document.addEventListener(
            "DOMContentLoaded",
            function () {

                resetTranslationVisibility();


                const arabicWord =
                    document.getElementById("arabicWord");


                if (!arabicWord) {

                    return;

                }


                const observer =
                    new MutationObserver(function () {

                        resetTranslationVisibility();

                    });


                observer.observe(
                    arabicWord,
                    {
                        childList: true,
                        characterData: true,
                        subtree: true
                    }
                );

            }
        );

    </script>


</body>

</html>
