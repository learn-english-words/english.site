<!DOCTYPE html>

<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
   content="width=device-width, initial-scale=1.0">

<title>Story - EnglishWords</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase.js"></script>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #f8f9fc;
    color: #171827;
    font-family: Arial, Tahoma, sans-serif;
}

button {
    font-family: inherit;
}

.story-page {
    width: 100%;
    max-width: 650px;
    min-height: 100vh;
    margin: auto;
    padding: 18px 16px 50px;
}

.story-header {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 18px;
}

.back-button {
    width: 44px;
    height: 44px;
    border: none;
    border-radius: 50%;
    background: white;
    box-shadow: 0 3px 12px rgba(0,0,0,.07);
    font-size: 22px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
}

.header-title {
    flex: 1;
}

.header-title h1 {
    margin: 0 0 4px;
    font-size: 22px;
}

.header-title p {
    margin: 0;
    color: #888;
    font-size: 12px;
}

.story-hero {
    background: linear-gradient(135deg,#6254eb,#8374ed);
    color: white;
    border-radius: 25px;
    padding: 23px;
    position: relative;
    overflow: hidden;
    margin-bottom: 18px;
    box-shadow: 0 10px 25px rgba(98,84,235,.20);
}

.story-hero-icon {
    font-size: 58px;
    margin-bottom: 8px;
}

.story-hero h2 {
    margin: 0 0 9px;
    font-size: 25px;
}

.story-hero p {
    margin: 0;
    opacity: .9;
    font-size: 13px;
    line-height: 1.7;
}

.story-meta {
    display: flex;
    gap: 8px;
    margin-top: 15px;
}

.meta-item {
    background: rgba(255,255,255,.18);
    padding: 6px 10px;
    border-radius: 20px;
    font-size: 11px;
}

.reading-tools {
    display: flex;
    gap: 9px;
    margin-bottom: 18px;
}

.tool-button {
    flex: 1;
    border: none;
    background: white;
    color: #5c51dc;
    padding: 12px 8px;
    border-radius: 14px;
    font-size: 13px;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 3px 12px rgba(0,0,0,.05);
}

.tool-button:active {
    transform: scale(.97);
}

.story-content {
    background: white;
    border-radius: 22px;
    padding: 22px;
    box-shadow: 0 3px 15px rgba(0,0,0,.05);
    margin-bottom: 18px;
}

.story-content h3 {
    margin: 0 0 17px;
    font-size: 18px;
}

.story-text {
    direction: ltr;
    text-align: left;
    font-size: 18px;
    line-height: 2;
    color: #292938;
    white-space: pre-line;
}

.story-text p {
    margin: 0 0 17px;
}

.translation-box {
    display: none;
    background: #f3f1ff;
    border-radius: 15px;
    padding: 15px;
    margin-top: 18px;
    color: #5149a7;
    line-height: 1.8;
    font-size: 14px;
    white-space: pre-line;
}

.translation-box.show {
    display: block;
}

.vocabulary-section {
    margin-bottom: 18px;
}

.vocabulary-section h3 {
    margin: 0 4px 12px;
    font-size: 18px;
}

.vocabulary-list {
    display: grid;
    grid-template-columns: repeat(2,1fr);
    gap: 10px;
}

.vocabulary-card {
    background: white;
    border-radius: 16px;
    padding: 13px;
    box-shadow: 0 3px 12px rgba(0,0,0,.04);
}

.vocabulary-card strong {
    display: block;
    direction: ltr;
    text-align: left;
    color: #5c51dc;
    font-size: 15px;
    margin-bottom: 5px;
}

.vocabulary-card span {
    color: #777;
    font-size: 12px;
}

.quiz-section {
    background: white;
    border-radius: 22px;
    padding: 20px;
    box-shadow: 0 3px 15px rgba(0,0,0,.05);
    margin-bottom: 18px;
}

.quiz-section h3 {
    margin: 0 0 17px;
    font-size: 18px;
}

.question {
    margin-bottom: 20px;
}

.question:last-child {
    margin-bottom: 0;
}

.question-text {
    font-weight: bold;
    margin-bottom: 10px;
    line-height: 1.6;
}

.answers {
    display: flex;
    flex-direction: column;
    gap: 8px;
}

.answer {
    width: 100%;
    border: 1px solid #e5e5ed;
    background: #fafafd;
    border-radius: 12px;
    padding: 11px;
    text-align: right;
    cursor: pointer;
    font-size: 13px;
    transition: .15s;
}

.answer:hover {
    border-color: #7669f3;
}

.answer.selected {
    background: #eeeaff;
    border-color: #7669f3;
    color: #5149c8;
    font-weight: bold;
}

.answer.correct {
    background: #e4f9ef;
    border-color: #4ac58a;
    color: #20855a;
}

.answer.wrong {
    background: #fff0f3;
    border-color: #ef7187;
    color: #c83e57;
}

.check-button {
    width: 100%;
    border: none;
    border-radius: 15px;
    padding: 14px;
    background: linear-gradient(135deg,#6254eb,#8374ed);
    color: white;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
    margin-top: 20px;
}

.result-box {
    display: none;
    text-align: center;
    margin-top: 17px;
    background: #f5f4ff;
    border-radius: 15px;
    padding: 17px;
}

.result-box.show {
    display: block;
}

.result-number {
    font-size: 28px;
    font-weight: bold;
    color: #5c51dc;
    margin-bottom: 6px;
}

.result-text {
    color: #666;
    font-size: 13px;
}

.loading {
    background: white;
    border-radius: 20px;
    padding: 30px;
    text-align: center;
    color: #777;
}

.error-box {
    background: #fff0f3;
    color: #c83e57;
    border-radius: 18px;
    padding: 20px;
    text-align: center;
    line-height: 1.7;
}

.empty-box {
    background: white;
    border-radius: 18px;
    padding: 25px;
    text-align: center;
    color: #888;
}

@media (max-width:420px) {

    .story-page {
        padding-left:14px;
        padding-right:14px;
    }

    .story-hero {
        padding:20px;
    }

    .story-hero h2 {
        font-size:22px;
    }

    .story-content {
        padding:18px;
    }

    .story-text {
        font-size:17px;
        line-height:1.9;
    }

    .vocabulary-list {
        grid-template-columns:repeat(2,1fr);
    }

}

</style>

</head>

<script>

/* ==================================================
   رقم القصة من الرابط
================================================== */

const urlParams =
    new URLSearchParams(window.location.search);

const storyId =
    urlParams.get("id");


/* ==================================================
   التأكد من وجود رقم القصة
================================================== */

if (!storyId) {

    document.getElementById("storyTitle").textContent =
        "لم يتم تحديد القصة";

}


/* ==================================================
   تحميل القصة
================================================== */

async function loadStory() {

    if (!storyId) return;

    try {

        /*
         * مهم:
         * نستخدم supabaseClient وليس db
         */

        if (
            typeof supabaseClient === "undefined" ||
            !supabaseClient ||
            typeof supabaseClient.from !== "function"
        ) {

            throw new Error(
                "supabaseClient غير موجود. تأكد من ملف supabase.js"
            );

        }


        /* ==========================================
           جلب القصة
        ========================================== */

        const {
            data: story,
            error: storyError
        } = await supabaseClient

            .from("reading_stories")

            .select("*")

            .eq("id", storyId)

            .single();


        if (storyError) {

            throw storyError;

        }


        if (!story) {

            throw new Error(
                "القصة غير موجودة."
            );

        }


        /* ==========================================
           عرض معلومات القصة
        ========================================== */

        document.getElementById(
            "storyTitle"
        ).textContent =
            story.title || "بدون عنوان";


        document.getElementById(
            "storyDescription"
        ).textContent =
            story.description || "";


        document.getElementById(
            "storyIcon"
        ).textContent =
            story.icon || "📖";


        document.getElementById(
            "storyLevel"
        ).textContent =
            story.level || "";


        document.getElementById(
            "storyTime"
        ).textContent =
            "⏱ " +
            (story.reading_time || "بدون وقت");


        /* ==========================================
           نص القصة
        ========================================== */

        const storyText =
            document.getElementById("storyText");


        storyText.textContent =
            story.content || "لا يوجد محتوى للقصة.";


        /* ==========================================
           الترجمة
        ========================================== */

        const translationBox =
            document.getElementById(
                "translationBox"
            );


        translationBox.textContent =
            story.translation ||
            "لا توجد ترجمة لهذه القصة.";


        /* ==========================================
           تحميل الكلمات والأسئلة
        ========================================== */

        await Promise.all([

            loadVocabulary(),

            loadQuestions()

        ]);

    } catch (error) {

        console.error(
            "Story loading error:",
            error
        );


        document.getElementById(
            "storyTitle"
        ).textContent =
            "حدث خطأ أثناء تحميل القصة";


        document.getElementById(
            "storyText"
        ).innerHTML = `

            <div class="error-box">

                تعذر تحميل القصة.

                <br><br>

                ${escapeHtml(
                    error.message ||
                    "خطأ غير معروف"
                )}

            </div>

        `;

    }

}


/* ==================================================
   تحميل الكلمات المهمة
================================================== */

async function loadVocabulary() {

    const list =
        document.getElementById(
            "vocabularyList"
        );


    const {
        data,
        error
    } = await supabaseClient

        .from("reading_vocabulary")

        .select("*")

        .eq("story_id", storyId)

        .order("id", {
            ascending: true
        });


    if (error) {

        console.error(
            "Vocabulary loading error:",
            error
        );


        list.innerHTML = `

            <div class="error-box">

                حدث خطأ أثناء تحميل الكلمات.

                <br>

                ${escapeHtml(error.message)}

            </div>

        `;

        return;

    }


    if (!data || data.length === 0) {

        list.innerHTML = `

            <div class="empty-box">

                لا توجد كلمات مهمة لهذه القصة.

            </div>

        `;

        return;

    }


    list.innerHTML = "";


    data.forEach(word => {

        const card =
            document.createElement("div");


        card.className =
            "vocabulary-card";


        card.innerHTML = `

            <strong>
                ${escapeHtml(
                    word.english || ""
                )}
            </strong>

            <span>
                ${escapeHtml(
                    word.arabic || ""
                )}
            </span>

        `;


        list.appendChild(card);

    });

}


/* ==================================================
   تحميل الأسئلة
================================================== */

let loadedQuestions = [];


async function loadQuestions() {

    const list =
        document.getElementById(
            "questionsList"
        );


    const {
        data,
        error
    } = await supabaseClient

        .from("reading_questions")

        .select("*")

        .eq("story_id", storyId)

        .order("id", {
            ascending: true
        });


    if (error) {

        console.error(
            "Questions loading error:",
            error
        );


        list.innerHTML = `

            <div class="error-box">

                حدث خطأ أثناء تحميل الأسئلة.

                <br>

                ${escapeHtml(error.message)}

            </div>

        `;

        return;

    }


    loadedQuestions =
        data || [];


    if (
        !loadedQuestions.length
    ) {

        list.innerHTML = `

            <div class="empty-box">

                لا توجد أسئلة لهذه القصة.

            </div>

        `;

        return;

    }


    list.innerHTML = "";


    loadedQuestions.forEach(
        (question, index) => {

            const questionBox =
                document.createElement("div");


            questionBox.className =
                "question";


            const questionNumber =
                index + 1;


            questionBox.innerHTML = `

                <div class="question-text">

                    ${questionNumber}.
                    ${escapeHtml(
                        question.question || ""
                    )}

                </div>

                <div class="answers">

                    ${createAnswerButton(
                        question,
                        "option1"
                    )}

                    ${createAnswerButton(
                        question,
                        "option2"
                    )}

                    ${createAnswerButton(
                        question,
                        "option3"
                    )}

                    ${createAnswerButton(
                        question,
                        "option4"
                    )}

                </div>

            `;


            list.appendChild(
                questionBox
            );

        }
    );


    addAnswerListeners();

}


/* ==================================================
   إنشاء زر إجابة
================================================== */

function createAnswerButton(
    question,
    optionName
) {

    const value =
        question[optionName];


    /*
     * إذا كانت الخانة فارغة
     * لا نعرضها
     */

    if (
        value === null ||
        value === undefined ||
        String(value).trim() === ""
    ) {

        return "";

    }


    return `

        <button

            type="button"

            class="answer"

            data-question-id="${escapeHtml(
                question.id
            )}"

            data-option="${escapeHtml(
                optionName
            )}">

            ${escapeHtml(
                String(value)
            )}

        </button>

    `;

}


/* ==================================================
   اختيار الإجابة
================================================== */

function addAnswerListeners() {

    document
        .querySelectorAll(".answer")
        .forEach(button => {

            button.addEventListener(
                "click",
                function() {

                    const questionId =
                        this.dataset.questionId;


                    document
                        .querySelectorAll(
                            `.answer[data-question-id="${questionId}"]`
                        )
                        .forEach(answer => {

                            answer.classList.remove(
                                "selected"
                            );

                        });


                    this.classList.add(
                        "selected"
                    );

                }
            );

        });

}


/* ==================================================
   التحقق من الإجابات
================================================== */

function checkAnswers() {

    if (
        !loadedQuestions.length
    ) {

        alert(
            "لا توجد أسئلة للتحقق منها."
        );

        return;

    }


    let score = 0;

    let answered = 0;


    loadedQuestions.forEach(
        question => {

            const selected =
                document.querySelector(
                    `.answer[data-question-id="${question.id}"].selected`
                );


            const allAnswers =
                document.querySelectorAll(
                    `.answer[data-question-id="${question.id}"]`
                );


            allAnswers.forEach(
                answer => {

                    answer.classList.remove(
                        "correct",
                        "wrong"
                    );

                }
            );


            if (!selected) {

                return;

            }


            answered++;


            /*
             * correct_answer عندك يجب أن يحتوي
             * على رقم الخيار:
             *
             * 1
             * 2
             * 3
             * 4
             *
             * أو option1 / option2...
             */

            const correctValue =
                String(
                    question.correct_answer ?? ""
                ).trim();


            const selectedOption =
                selected.dataset.option;


            const selectedNumber =
                selectedOption.replace(
                    "option",
                    ""
                );


            const isCorrect =
                correctValue ===
                    selectedOption ||

                correctValue ===
                    selectedNumber;


            if (isCorrect) {

                score++;


                selected.classList.add(
                    "correct"
                );

            } else {

                selected.classList.add(
                    "wrong"
                );


                /*
                 * نظهر الإجابة الصحيحة
                 */

                allAnswers.forEach(
                    answer => {

                        const option =
                            answer.dataset.option;


                        const number =
                            option.replace(
                                "option",
                                ""
                            );


                        if (
                            correctValue ===
                                option ||

                            correctValue ===
                                number
                        ) {

                            answer.classList.add(
                                "correct"
                            );

                        }

                    }
                );

            }

        }
    );


    const total =
        loadedQuestions.length;


    document.getElementById(
        "resultNumber"
    ).textContent =
        score + " / " + total;


    let resultText;


    if (score === total) {

        resultText =
            "ممتاز! فهمت القصة بشكل رائع 🎉";

    } else if (
        score >= Math.ceil(total * .7)
    ) {

        resultText =
            "جيد جدًا! استمر 💪";

    } else if (
        score > 0
    ) {

        resultText =
            "جيد، حاول قراءة القصة مرة أخرى 📖";

    } else {

        resultText =
            "اقرأ القصة مرة أخرى وحاول من جديد 🌱";

    }


    if (
        answered < total
    ) {

        resultText +=
            " بعض الأسئلة لم تتم الإجابة عنها.";

    }


    document.getElementById(
        "resultText"
    ).textContent =
        resultText;


    const resultBox =
        document.getElementById(
            "resultBox"
        );


    resultBox.classList.add(
        "show"
    );


    resultBox.scrollIntoView({

        behavior: "smooth",

        block: "center"

    });

}


/* ==================================================
   الترجمة
================================================== */

function toggleTranslation() {

    const box =
        document.getElementById(
            "translationBox"
        );


    box.classList.toggle(
        "show"
    );

}


/* ==================================================
   النطق
================================================== */

function speakStory() {

    if (
        !("speechSynthesis" in window)
    ) {

        alert(
            "المتصفح لا يدعم تشغيل النطق."
        );

        return;

    }


    const text =
        document.getElementById(
            "storyText"
        ).innerText;


    if (!text.trim()) {

        return;

    }


    window.speechSynthesis.cancel();


    const speech =
        new SpeechSynthesisUtterance(
            text
        );


    speech.lang =
        "en-US";


    speech.rate =
        0.85;


    window.speechSynthesis.speak(
        speech
    );

}


/* ==================================================
   حماية النصوص
================================================== */

function escapeHtml(value) {

    return String(value)

        .replaceAll("&", "&amp;")

        .replaceAll("<", "&lt;")

        .replaceAll(">", "&gt;")

        .replaceAll('"', "&quot;")

        .replaceAll("'", "&#039;");

}


/* ==================================================
   تشغيل
================================================== */

loadStory();

</script>

</body>

</html>
