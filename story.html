<!DOCTYPE html>

<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
   content="width=device-width, initial-scale=1.0">

<title>Story - EnglishWords</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #f8f9fc;
    color: #171827;
    font-family: Arial, Tahoma, sans-serif;
}

button {
    font-family: inherit;
}

.story-page {
    width: 100%;
    max-width: 650px;
    min-height: 100vh;
    margin: auto;
    padding: 18px 16px 50px;
}

.story-header {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 18px;
}

.back-button {
    width: 44px;
    height: 44px;
    border: none;
    border-radius: 50%;
    background: white;
    box-shadow: 0 3px 12px rgba(0,0,0,.07);
    font-size: 22px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
}

.header-title {
    flex: 1;
}

.header-title h1 {
    margin: 0 0 4px;
    font-size: 22px;
}

.header-title p {
    margin: 0;
    color: #888;
    font-size: 12px;
}

.story-hero {
    background: linear-gradient(135deg,#6254eb,#8374ed);
    color: white;
    border-radius: 25px;
    padding: 23px;
    position: relative;
    overflow: hidden;
    margin-bottom: 18px;
    box-shadow: 0 10px 25px rgba(98,84,235,.20);
}

.story-hero-icon {
    font-size: 58px;
    margin-bottom: 8px;
}

.story-hero h2 {
    margin: 0 0 9px;
    font-size: 25px;
}

.story-hero p {
    margin: 0;
    opacity: .9;
    font-size: 13px;
    line-height: 1.7;
}

.story-meta {
    display: flex;
    gap: 8px;
    margin-top: 15px;
}

.meta-item {
    background: rgba(255,255,255,.18);
    padding: 6px 10px;
    border-radius: 20px;
    font-size: 11px;
}

.reading-tools {
    display: flex;
    gap: 9px;
    margin-bottom: 18px;
}

.tool-button {
    flex: 1;
    border: none;
    background: white;
    color: #5c51dc;
    padding: 12px 8px;
    border-radius: 14px;
    font-size: 13px;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 3px 12px rgba(0,0,0,.05);
}

.tool-button:active {
    transform: scale(.97);
}

.story-content {
    background: white;
    border-radius: 22px;
    padding: 22px;
    box-shadow: 0 3px 15px rgba(0,0,0,.05);
    margin-bottom: 18px;
}

.story-content h3 {
    margin: 0 0 17px;
    font-size: 18px;
}

.story-text {
    direction: ltr;
    text-align: left;
    font-size: 18px;
    line-height: 2;
    color: #292938;
}

.story-text p {
    margin: 0 0 17px;
}

.translation-box {
    display: none;
    background: #f3f1ff;
    border-radius: 15px;
    padding: 15px;
    margin-top: 18px;
    color: #5149a7;
    line-height: 1.8;
    font-size: 14px;
}

.translation-box.show {
    display: block;
}

.quiz-section {
    background: white;
    border-radius: 22px;
    padding: 20px;
    box-shadow: 0 3px 15px rgba(0,0,0,.05);
    margin-bottom: 18px;
}

.quiz-section h3 {
    margin: 0 0 17px;
    font-size: 18px;
}

.question {
    margin-bottom: 20px;
}

.question-text {
    font-weight: bold;
    margin-bottom: 10px;
    line-height: 1.6;
}

.answers {
    display: flex;
    flex-direction: column;
    gap: 8px;
}

.answer {
    width: 100%;
    border: 1px solid #e5e5ed;
    background: #fafafd;
    border-radius: 12px;
    padding: 11px;
    text-align: right;
    cursor: pointer;
    font-size: 13px;
}

.answer.selected {
    background: #eeeaff;
    border-color: #7669f3;
    color: #5149c8;
    font-weight: bold;
}

.answer.correct {
    background: #e4f9ef;
    border-color: #4ac58a;
    color: #20855a;
}

.answer.wrong {
    background: #fff0f3;
    border-color: #ef7187;
    color: #c83e57;
}

.check-button {
    width: 100%;
    border: none;
    border-radius: 15px;
    padding: 14px;
    background: linear-gradient(135deg,#6254eb,#8374ed);
    color: white;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
    margin-top: 20px;
}

.result-box {
    display: none;
    text-align: center;
    margin-top: 17px;
    background: #f5f4ff;
    border-radius: 15px;
    padding: 17px;
}

.result-box.show {
    display: block;
}

.result-number {
    font-size: 28px;
    font-weight: bold;
    color: #5c51dc;
    margin-bottom: 6px;
}

.result-text {
    color: #666;
    font-size: 13px;
}

.loading {
    background: white;
    border-radius: 20px;
    padding: 30px;
    text-align: center;
    color: #777;
}

.error-box {
    background: #fff0f3;
    color: #c83e57;
    border-radius: 20px;
    padding: 20px;
    text-align: center;
}

@media (max-width: 420px) {

    .story-page {
        padding-left: 14px;
        padding-right: 14px;
    }

    .story-hero {
        padding: 20px;
    }

    .story-hero h2 {
        font-size: 22px;
    }

    .story-content {
        padding: 18px;
    }

    .story-text {
        font-size: 17px;
        line-height: 1.9;
    }

}

</style>

</head>

<body>

<main class="story-page">

<header class="story-header">

```
<button
    class="back-button"
    onclick="window.location.href='reading.html'">

    →

</button>

<div class="header-title">

    <h1>Reading 📖</h1>

    <p>اقرأ ثم اختبر فهمك</p>

</div>
```

</header>

<!-- معلومات القصة -->

<section class="story-hero">

```
<div
    class="story-hero-icon"
    id="storyIcon">

    📖

</div>

<h2 id="storyTitle">
    جاري تحميل القصة...
</h2>

<p id="storyDescription">
    ...
</p>

<div class="story-meta">

    <span
        class="meta-item"
        id="storyLevel">

        --

    </span>

    <span
        class="meta-item"
        id="storyTime">

        ⏱ --

    </span>

</div>
```

</section>

<!-- أدوات القراءة -->

<div class="reading-tools">

```
<button
    class="tool-button"
    onclick="speakStory()">

    🔊 استمع

</button>

<button
    class="tool-button"
    onclick="toggleTranslation()">

    🇸🇦 الترجمة

</button>
```

</div>

<!-- القصة -->

<section class="story-content">

```
<h3>
    القصة 📖
</h3>

<div
    id="storyText"
    class="story-text">

    <div class="loading">
        جاري تحميل القصة...
    </div>

</div>

<div
    id="translationBox"
    class="translation-box">

</div>
```

</section>

<!-- الأسئلة -->

<section
    class="quiz-section"
    id="quizSection">

```
<h3>
    اختبر فهمك 📝
</h3>

<div
    id="quizContent">

    <div class="loading">
        جاري تحميل الأسئلة...
    </div>

</div>
```

</section>

</main>

<!-- Supabase -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase.js"></script>

<script>

/* ==================================================
   قراءة ID القصة من الرابط
================================================== */

const urlParams =
    new URLSearchParams(
        window.location.search
    );

const storyId =
    urlParams.get("id");


/* ==================================================
   التأكد من وجود ID
================================================== */

if (!storyId) {

    document.getElementById("storyTitle").textContent =
        "لم يتم تحديد القصة";

}


/* ==================================================
   تحميل القصة من Supabase
================================================== */

async function loadStory() {

    if (!storyId) return;

    try {

        const {
            data,
            error
        } = await supabase

            .from("reading_stories")

            .select("*")

            .eq("id", storyId)

            .eq("is_published", true)

            .single();


        if (error) {

            console.error(
                "Load story error:",
                error
            );

            showError(
                "حدث خطأ أثناء تحميل القصة."
            );

            return;

        }


        if (!data) {

            showError(
                "القصة غير موجودة."
            );

            return;

        }


        /* ==============================
           معلومات القصة
        ============================== */

        document.getElementById(
            "storyTitle"
        ).textContent =
            data.title || "بدون عنوان";


        document.getElementById(
            "storyDescription"
        ).textContent =
            data.description || "";


        document.getElementById(
            "storyIcon"
        ).textContent =
            data.icon || "📖";


        document.getElementById(
            "storyLevel"
        ).textContent =
            data.level || "--";


        document.getElementById(
            "storyTime"
        ).textContent =
            "⏱ " +
            (data.reading_time || "--") +
            " دقائق";


        /* ==============================
           محتوى القصة
        ============================== */

        displayStoryContent(
            data.content
        );


        /* ==============================
           الترجمة
        ============================== */

        displayTranslation(
            data.translation
        );


    } catch (error) {

        console.error(
            "Story loading error:",
            error
        );

        showError(
            "حدث خطأ أثناء تحميل القصة."
        );

    }

}


/* ==================================================
   عرض محتوى القصة
================================================== */

function displayStoryContent(content) {

    const container =
        document.getElementById(
            "storyText"
        );


    if (!content) {

        container.innerHTML =
            "<p>لا يوجد محتوى لهذه القصة.</p>";

        return;

    }


    /*
       كل سطر جديد يصبح فقرة
    */

    const paragraphs =
        String(content)
            .split(/\n+/)
            .filter(text => text.trim() !== "");


    container.innerHTML =
        paragraphs
            .map(text =>
                `<p>${escapeHtml(text)}</p>`
            )
            .join("");

}


/* ==================================================
   عرض الترجمة
================================================== */

function displayTranslation(translation) {

    const box =
        document.getElementById(
            "translationBox"
        );


    if (!translation) {

        box.textContent =
            "لا توجد ترجمة لهذه القصة.";

        return;

    }


    const paragraphs =
        String(translation)
            .split(/\n+/)
            .filter(text => text.trim() !== "");


    box.innerHTML =
        paragraphs
            .map(text =>
                escapeHtml(text)
            )
            .join("<br><br>");

}


/* ==================================================
   الترجمة
================================================== */

function toggleTranslation() {

    const box =
        document.getElementById(
            "translationBox"
        );

    box.classList.toggle("show");

}


/* ==================================================
   النطق
================================================== */

function speakStory() {

    if (
        !("speechSynthesis" in window)
    ) {

        alert(
            "المتصفح لا يدعم تشغيل النطق."
        );

        return;

    }


    const text =
        document.getElementById(
            "storyText"
        ).innerText;


    if (!text.trim()) return;


    window.speechSynthesis.cancel();


    const speech =
        new SpeechSynthesisUtterance(
            text
        );


    speech.lang =
        "en-US";


    speech.rate =
        0.85;


    window.speechSynthesis.speak(
        speech
    );

}


/* ==================================================
   رسالة الخطأ
================================================== */

function showError(message) {

    document.getElementById(
        "storyTitle"
    ).textContent =
        "تعذر تحميل القصة";


    document.getElementById(
        "storyDescription"
    ).textContent =
        message;


    document.getElementById(
        "storyText"
    ).innerHTML =

        `<div class="error-box">
            ${escapeHtml(message)}
        </div>`;


    document.getElementById(
        "quizContent"
    ).innerHTML =

        `<div class="error-box">
            لا يمكن تحميل الأسئلة.
        </div>`;

}


/* ==================================================
   حماية النص
================================================== */

function escapeHtml(text) {

    return String(text)

        .replace(/&/g, "&amp;")

        .replace(/</g, "&lt;")

        .replace(/>/g, "&gt;")

        .replace(/"/g, "&quot;")

        .replace(/'/g, "&#039;");

}


/* ==================================================
   تشغيل الصفحة
================================================== */

loadStory();

</script>

</body>

</html>
